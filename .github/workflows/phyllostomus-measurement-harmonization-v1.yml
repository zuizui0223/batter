name: phyllostomus-measurement-harmonization-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/phyllostomus_measurement_harmonization_v1.py
      - prospective/field_policy_bridge/PHYLLOSTOMUS_MEASUREMENT_HARMONIZATION_CONTRACT_V1.md
      - .github/workflows/phyllostomus-measurement-harmonization-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harmonize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet -e .
      - name: Run frozen 360-s harmonization diagnostic
        run: |
          python prospective/field_policy_bridge/phyllostomus_measurement_harmonization_v1.py | tee prospective/field_policy_bridge/PHYLLOSTOMUS_MEASUREMENT_HARMONIZATION_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: phyllostomus-measurement-harmonization-v1
          path: prospective/field_policy_bridge/PHYLLOSTOMUS_MEASUREMENT_HARMONIZATION_RESULT_V1.json
          if-no-files-found: error

# retrigger: measurement harmonization audit
