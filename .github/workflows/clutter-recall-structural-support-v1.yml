name: clutter-recall-structural-support-v1

on:
  push:
    branches:
      - prospective/clutter-recall-policy-v1
    paths:
      - prospective/clutter_recall_policy/structural_support_v1.py
      - prospective/clutter_recall_policy/STRUCTURAL_ROW_VALUE_ALLOWLIST_V1.md
      - .github/workflows/clutter-recall-structural-support-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard acoustic outcomes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("prospective/clutter_recall_policy/structural_support_v1.py").read_text()
          banned=['"R"','"S"',"CallStartPower","CallPeakPower","CallEndPower"]
          hits=[x for x in banned if x in p]
          if hits:
              raise SystemExit(f"outcome guard failed: {hits}")
          print("outcome guard PASS")
          PY
      - name: Open structural rows only
        shell: bash
        run: |
          set -euo pipefail
          python prospective/clutter_recall_policy/structural_support_v1.py | tee prospective/clutter_recall_policy/STRUCTURAL_SUPPORT_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clutter-recall-structural-support-v1
          path: prospective/clutter_recall_policy/STRUCTURAL_SUPPORT_RESULT_V1.json
          if-no-files-found: warn
