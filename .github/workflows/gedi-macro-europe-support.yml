name: European domain trait support census
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/europe_support_census_v1.py
      - .github/workflows/gedi-macro-europe-support.yml
permissions:
  contents: read
  actions: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gedi-macro-iberia-join
          run-id: 45575962660
          github-token: ${{ github.token }}
          path: prior_occurrences
      - run: python -m pip install requests pyproj
      - run: python prospective/gedi_trait_macro_sdm/europe_support_census_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-own-database-support-v1
          path: europe_support/
          retention-days: 90
          if-no-files-found: error
