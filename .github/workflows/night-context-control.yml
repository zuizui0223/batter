name: night-context-control-v1

on:
  push:
    branches:
      - study/individual-vertical-strategies-v1
    paths:
      - "scripts/run_night_context_control.py"
      - "contract/night_context_control_v1.json"
      - ".github/workflows/night-context-control.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/run_night_context_control.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-night-context-control-v1
          path: results/night_context_control_v1.json
