name: GVSM Iberian real environmental integration
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/integrate_gvsm_iberia.py
      - .github/workflows/gvsm-iberia-integration.yml
permissions:
  contents: read
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gedi-macro-iberia-join
          run-id: 45575962660
          github-token: ${{ github.token }}
          path: occ
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-iberia-real-source
          run-id: 45577861777
          github-token: ${{ github.token }}
          path: gvsm
      - uses: actions/download-artifact@v4
        with:
          name: iberia-chelsa-baseline
          run-id: 45576537101
          github-token: ${{ github.token }}
          path: climate
      - uses: actions/download-artifact@v4
        with:
          name: iberia-worldcover-baseline
          run-id: 45576649247
          github-token: ${{ github.token }}
          path: landcover
      - run: python -m pip install numpy rasterio pyproj
      - run: python prospective/gedi_trait_macro_sdm/integrate_gvsm_iberia.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gvsm-iberia-integrated
          path: gvsm_iberia_integrated/
          if-no-files-found: error
