name: rhino-one-parameter-calibration-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/one_parameter_calibration_v1.py
      - prospective/task_reset_lockin/ONE_PARAMETER_CALIBRATION_CONTRACT_V1.md
      - .github/workflows/rhino-one-parameter-calibration-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy
      - name: Run one-parameter held-out calibration
        run: |
          python prospective/task_reset_lockin/one_parameter_calibration_v1.py | tee prospective/task_reset_lockin/ONE_PARAMETER_CALIBRATION_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-one-parameter-calibration-v1
          path: prospective/task_reset_lockin/ONE_PARAMETER_CALIBRATION_RESULT_V1.json
          if-no-files-found: error
