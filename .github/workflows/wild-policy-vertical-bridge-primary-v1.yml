name: wild-policy-vertical-bridge-primary-v1

on:
  push:
    branches:
      - prospective/wild-policy-vertical-bridge-v1
    paths:
      - prospective/wild_policy_vertical_bridge/bridge_primary_v1.py
      - prospective/wild_policy_vertical_bridge/STRUCTURAL_GATE_FREEZE_V1.json
      - prospective/wild_policy_vertical_bridge/BRIDGE_CONTRACT_V1.md
      - prospective/wild_policy_vertical_bridge/COHORT_STRATIFICATION_AMENDMENT_V1.md
      - .github/workflows/wild-policy-vertical-bridge-primary-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        panel:
          - hypsignathus
          - phyllostomus_2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet numpy pyproj
      - name: Verify frozen gate authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.loads(Path("prospective/wild_policy_vertical_bridge/STRUCTURAL_GATE_FREEZE_V1.json").read_text())
          panel="${{ matrix.panel }}"
          assert panel in f["authorized_panels"]
          assert f["panels"][panel]["verdict"]=="PASS_TO_VERTICAL_BRIDGE"
          assert f["frozen_before_vertical_bridge_outcome"] is True
          print("frozen authorization PASS", panel)
          PY
      - name: Run frozen reciprocal bridge
        run: |
          python prospective/wild_policy_vertical_bridge/bridge_primary_v1.py --panel "${{ matrix.panel }}" | tee "prospective/wild_policy_vertical_bridge/PRIMARY_RESULT_${{ matrix.panel }}_V1.json"
      - uses: actions/upload-artifact@v4
        with:
          name: wild-policy-vertical-bridge-${{ matrix.panel }}-v1
          path: prospective/wild_policy_vertical_bridge/PRIMARY_RESULT_${{ matrix.panel }}_V1.json
          if-no-files-found: error
