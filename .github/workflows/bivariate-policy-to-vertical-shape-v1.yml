name: bivariate-policy-to-vertical-shape-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/bivariate_policy_to_vertical_shape_v1.py
      - prospective/field_policy_bridge/BIVARIATE_POLICY_TO_VERTICAL_SHAPE_CONTRACT_V1.md
      - .github/workflows/bivariate-policy-to-vertical-shape-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bivariate-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install batter and dependencies
        run: python -m pip install --quiet -e .
      - name: Run bivariate policy-to-shape localization
        run: |
          python prospective/field_policy_bridge/bivariate_policy_to_vertical_shape_v1.py | tee prospective/field_policy_bridge/BIVARIATE_POLICY_TO_VERTICAL_SHAPE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: bivariate-policy-to-vertical-shape-v1
          path: prospective/field_policy_bridge/BIVARIATE_POLICY_TO_VERTICAL_SHAPE_RESULT_V1.json
          if-no-files-found: error
