name: manuscript-figures-v0.3.1

on:
  push:
    branches:
      - main
      - study/individual-vertical-strategies-v1
    paths:
      - "figures/architecture_summary_v0_3_1.csv"
      - "scripts/plot_manuscript_architecture.py"
      - ".github/workflows/manuscript-figures.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install matplotlib
      - run: python scripts/plot_manuscript_architecture.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-manuscript-figures-v0-3-1
          path: figures/generated/
