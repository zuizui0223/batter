name: Roost FD coarse terrain V8
on:
  push:
    branches: [prospective/roost-3d-connectivity-fd-20261124]
    paths:
      - scripts/roost_fd_coarse_terrain_v8.py
      - .github/workflows/roost-fd-coarse-terrain-v8.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==1.26.4 requests==2.32.3 openpyxl==3.1.5 remotezip==0.12.3 rasterio==1.4.3 scipy==1.13.1 scikit-learn==1.5.2
      - run: python scripts/roost_fd_coarse_terrain_v8.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roost-fd-coarse-terrain-v8
          path: roost_fd_audit/terrain_v8.json
          if-no-files-found: error
