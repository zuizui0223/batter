name: H1 2007 Safi Kerth original species-outcome schema gate
on:
  push:
    branches: [prospective/social-information-macro-h1-v1]
    paths:
      - 'prospective/social_macro_h1/h1_male_sociality_2007_source_gate_v1.py'
      - '.github/workflows/h1-2007-male-sociality-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-species-outcome-source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Attempt two official original publisher formats (not behavioral outcomes)
        id: source
        continue-on-error: true
        env:
          H1_MALE_SOCIALITY_SOURCE_RECEIPT: /tmp/h1_2007_original_source_gate.json
        run: python prospective/social_macro_h1/h1_male_sociality_2007_source_gate_v1.py
      - name: Upload metadata only (never the original licensed supplement)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-macro-male-sociality-2007-source-receipt
          path: /tmp/h1_2007_original_source_gate.json
          if-no-files-found: error
      - name: STOP without original source
        if: steps.source.outcome == 'failure'
        run: |
          echo "::error::Original Safi/Kerth comparative matrix cannot be opened; no species-level new result."
          exit 1
