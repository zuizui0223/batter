name: phyllostomus-fixed-bin-bivariate-carrier-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/phyllostomus_fixed_bin_bivariate_carrier_v1.py
      - prospective/field_policy_bridge/PHYLLOSTOMUS_FIXED_BIN_BIVARIATE_CARRIER_CONTRACT_V1.md
      - .github/workflows/phyllostomus-fixed-bin-bivariate-carrier-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bivariate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install batter and dependencies
        run: python -m pip install --quiet -e .
      - name: Run bivariate fixed-bin carrier diagnostic
        run: |
          python prospective/field_policy_bridge/phyllostomus_fixed_bin_bivariate_carrier_v1.py | tee prospective/field_policy_bridge/PHYLLOSTOMUS_FIXED_BIN_BIVARIATE_CARRIER_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: phyllostomus-fixed-bin-bivariate-carrier-v1
          path: prospective/field_policy_bridge/PHYLLOSTOMUS_FIXED_BIN_BIVARIATE_CARRIER_RESULT_V1.json
          if-no-files-found: error
