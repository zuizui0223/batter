name: crowd-learning-figure2-primary-v1

on:
  push:
    paths:
      - "prospective/crowd_learning_personal_offset/FIGURE2_SUPPORT_RESULT_V1.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crowd-learning-figure2-primary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  primary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/crowd-learning-personal-offset-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen support gate
        run: |
          python - <<'PY'
          import json
          p="prospective/crowd_learning_personal_offset/FIGURE2_SUPPORT_RESULT_V1.json"
          x=json.load(open(p))
          assert x["gate"]=="PASS_FIGURE2_REPEATED_SUPPORT"
          assert x["reconstructed_units"]==56
          assert x["minimum_paired_support"]>=5
          print("PASS frozen Figure-2 support gate")
          PY

      - name: Install numerical reader
        run: python -m pip install numpy openpyxl

      - name: Run frozen 345600-assignment primary
        run: python prospective/crowd_learning_personal_offset/run_figure2_personal_offset_primary_v1.py

      - name: Commit primary receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/crowd_learning_personal_offset/FIGURE2_PERSONAL_OFFSET_RESULT_V1.json
          git add prospective/crowd_learning_personal_offset/FIGURE2_PERSONAL_OFFSET_RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Record crowd-learning Figure-2 personal-offset result"
            for attempt in 1 2 3 4 5; do
              git fetch origin prospective/crowd-learning-personal-offset-v1
              git rebase origin/prospective/crowd-learning-personal-offset-v1
              if git push origin HEAD:prospective/crowd-learning-personal-offset-v1; then
                exit 0
              fi
              echo "Push race on attempt $attempt; retrying"
              sleep $((attempt * 2))
            done
            exit 1
          fi
