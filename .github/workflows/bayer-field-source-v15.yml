name: Bayer wild bat GPS field source gate V15
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/bayer_field_source_v15.py
      - .github/workflows/bayer-field-source-v15.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/bayer_field_source_v15.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayer-field-source-v15
          path: results/bayer_field_source_v15.json
          if-no-files-found: error
          retention-days: 60
