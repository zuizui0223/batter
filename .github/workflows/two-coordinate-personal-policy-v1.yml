name: two-coordinate-personal-policy-v1
on:
  push:
    branches: [post-freeze/two-coordinate-personal-policy-v1]
    paths:
      - "prospective/task_reset_lockin/two_coordinate_personal_policy_v1.py"
      - ".github/workflows/two-coordinate-personal-policy-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python prospective/task_reset_lockin/two_coordinate_personal_policy_v1.py > two_coordinate_personal_policy_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: two-coordinate-personal-policy-v1
          path: two_coordinate_personal_policy_result_v1.json
          if-no-files-found: error
