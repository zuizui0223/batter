name: pteropus-poliocephalus-structural-v1
on:
  push:
    branches: [prospective/pteropus-poliocephalus-preflight-v1]
    paths:
      - "post_freeze_extensions/comparative_generality/pteropus_poliocephalus/structural_*"
      - ".github/workflows/pteropus-poliocephalus-structural-v1.yml"
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas requests
      - name: Run outcome-blind structural preflight
        run: python post_freeze_extensions/comparative_generality/pteropus_poliocephalus/run_structural_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-pteropus-poliocephalus-structural-v1
          path: |
            post_freeze_extensions/comparative_generality/pteropus_poliocephalus/structural_result_v1.json
            post_freeze_extensions/comparative_generality/pteropus_poliocephalus/STRUCTURAL_RESULT_V1.md
          if-no-files-found: error
      - name: Pin structural result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             post_freeze_extensions/comparative_generality/pteropus_poliocephalus/structural_result_v1.json             post_freeze_extensions/comparative_generality/pteropus_poliocephalus/STRUCTURAL_RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No structural changes"
          else
            git commit -m "Record Pteropus poliocephalus structural preflight"
            git push origin HEAD:prospective/pteropus-poliocephalus-preflight-v1
          fi
