name: source-b-early-seed-vs-recent-history-v1

on:
  push:
    branches:
      - prospective/ontogenetic-path-dependence-v1
    paths:
      - prospective/ontogenetic_path_dependence/EARLY_SEED_VS_RECENT_HISTORY_DIAGNOSTIC_V1.md
      - prospective/ontogenetic_path_dependence/early_seed_vs_recent_history_diagnostic_v1.py
      - .github/workflows/source-b-early-seed-vs-recent-history-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Download identity-verified ordinary source files
        run: python prospective/ontogenetic_path_dependence/download_source_b_matlab_structural_v1.py
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
      - name: Rebuild frozen standardized coordinate bridge
        uses: matlab-actions/run-command@v2
        with:
          command: addpath("prospective/ontogenetic_path_dependence"), source_b_matlab_standardized_bridge_v2
      - name: Run early-seed versus recent-history diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python prospective/ontogenetic_path_dependence/early_seed_vs_recent_history_diagnostic_v1.py | tee prospective/ontogenetic_path_dependence/EARLY_SEED_VS_RECENT_HISTORY_DIAGNOSTIC_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-b-early-seed-vs-recent-history-v1
          path: prospective/ontogenetic_path_dependence/EARLY_SEED_VS_RECENT_HISTORY_DIAGNOSTIC_RESULT_V1.json
          if-no-files-found: warn
