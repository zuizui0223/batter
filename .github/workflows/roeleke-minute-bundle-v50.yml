name: Roeleke minute bundle functional space V50
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/roeleke_minute_bundle_v50.py
      - .github/workflows/roeleke-minute-bundle-v50.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy pyproj
      - run: python scripts/roeleke_minute_bundle_v50.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roeleke-minute-bundle-v50
          path: results/roeleke_minute_bundle_v50.json
          if-no-files-found: error
          retention-days: 60
