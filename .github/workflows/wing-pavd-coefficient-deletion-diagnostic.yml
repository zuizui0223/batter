name: Wing PAVD coefficient deletion stability
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/wing-pavd-coefficient-deletion-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4c4e14493f708c3c602e70f24b3b23e782c1b593
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: crane-physical-lsa-crosswalk-v1
          run-id: 45717291943
          github-token: ${{ github.token }}
          path: wing
      - uses: actions/download-artifact@v4
        with:
          name: wing-pavd-frozen-europe-transfer-model
          run-id: 45718786057
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: europe-common-forest-support-v1
          run-id: 45585033345
          github-token: ${{ github.token }}
          path: pilot
      - uses: actions/download-artifact@v4
        with:
          name: baseline-lc100-alternative-v1
          run-id: 45713474572
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: gedi-measured-grid-validation-v1
          run-id: 45715480130
          github-token: ${{ github.token }}
          path: .
      - run: python -m pip install numpy pandas scipy
      - run: python prospective/gedi_trait_macro_sdm/wing_pavd_coefficient_deletion_diagnostic_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wing-pavd-deletion-stability-v1
          path: wing_deletion_stability/report.json
          if-no-files-found: warn
