name: jae-review-pdf-v0.3.3

on:
  push:
    branches:
      - revision/jae-v0.3.3-full-draft
      - revision/jae-v0.3.3-ethics-provenance
      - main
    paths:
      - "manuscript/MANUSCRIPT_DRAFT_V0_3_3.md"
      - "manuscript/jae_review_header.tex"
      - "scripts/prepare_jae_review_markdown.py"
      - ".github/workflows/jae-review-pdf-v0.3.3.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare anonymous review markdown
        run: python scripts/prepare_jae_review_markdown.py
      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra poppler-utils
      - name: Render double-spaced line-numbered review PDF
        run: |
          pandoc manuscript/generated/JAE_REVIEW_V0_3_3.md             --from=gfm             --standalone             --pdf-engine=xelatex             --include-in-header=manuscript/jae_review_header.tex             --variable fontsize=11pt             --metadata author=""             --metadata date=""             -o manuscript/generated/JAE_REVIEW_V0_3_3.pdf
          pdfinfo manuscript/generated/JAE_REVIEW_V0_3_3.pdf | grep -E "^(Pages|Page size):"
      - uses: actions/upload-artifact@v4
        with:
          name: batter-jae-review-manuscript-v0-3-3
          path: |
            manuscript/generated/JAE_REVIEW_V0_3_3.md
            manuscript/generated/JAE_REVIEW_V0_3_3.pdf
          if-no-files-found: error
