name: GEDI measured matched profile artifact replay
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/gedi-measured-matched-fit-replay.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 463d7bb2db634847fb72e4d61754448c5bbd7917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: europe-common-forest-support-v1
          run-id: 45585033345
          github-token: ${{ github.token }}
          path: pilot
      - uses: actions/download-artifact@v4
        with:
          name: baseline-covariates-terrain
          run-id: 45659440994
          github-token: ${{ github.token }}
          path: baseline_terrain
      - uses: actions/download-artifact@v4
        with:
          name: baseline-lc100-alternative-v1
          run-id: 45713474572
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: gedi-measured-grid-validation-v1
          run-id: 45715480130
          github-token: ${{ github.token }}
          path: .
      - run: python -m pip install numpy pandas scipy
      - run: python prospective/gedi_trait_macro_sdm/gedi_matched_profile_fit_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gedi-measured-matched-fit-replay
          path: gedi_matched_fit/report.json
          if-no-files-found: error
