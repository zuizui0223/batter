name: Wing traits measured PAVD continental training freeze
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/wing-pavd-continental-train.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 22e677153280eb81707fb0a673a6732ccb7654e7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: crane-physical-lsa-crosswalk-v1
          run-id: 45717291943
          github-token: ${{ github.token }}
          path: wing
      - uses: actions/download-artifact@v4
        with:
          name: europe-common-forest-support-v1
          run-id: 45585033345
          github-token: ${{ github.token }}
          path: pilot
      - uses: actions/download-artifact@v4
        with:
          name: baseline-lc100-alternative-v1
          run-id: 45713474572
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: gedi-measured-grid-validation-v1
          run-id: 45715480130
          github-token: ${{ github.token }}
          path: .
      - run: python -m pip install numpy pandas scipy
      - run: python prospective/gedi_trait_macro_sdm/wing_pavd_continental_transfer_v1.py train
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wing-pavd-frozen-europe-transfer-model
          path: wing_pavd_transfer/
          if-no-files-found: error
          retention-days: 90
