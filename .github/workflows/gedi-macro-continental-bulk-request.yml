name: GBIF official continental bulk request
on:
  workflow_dispatch:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/gedi-macro-continental-bulk-request.yml
permissions:
  contents: read
concurrency:
  group: continental-gbif-bulk-request
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python prospective/gedi_trait_macro_sdm/continental_gbif_bulk_request_v1.py
        env:
          GBIF_USERNAME: ${{ secrets.GBIF_USERNAME }}
          GBIF_PASSWORD: ${{ secrets.GBIF_PASSWORD }}
          GBIF_USER: ${{ secrets.GBIF_USER }}
          GBIF_PWD: ${{ secrets.GBIF_PWD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continental-gbif-bulk-request-v1
          path: continental_bulk_request/
          if-no-files-found: error
          retention-days: 90
