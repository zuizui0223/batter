name: Currie public Figshare supplement and analytic wind geometry v4
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/currie_figshare_s2_source_v4.py
      - scripts/fixed_speed_wind_geometry_v3.py
      - .github/workflows/power-figshare-s2-v4.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6
      - run: python scripts/fixed_speed_wind_geometry_v3.py
      - run: python scripts/currie_figshare_s2_source_v4.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: currie-figshare-s2-and-fixed-speed-wind-v4
          path: |
            results/currie_figshare_s2_source_v4.json
            results/fixed_speed_wind_geometry_v3.json
          retention-days: 60
          if-no-files-found: error
