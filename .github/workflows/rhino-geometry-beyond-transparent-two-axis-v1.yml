name: rhino-geometry-beyond-transparent-two-axis-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/GEOMETRY_BEYOND_TRANSPARENT_TWO_AXIS_CONTRACT_V1.md
      - prospective/task_reset_lockin/geometry_beyond_transparent_two_axis_v1.py
      - .github/workflows/rhino-geometry-beyond-transparent-two-axis-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run geometry beyond transparent I/M diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python prospective/task_reset_lockin/geometry_beyond_transparent_two_axis_v1.py | tee prospective/task_reset_lockin/GEOMETRY_BEYOND_TRANSPARENT_TWO_AXIS_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhino-geometry-beyond-transparent-two-axis-v1
          path: prospective/task_reset_lockin/GEOMETRY_BEYOND_TRANSPARENT_TWO_AXIS_RESULT_V1.json
          if-no-files-found: warn
