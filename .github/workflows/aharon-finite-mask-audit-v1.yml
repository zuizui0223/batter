name: aharon-finite-mask-audit-v1

on:
  push:
    paths:
      - "prospective/public_perturbation_audit/AHARON_PRIMARY_STRUCTURAL_SELECTION_V1.json"
      - "prospective/public_perturbation_audit/AHARON_FINITE_MASK_AUDIT_CONTRACT_V1.md"
      - "prospective/public_perturbation_audit/aharon_finite_mask_audit_v1.py"
      - ".github/workflows/aharon-finite-mask-audit-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/public-perturbation-audit-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install readers/browser
        run: |
          python -m pip install playwright numpy scipy
          python -m playwright install --with-deps chromium
      - name: Run finite-mask support audit
        run: python prospective/public_perturbation_audit/aharon_finite_mask_audit_v1.py
      - name: Commit support receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/public_perturbation_audit/AHARON_FINITE_MASK_AUDIT_V1.json
          git add prospective/public_perturbation_audit/AHARON_FINITE_MASK_AUDIT_V1.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record Aharon finite-mask support audit"
            git pull --rebase origin prospective/public-perturbation-audit-v1
            git push
          fi
