name: pinna-flight-zenodo2026-categorical-gate-v1
on:
  push:
    branches:
      - prospective/zenodo-pinna-flight-identity-gate-v1
    paths:
      - "prospective/external_pinna_2026/preflight_pinna_categorical_v1.py"
      - ".github/workflows/pinna-flight-zenodo2026-categorical-gate-v1.yml"
  workflow_dispatch:
jobs:
  source-categorical-keys-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install 'requests==2.32.5'
      - name: Pure header/assignment preflight
        run: |
          python -m py_compile prospective/external_pinna_2026/preflight_pinna_categorical_v1.py
          python prospective/external_pinna_2026/preflight_pinna_categorical_v1.py --self-test
      - name: Categorical batID and recording-file support only
        run: |
          python prospective/external_pinna_2026/preflight_pinna_categorical_v1.py --out PINNA_FLIGHT_CATEGORICAL_RECEIPT_V1.json
          python - <<'PY'
          import json
          x=json.load(open("PINNA_FLIGHT_CATEGORICAL_RECEIPT_V1.json"))
          assert x["source_doi"]=="10.5281/zenodo.20927789"
          assert x["raw_measurements_opened"] is False
          assert x["status"] in ("STOP_NO_INDEPENDENT_INDIVIDUAL_BOUTS","STOP_SOURCE_INACCESSIBLE")
          print("categorical-only status:",x["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pinna-flight-zenodo2026-categorical-gate-v1
          path: PINNA_FLIGHT_CATEGORICAL_RECEIPT_V1.json
          if-no-files-found: error
