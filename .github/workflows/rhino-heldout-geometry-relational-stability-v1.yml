name: rhino-heldout-geometry-relational-stability-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/HELDOUT_GEOMETRY_RELATIONAL_STABILITY_CONTRACT_V1.md
      - prospective/task_reset_lockin/heldout_geometry_relational_stability_v1.py
      - .github/workflows/rhino-heldout-geometry-relational-stability-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relational:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run held-out geometry relational stability
        shell: bash
        run: |
          set -euo pipefail
          python prospective/task_reset_lockin/heldout_geometry_relational_stability_v1.py | tee prospective/task_reset_lockin/HELDOUT_GEOMETRY_RELATIONAL_STABILITY_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhino-heldout-geometry-relational-stability-v1
          path: prospective/task_reset_lockin/HELDOUT_GEOMETRY_RELATIONAL_STABILITY_RESULT_V1.json
          if-no-files-found: warn
