name: acoustic-policy-primary-v1

on:
  push:
    paths:
      - "prospective/auditory_perturbation_policy/ACOUSTIC_POLICY_PRIMARY_V1.md"
      - "prospective/auditory_perturbation_policy/run_acoustic_policy_primary_v1.py"
      - "prospective/auditory_perturbation_policy/STRUCTURAL_RESULT_V1.json"
      - ".github/workflows/acoustic-policy-primary-v1.yml"
  workflow_dispatch:

concurrency:
  group: acoustic-policy-primary-v1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  primary:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/auditory-perturbation-policy-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy scipy
      - name: Run frozen exact-identity self-test
        working-directory: prospective/auditory_perturbation_policy
        run: python acoustic_policy_primary_self_test_v1.py
      - name: Run frozen acoustic-policy primary
        run: python prospective/auditory_perturbation_policy/run_acoustic_policy_primary_v1.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/auditory_perturbation_policy/ACOUSTIC_POLICY_RESULT_V1.json
          git add prospective/auditory_perturbation_policy/ACOUSTIC_POLICY_RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Record frozen acoustic policy result"
            git push
          fi
