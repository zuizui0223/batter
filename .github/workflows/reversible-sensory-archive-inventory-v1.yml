name: reversible-sensory-archive-inventory-v1

on:
  push:
    branches:
      - prospective/reversible-sensory-perturbation-v2
    paths:
      - prospective/reversible_sensory_perturbation_v2/archive_inventory_v1.py
      - prospective/reversible_sensory_perturbation_v2/ARCHIVE_INVENTORY_CONTRACT_V1.md
      - .github/workflows/reversible-sensory-archive-inventory-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ZIP central-directory inventory
        shell: bash
        run: |
          set -euo pipefail
          python prospective/reversible_sensory_perturbation_v2/archive_inventory_v1.py | tee prospective/reversible_sensory_perturbation_v2/ARCHIVE_INVENTORY_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reversible-sensory-archive-inventory-v1
          path: prospective/reversible_sensory_perturbation_v2/ARCHIVE_INVENTORY_RESULT_V1.json
          if-no-files-found: warn
