name: pteropus-terrain-leak-v1

on:
  push:
    branches: [revision/integrated-ecological-contingency-v1]
    paths:
      - "post_freeze_extensions/PTEROPUS_TERRAIN_LEAK_CONTRACT_V1.md"
      - "post_freeze_extensions/pteropus_terrain_leak/run_v1.py"
      - ".github/workflows/pteropus-terrain-leak-v1.yml"
  workflow_dispatch:

jobs:
  terrain-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pandas numpy requests pyproj
      - name: Require frozen contract
        run: test -f post_freeze_extensions/PTEROPUS_TERRAIN_LEAK_CONTRACT_V1.md
      - name: Run frozen terrain-leak diagnostic
        run: python post_freeze_extensions/pteropus_terrain_leak/run_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-pteropus-terrain-leak-v1
          path: |
            post_freeze_extensions/pteropus_terrain_leak/result_v1.json
            post_freeze_extensions/pteropus_terrain_leak/RESULT_V1.md
          if-no-files-found: error
      - name: Pin diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post_freeze_extensions/pteropus_terrain_leak/result_v1.json post_freeze_extensions/pteropus_terrain_leak/RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Record frozen Pteropus terrain-leak diagnostic"
            git push origin HEAD:revision/integrated-ecological-contingency-v1
          fi
