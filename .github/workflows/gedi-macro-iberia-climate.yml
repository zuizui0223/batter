name: GEDI macro Iberian climate baseline
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/prepare_iberia_baseline.py
      - .github/workflows/gedi-macro-iberia-climate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  climate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'rasterio>=1.4' numpy
      - run: python prospective/gedi_trait_macro_sdm/prepare_iberia_baseline.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iberia-chelsa-baseline
          path: iberia_baseline/
          if-no-files-found: error
