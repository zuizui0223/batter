name: older-history-allocation-persistence-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/older_history_allocation_persistence_v1.py
      - prospective/field_policy_bridge/OLDER_HISTORY_ALLOCATION_PERSISTENCE_CONTRACT_V1.md
      - .github/workflows/older-history-allocation-persistence-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  older-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet -e .
      - name: Run older-history allocation persistence test
        run: |
          python prospective/field_policy_bridge/older_history_allocation_persistence_v1.py | tee prospective/field_policy_bridge/OLDER_HISTORY_ALLOCATION_PERSISTENCE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: older-history-allocation-persistence-v1
          path: prospective/field_policy_bridge/OLDER_HISTORY_ALLOCATION_PERSISTENCE_RESULT_V1.json
          if-no-files-found: warn
