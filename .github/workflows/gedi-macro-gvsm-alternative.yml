name: GVSM alternative real raster gate
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/gvsm_source_gate.py
      - .github/workflows/gedi-macro-gvsm-alternative.yml
permissions:
  contents: read
jobs:
  gvsm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'rasterio>=1.4' numpy requests
      - run: python prospective/gedi_trait_macro_sdm/gvsm_source_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gvsm-iberia-real-source
          path: gvsm_source/
          if-no-files-found: error
