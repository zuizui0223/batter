name: BCID wing morphology confusion diagnostic
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/bcid_wing_confusion_diagnostic_v1.py
      - .github/workflows/bcid-wing-confusion-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: crane-physical-lsa-crosswalk-v1
          run-id: 45717291943
          github-token: ${{ github.token }}
          path: wing
      - run: python -m pip install numpy pandas requests
      - run: python prospective/gedi_trait_macro_sdm/bcid_wing_confusion_diagnostic_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bcid-wing-confusion-diagnostic-v1
          path: bcid_wing_confusion/report.json
          if-no-files-found: warn
