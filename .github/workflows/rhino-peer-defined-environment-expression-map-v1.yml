name: rhino-peer-defined-environment-expression-map-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/PEER_DEFINED_ENVIRONMENT_EXPRESSION_MAP_CONTRACT_V1.md
      - prospective/task_reset_lockin/peer_defined_environment_expression_map_v1.py
      - .github/workflows/rhino-peer-defined-environment-expression-map-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run peer-defined environment expression map test
        shell: bash
        run: |
          set -euo pipefail
          python prospective/task_reset_lockin/peer_defined_environment_expression_map_v1.py | tee prospective/task_reset_lockin/PEER_DEFINED_ENVIRONMENT_EXPRESSION_MAP_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhino-peer-defined-environment-expression-map-v1
          path: prospective/task_reset_lockin/PEER_DEFINED_ENVIRONMENT_EXPRESSION_MAP_RESULT_V1.json
          if-no-files-found: warn
