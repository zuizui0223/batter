name: p2023-couse-temporal-gradient-v1

on:
  push:
    branches:
      - post-freeze/3d-niche-partition-v1
    paths:
      - "post_freeze_extensions/3d_niche_partition/run_p2023_couse_temporal_gradient_v1.py"
      - "post_freeze_extensions/3d_niche_partition/P2023_COUSE_TEMPORAL_GRADIENT_PREFLIGHT_RECEIPT_V1.md"
      - "post_freeze_extensions/3d_niche_partition/p2023_couse_temporal_gradient_preflight_receipt_v1.json"
      - ".github/workflows/p2023-couse-temporal-gradient-v1.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  gradient:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pandas requests pyproj
      - name: Run frozen 2023 temporal-gradient diagnostic
        run: python post_freeze_extensions/3d_niche_partition/run_p2023_couse_temporal_gradient_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: p2023-couse-temporal-gradient-v1
          path: post_freeze_extensions/3d_niche_partition/p2023_couse_temporal_gradient_result_v1.json
          if-no-files-found: error
