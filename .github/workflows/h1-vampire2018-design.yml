name: H1 2018 vampire bat maze original design/subject gate
on:
  push:
    branches: [prospective/social-information-macro-h1-v1]
    paths:
      - 'prospective/social_macro_h1/h1_vampire2018_design_gate_v1.py'
      - '.github/workflows/h1-vampire2018-design.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-factor-levels-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original MD5, phases, experimental IDs, role and balanced observation units
        run: python prospective/social_macro_h1/h1_vampire2018_design_gate_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1-vampire2018-original-factor-levels
          path: /tmp/h1_vampire2018_design_receipt.json
          if-no-files-found: error
