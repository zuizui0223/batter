name: couse-shiftability-v1

on:
  push:
    branches:
      - post-freeze/3d-niche-partition-v1
    paths:
      - "post_freeze_extensions/3d_niche_partition/run_couse_shiftability_v1.py"
      - "post_freeze_extensions/3d_niche_partition/COUSE_NULL_AMENDMENT_V1.md"
      - "post_freeze_extensions/3d_niche_partition/couse_vertical_separation_contract_v1.json"
      - "post_freeze_extensions/3d_niche_partition/couse_endpoint_audit_summary_v1.json"
      - ".github/workflows/couse-shiftability-v1.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  shiftability:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        panel:
          - hypsignathus
          - phyllostomus_2022
          - phyllostomus_2023
          - phyllostomus_2016
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pandas requests pyproj
      - name: Run pre-vertical phase-shiftability audit
        run: python post_freeze_extensions/3d_niche_partition/run_couse_shiftability_v1.py --panel "${{ matrix.panel }}"
      - uses: actions/upload-artifact@v4
        with:
          name: couse-shiftability-${{ matrix.panel }}-v1
          path: post_freeze_extensions/3d_niche_partition/couse_shiftability/${{ matrix.panel }}_shiftability_v1.json
          if-no-files-found: error
