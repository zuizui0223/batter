name: rhino-configuration-identity-primary-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/rhino_configuration_identity_primary_v1.py
      - prospective/task_reset_lockin/CONFIGURATION_CONDITIONED_IDENTITY_CONTRACT_V1.md
      - prospective/task_reset_lockin/ESTIMATOR_IMPLEMENTATION_CLARIFICATION_V1.md
      - prospective/task_reset_lockin/RHINO_COORDINATE_SUPPORT_RESULT_V1.md
      - .github/workflows/rhino-configuration-identity-primary-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numeric dependency
        run: python -m pip install --quiet numpy
      - name: Syntax check
        run: python -m py_compile prospective/task_reset_lockin/rhino_configuration_identity_primary_v1.py
      - name: Guard species and pulse boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("prospective/task_reset_lockin/rhino_configuration_identity_primary_v1.py").read_text()
          required=["RHINO_MIN = 55033853","RHINO_MAX = 55033985","pulse_values_used"]
          missing=[x for x in required if x not in p]
          if missing:
              raise SystemExit(f"boundary guard missing: {missing}")
          if "55033796" in p or "55033850" in p:
              raise SystemExit("Miniopterus file-id boundary unexpectedly present")
          print("species/pulse boundary guard PASS")
          PY
      - name: Open frozen Rhino primaries
        run: |
          python prospective/task_reset_lockin/rhino_configuration_identity_primary_v1.py | tee prospective/task_reset_lockin/RHINO_CONFIGURATION_IDENTITY_PRIMARY_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-configuration-identity-primary-v1
          path: prospective/task_reset_lockin/RHINO_CONFIGURATION_IDENTITY_PRIMARY_RESULT_V1.json
          if-no-files-found: error
