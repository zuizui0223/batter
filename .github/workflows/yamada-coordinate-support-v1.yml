name: yamada-coordinate-support-v1
on:
  push:
    branches: [prospective/learning-state-theta-v1]
    paths:
      - prospective/learning_state_theta/coordinate_support_v1.py
      - prospective/learning_state_theta/COORDINATE_SUPPORT_OPENING_V1.md
      - .github/workflows/yamada-coordinate-support-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet numpy
      - name: Run coordinate support gate
        run: python prospective/learning_state_theta/coordinate_support_v1.py | tee prospective/learning_state_theta/COORDINATE_SUPPORT_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: yamada-coordinate-support-v1
          path: prospective/learning_state_theta/COORDINATE_SUPPORT_RESULT_V1.json
          if-no-files-found: error
