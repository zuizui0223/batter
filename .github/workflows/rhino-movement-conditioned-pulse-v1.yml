name: rhino-movement-conditioned-pulse-v1

on:
  push:
    branches: [prospective/task-reset-lockin-v1]
    paths:
      - prospective/task_reset_lockin/movement_conditioned_pulse_v1.py
      - prospective/task_reset_lockin/MOVEMENT_CONDITIONED_PULSE_CONTRACT_V1.md
      - prospective/task_reset_lockin/MOVEMENT_CONDITIONED_PULSE_IMPLEMENTATION_V1.md
      - .github/workflows/rhino-movement-conditioned-pulse-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conditioned-pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy
      - name: Run frozen movement-conditioned pulse diagnostics
        run: |
          python prospective/task_reset_lockin/movement_conditioned_pulse_v1.py | tee prospective/task_reset_lockin/MOVEMENT_CONDITIONED_PULSE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-movement-conditioned-pulse-v1
          path: prospective/task_reset_lockin/MOVEMENT_CONDITIONED_PULSE_RESULT_V1.json
          if-no-files-found: error
