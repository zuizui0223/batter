name: Airspace independent source V40
on:
  push:
    branches: [prospective/roost-3d-connectivity-fd-20261124]
    paths:
      - scripts/airspace_independent_sources_v40.py
      - .github/workflows/airspace-independent-source-v40.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==1.26.4 requests==2.32.3 openpyxl==3.1.5
      - run: python scripts/airspace_independent_sources_v40.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airspace-independent-sources-v40
          path: roost_fd_audit/audit_v40_independent_airspace_sources.json
          if-no-files-found: error
