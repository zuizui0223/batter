name: jae-metadata-preflight-v0.3.6

on:
  workflow_dispatch:

jobs:
  metadata-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate one-source human metadata
        run: python scripts/apply_jae_v0_3_6_metadata.py --check-only
      - name: Check generated/committed Zenodo release metadata
        run: python scripts/check_zenodo_release_ready.py
      - name: Check final JAE title-page and DOI readiness
        run: python scripts/check_jae_upload_ready.py
