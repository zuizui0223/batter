name: public-mendeley-browser-structure-audit-v1

on:
  push:
    paths:
      - "prospective/public_perturbation_audit/PUBLIC_BROWSER_DOWNLOAD_STRUCTURE_CONTRACT_V1.md"
      - "prospective/public_perturbation_audit/public_mendeley_browser_structure_audit_v1.py"
      - ".github/workflows/public-mendeley-browser-structure-audit-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/public-perturbation-audit-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install structural readers and browser
        run: |
          python -m pip install playwright numpy scipy h5py openpyxl
          python -m playwright install --with-deps chromium
      - name: Run public UI structural audit
        run: python prospective/public_perturbation_audit/public_mendeley_browser_structure_audit_v1.py
      - name: Commit structural receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/public_perturbation_audit/PUBLIC_BROWSER_STRUCTURE_AUDIT_V1.json
          git add prospective/public_perturbation_audit/PUBLIC_BROWSER_STRUCTURE_AUDIT_V1.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record public browser structural audit"
            git push
          fi
