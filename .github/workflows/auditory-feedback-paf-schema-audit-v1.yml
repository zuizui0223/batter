name: auditory-feedback-paf-schema-audit-v1

on:
  push:
    paths:
      - "prospective/auditory_feedback_individualization/PAF_SCHEMA_AUDIT_CONTRACT_V1.md"
      - "prospective/auditory_feedback_individualization/paf_schema_audit_v1.py"
      - ".github/workflows/auditory-feedback-paf-schema-audit-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/auditory-feedback-individualization-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install readers
        run: python -m pip install numpy scipy
      - name: Run schema-only PAF audit
        run: python prospective/auditory_feedback_individualization/paf_schema_audit_v1.py
      - name: Commit schema receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/auditory_feedback_individualization/PAF_SCHEMA_AUDIT_V1.json
          git add prospective/auditory_feedback_individualization/PAF_SCHEMA_AUDIT_V1.md
          if git diff --cached --quiet; then
            echo "No schema changes"
          else
            git commit -m "Record auditory-feedback PAF schema audit"
            git fetch origin prospective/auditory-feedback-individualization-v1
            git rebase origin/prospective/auditory-feedback-individualization-v1
            git push origin HEAD:prospective/auditory-feedback-individualization-v1
          fi
