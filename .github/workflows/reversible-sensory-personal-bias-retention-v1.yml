name: reversible-sensory-personal-bias-retention-v1

on:
  push:
    branches:
      - prospective/reversible-sensory-perturbation-v2
    paths:
      - prospective/reversible_sensory_perturbation_v2/personal_bias_retention_v1.py
      - prospective/reversible_sensory_perturbation_v2/PERSONAL_BIAS_RETENTION_CONTRACT_V1.md
      - .github/workflows/reversible-sensory-personal-bias-retention-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install --quiet numpy
      - name: Run exact personal-bias retention test
        shell: bash
        run: |
          set -euo pipefail
          python prospective/reversible_sensory_perturbation_v2/personal_bias_retention_v1.py | tee prospective/reversible_sensory_perturbation_v2/PERSONAL_BIAS_RETENTION_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reversible-sensory-personal-bias-retention-v1
          path: prospective/reversible_sensory_perturbation_v2/PERSONAL_BIAS_RETENTION_RESULT_V1.json
          if-no-files-found: warn
