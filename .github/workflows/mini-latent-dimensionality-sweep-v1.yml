name: mini-latent-dimensionality-sweep-v1
on:
  push:
    branches: [post-freeze/mini-latent-dimensionality-sweep-v1]
    paths:
      - "prospective/task_reset_lockin/MINI_LATENT_DIMENSIONALITY_SWEEP_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/mini_latent_dimensionality_sweep_v1.py"
      - ".github/workflows/mini-latent-dimensionality-sweep-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet numpy
      - run: python prospective/task_reset_lockin/mini_latent_dimensionality_sweep_v1.py > mini_latent_dimensionality_sweep_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-latent-dimensionality-sweep-v1
          path: mini_latent_dimensionality_sweep_result_v1.json
          if-no-files-found: error
