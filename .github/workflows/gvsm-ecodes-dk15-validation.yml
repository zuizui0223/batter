name: GVSM historical Denmark ALS structure validation
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/ecodes_dk15_structural_validation_v1.py
      - .github/workflows/gvsm-ecodes-dk15-validation.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-fixed-snapshot-environment
          run-id: 45591426116
          github-token: ${{ github.token }}
          path: fixed
      - run: python -m pip install numpy pandas rasterio requests pyproj scipy scikit-learn
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/ecodes_dk15_structural_validation_v1.py
      - run: python prospective/gedi_trait_macro_sdm/ecodes_dk15_structural_validation_v1.py
        timeout-minutes: 48
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gvsm-ecodes-dk15-structure
          path: ecodes_validation/
          if-no-files-found: error
