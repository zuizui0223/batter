name: Hidden vertical FD V5c semantic schema
on:
  push:
    branches: [prospective/hidden-vertical-functional-diversity-20261127]
    paths: ['.github/workflows/hidden-vertical-fd-borneo-v5c.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect semantic header rows of exact source workbooks
        shell: bash
        run: |
          python -m pip install --quiet openpyxl==3.1.5
          python - <<'PY'
          import urllib.request, json, hashlib, zipfile, io, re, collections
          from pathlib import Path
          from openpyxl import load_workbook
          sources=[
              (5018280,'Haysom_etal_2021_Frontiers.xlsx',10358292,'7c356be1ecae1a4a6a0a118fe2ca508c2afb7277eaf93a1e771df76234084c2a',['Rarefaction_Input','Control_Rarefaction_Input','Ordination_Input']),
              (7740421,'SAFE_data_archive_Yoh2.xlsx',8911914,'0c874b45b265d326c9cff12db30f96fa6cbf5f19cbfe24530a64bc72fcf25da2',['MasterData']),
              (4010757,'DeereEtAl2020_PNAS.xlsx',1154266,'e597ac5e2e3d382c64dfc89f257ec074c16a97d362f27ef3b42556bcdf872f61',['Deployment','Detection']),
              (7789416,'SAFE_Functional_Groups_template.xlsx',2084581,'2baa7270dbd7f19b1234b962defd5b45f06696ef1b91f482c617c975e0d08e7a',['TraitMatrix'])]
          def get(u,cap):
              req=urllib.request.Request(u,headers={'User-Agent':'batter-public-source-audit/1.0'})
              with urllib.request.urlopen(req,timeout=45) as r: b=r.read(cap+1)
              if len(b)>cap: raise ValueError('file too large')
              return b
          def label(x):
              if x is None:return None
              s=str(x)
              return s[:300] if not re.search(r'@|https?://',s) else '<link or contact omitted>'
          out=[]
          for rid,name,size,sha,sheets in sources:
              result={'record':rid,'file':name}
              try:
                  meta=json.loads(get(f'https://zenodo.org/api/records/{rid}',2*1024*1024))
                  f=next(x for x in meta['files'] if x['key']==name)
                  b=get(f['links']['self'],size)
                  assert len(b)==size and hashlib.sha256(b).hexdigest()==sha
                  with zipfile.ZipFile(io.BytesIO(b)) as z:
                      ms=z.infolist()
                      assert len(ms)<=1000 and sum(m.file_size for m in ms)<=768*1024**2 and max(m.file_size for m in ms)<=384*1024**2
                      assert z.testzip() is None
                  w=load_workbook(io.BytesIO(b),read_only=True,data_only=True)
                  result['sha256']=sha;result['sheets']=[]
                  for n in sheets:
                      s=w[n]; meta_rows=[]; first_data=None
                      for i,row in enumerate(s.iter_rows(min_row=1,max_row=12,values_only=True),1):
                          tag=str(row[0] or '').lower().strip()
                          if tag.startswith('field_') or tag in ('units','unit','description','name','variable','field type'):
                              meta_rows.append({'row':i,'tag':tag,'values':[label(x) for x in row]})
                          else:
                              first_data=i;break
                      result['sheets'].append({'name':n,'dimensions':s.calculate_dimension(),'metadata':meta_rows,'first_nonmetadata_row':first_data})
                  if rid==5018280:
                      t=w['Taxa'];rows=list(t.iter_rows(values_only=True));result['taxa']=[{'name':label(x[0]),'taxon_name':label(x[1]),'taxon_type':label(x[2])} for x in rows[1:] if x[0] is not None]
                  w.close()
                  result['status']='ok'
              except Exception as e:result.update(status='stopped',error=type(e).__name__+': '+str(e)[:180])
              out.append(result)
          Path('borneo_v5c_semantic.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          print(json.dumps(out,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: borneo-v5c-semantic
          path: borneo_v5c_semantic.json
          retention-days: 14
