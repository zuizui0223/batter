name: Marginal altitude identity v3

on:
  push:
    branches:
      - study/individual-vertical-strategy-v1
    paths:
      - 'analysis/marginal_altitude_identity_contract_v3.json'
      - 'analysis/run_marginal_altitude_identity_v3.py'
      - 'tests/test_marginal_altitude_identity_v3.py'
      - '.github/workflows/marginal-altitude-identity-v3.yml'

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install numpy pyproj pytest
      - name: Contract tests
        run: pytest -q tests/test_marginal_altitude_identity_v3.py
      - name: Run explanatory v3
        run: cd analysis && python run_marginal_altitude_identity_v3.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('results/marginal_altitude_identity_result_v3.json').read_text())
          assert p['individual_count']==8
          assert p['primary']['identity_permutation_test']['permutation_count']==40320
          assert p['v1_and_v2_results_unchanged'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: marginal-altitude-identity-v3
          path: results/marginal_altitude_identity_result_v3.json
          if-no-files-found: error
