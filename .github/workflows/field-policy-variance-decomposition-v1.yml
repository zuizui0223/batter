name: field-policy-variance-decomposition-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/field_policy_variance_decomposition_v1.py
      - prospective/field_policy_bridge/FIELD_POLICY_VARIANCE_DECOMPOSITION_V1.md
      - .github/workflows/field-policy-variance-decomposition-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet numpy pandas statsmodels
      - name: Run field policy variance decomposition
        run: |
          python prospective/field_policy_bridge/field_policy_variance_decomposition_v1.py | tee prospective/field_policy_bridge/FIELD_POLICY_VARIANCE_DECOMPOSITION_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: field-policy-variance-decomposition-v1
          path: prospective/field_policy_bridge/FIELD_POLICY_VARIANCE_DECOMPOSITION_RESULT_V1.json
          if-no-files-found: error
