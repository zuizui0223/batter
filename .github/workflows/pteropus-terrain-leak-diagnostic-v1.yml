name: pteropus-terrain-leak-diagnostic-v1
on:
  push:
    branches: [revision/integrated-ecological-contingency-v1]
    paths:
      - "scripts/run_pteropus_terrain_leak_v1.py"
      - "post_freeze_extensions/PTEROPUS_TERRAIN_LEAK_CONTRACT_V1.md"
      - ".github/workflows/pteropus-terrain-leak-diagnostic-v1.yml"
  workflow_dispatch:

jobs:
  terrain-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pandas numpy requests pyproj
      - name: Verify frozen contract exists
        run: test -f post_freeze_extensions/PTEROPUS_TERRAIN_LEAK_CONTRACT_V1.md
      - name: Run frozen terrain diagnostic
        run: python scripts/run_pteropus_terrain_leak_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-pteropus-terrain-leak-v1
          path: |
            post_freeze_extensions/PTEROPUS_TERRAIN_LEAK_RESULT_V1.json
            post_freeze_extensions/PTEROPUS_TERRAIN_LEAK_RESULT_V1.md
          if-no-files-found: error
