name: hipposideros-primary-validation-v1
on:
  workflow_dispatch:
  push:
    branches: [prospective/hipposideros-primary-design-v1]
    paths:
      - ".github/workflows/hipposideros-primary-validation-v1.yml"
jobs:
  primary:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      DRYAD_API_TOKEN: ${{ secrets.DRYAD_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pandas requests pyproj
      - name: Require frozen height-opening receipt
        run: |
          test -f post_freeze_extensions/hipposideros_external_validation/height_opening_receipt_v1.json || (echo "Frozen height-opening receipt is absent" && exit 3)
          test -n "$DRYAD_API_TOKEN" || (echo "DRYAD_API_TOKEN secret is not set" && exit 2)
      - name: Run frozen prospective Hipposideros primary validation
        run: python post_freeze_extensions/hipposideros_external_validation/run_primary_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-hipposideros-primary-validation-v1
          path: |
            post_freeze_extensions/hipposideros_external_validation/primary_result_v1.json
            post_freeze_extensions/hipposideros_external_validation/PRIMARY_RESULT_V1.md
          if-no-files-found: error
