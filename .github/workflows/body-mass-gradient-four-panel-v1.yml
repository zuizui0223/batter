name: body-mass-gradient-four-panel-v1
on:
  push:
    branches: [exploratory/body-mass-gradient-four-panel-v1]
    paths:
      - "post_freeze_extensions/body_mass_gradient_four_panel/**"
      - ".github/workflows/body-mass-gradient-four-panel-v1.yml"
  workflow_dispatch:
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        panel: [hypsignathus, phyllostomus_2022, phyllostomus_2023, phyllostomus_2016]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e . scipy
      - name: Download authoritative mass+x-y-time preflight
        run: |
          mkdir -p post_freeze_extensions/body_mass_gradient_four_panel/input
          gh run download 36515396505 -n batter-body-mass-gradient-preflight-v1 -D post_freeze_extensions/body_mass_gradient_four_panel/input
          test -f post_freeze_extensions/body_mass_gradient_four_panel/input/preflight_result_v1.json
      - run: python post_freeze_extensions/body_mass_gradient_four_panel/run_v1.py --panel "${{ matrix.panel }}"
      - uses: actions/upload-artifact@v4
        with:
          name: body-mass-gradient-four-${{ matrix.panel }}-v1
          path: post_freeze_extensions/body_mass_gradient_four_panel/panel_results/panel_${{ matrix.panel }}_v1.json
          if-no-files-found: error
  aggregate:
    needs: panel
    runs-on: ubuntu-latest
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e . scipy
      - name: Download authoritative preflight
        run: |
          mkdir -p post_freeze_extensions/body_mass_gradient_four_panel/input
          gh run download 36515396505 -n batter-body-mass-gradient-preflight-v1 -D post_freeze_extensions/body_mass_gradient_four_panel/input
      - uses: actions/download-artifact@v4
        with:
          pattern: body-mass-gradient-four-*-v1
          path: post_freeze_extensions/body_mass_gradient_four_panel/panel_results
          merge-multiple: true
      - run: python post_freeze_extensions/body_mass_gradient_four_panel/run_v1.py --aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: batter-body-mass-gradient-four-panel-v1
          path: |
            post_freeze_extensions/body_mass_gradient_four_panel/result_v1.json
            post_freeze_extensions/body_mass_gradient_four_panel/RESULT_V1.md
          if-no-files-found: error
