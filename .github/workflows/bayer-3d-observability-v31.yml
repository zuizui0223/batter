name: Bayer GPS 3D observability V31
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/bayer_3d_observability_v31.py
      - .github/workflows/bayer-3d-observability-v31.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy==2.4.6
      - run: python scripts/bayer_3d_observability_v31.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayer-3d-observability-v31
          path: results/bayer_3d_observability_v31.json
          if-no-files-found: error
          retention-days: 60
