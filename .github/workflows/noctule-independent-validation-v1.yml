name: noctule-independent-validation-v1

on:
  push:
    branches: [prospective/noctule-independent-validation-v1]
    paths:
      - "post_freeze_extensions/noctule_independent_validation/result_v1.py"
      - ".github/workflows/noctule-independent-validation-v1.yml"
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e . pandas requests
      - name: Run frozen independent centered-shape validation
        run: python post_freeze_extensions/noctule_independent_validation/result_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-noctule-independent-validation-v1
          path: |
            post_freeze_extensions/noctule_independent_validation/result_v1.json
            post_freeze_extensions/noctule_independent_validation/RESULT_V1.md
          if-no-files-found: error
