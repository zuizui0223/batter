name: external-public-source-screen-v1

on:
  push:
    branches:
      - prospective/external-bat-panel-search-v1
    paths:
      - "post_freeze_extensions/external_panel_search/screen_public_sources_v1.py"
      - ".github/workflows/external-public-source-screen-v1.yml"
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install structural-screen dependencies
        run: python -m pip install pandas openpyxl requests
      - name: Run outcome-blind public-source screen
        run: python post_freeze_extensions/external_panel_search/screen_public_sources_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-external-public-source-screen-v1
          path: |
            post_freeze_extensions/external_panel_search/public_source_screen_v1.json
            post_freeze_extensions/external_panel_search/PUBLIC_SOURCE_SCREEN_V1.md
          if-no-files-found: error
