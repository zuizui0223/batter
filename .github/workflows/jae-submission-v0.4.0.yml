name: jae-submission-v0.4.0

on:
  push:
    branches:
      - post-freeze/manuscript-maintenance-synthesis-v1
    paths:
      - "manuscript/MANUSCRIPT_DRAFT_V0_4_0.md"
      - "manuscript/TITLE_PAGE_TEMPLATE_V0_3_8.md"
      - "manuscript/SUPPORTING_INFORMATION_CLAIM_AMENDMENT_HISTORY.md"
      - "results/calibrated_vertical_identity_v0_3_8.csv"
      - "results/endpoint_exclusion_v0_3_8.csv"
      - "results/tag_altitude_bias_shape_v1.csv"
      - "results/tag_altitude_bias_audit_v1_summary.json"
      - "results/individual_vertical_strategy_result_v1.json"
      - "results/spatial_interaction_refinement_result_v2.json"
      - "contract/centered_shape_profile_descriptive_v1.json"
      - "scripts/build_centered_shape_profile_descriptive_v1.py"
      - "scripts/check_jae_submission_v0_4_0.py"
      - "scripts/plot_jae_v0_4_0_figures.py"
      - ".github/workflows/jae-submission-v0.4.0.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  submission-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[figure]"
      - name: Check JAE v0.4.0 manuscript gates
        run: python scripts/check_jae_submission_v0_4_0.py
      - name: Build JAE v0.4.0 main and supporting figures
        run: python scripts/plot_jae_v0_4_0_figures.py
      - name: Rebuild descriptive Figure 6
        run: |
          python scripts/build_centered_shape_profile_descriptive_v1.py
          cp figures/submission_v0_3_7/figure6_individual_centered_shape_profiles.pdf figures/submission_v0_4_0/
          cp figures/submission_v0_3_7/figure6_individual_centered_shape_profiles.png figures/submission_v0_4_0/
          test -f figures/submission_v0_4_0/figure6_individual_centered_shape_profiles.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: batter-jae-v0-4-0-main-figures
          path: figures/submission_v0_4_0/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: batter-jae-v0-4-0-supporting-figures
          path: figures/supporting_v0_4_0/
          if-no-files-found: error
