name: early-experience-mendeley-network-v1

on:
  push:
    paths:
      - "prospective/early_experience_specialization/mendeley_network_endpoints_v1.py"
      - ".github/workflows/early-experience-mendeley-network-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: early-experience-mendeley-network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/early-experience-specialization-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Capture Mendeley network endpoints
        run: python prospective/early_experience_specialization/mendeley_network_endpoints_v1.py
      - name: Commit network receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/early_experience_specialization/MENDELEY_NETWORK_ENDPOINTS_V1.json
          git add prospective/early_experience_specialization/MENDELEY_NETWORK_ENDPOINTS_V1.md
          if git diff --cached --quiet; then
            echo "No network changes"
          else
            git commit -m "Record Mendeley network endpoints"
            git pull --rebase origin prospective/early-experience-specialization-v1
            git push origin HEAD:prospective/early-experience-specialization-v1
          fi
