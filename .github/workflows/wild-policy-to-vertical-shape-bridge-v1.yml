name: wild-policy-to-vertical-shape-bridge-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/wild_policy_to_vertical_shape_v1.py
      - prospective/field_policy_bridge/WILD_POLICY_TO_VERTICAL_SHAPE_ESTIMATOR_APPENDIX_V1.md
      - prospective/field_policy_bridge/WILD_POLICY_TO_VERTICAL_SHAPE_CONTRACT_V1.md
      - .github/workflows/wild-policy-to-vertical-shape-bridge-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --quiet -e .
      - name: Recompute frozen carrier gate
        run: |
          python prospective/field_policy_bridge/wild_flight_intensity_persistence_v1.py | tee /tmp/carrier.json
      - name: Run conditional policy-to-shape bridge
        run: |
          python prospective/field_policy_bridge/wild_policy_to_vertical_shape_v1.py --carrier-json /tmp/carrier.json | tee prospective/field_policy_bridge/WILD_POLICY_TO_VERTICAL_SHAPE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wild-policy-to-vertical-shape-bridge-v1
          path: |
            prospective/field_policy_bridge/WILD_POLICY_TO_VERTICAL_SHAPE_RESULT_V1.json
          if-no-files-found: warn
