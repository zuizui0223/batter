name: Flight power official public source routes v3
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/power_source_routes_v3.py
      - .github/workflows/power-source-routes-v3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install xlrd==2.0.1
      - run: python scripts/power_source_routes_v3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: power-source-routes-v3
          path: results/power_source_routes_v3.json
          retention-days: 60
          if-no-files-found: error
