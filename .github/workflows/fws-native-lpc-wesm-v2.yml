name: FWS official WESM native point cloud coverage V2
on:
  workflow_dispatch:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/fws-native-lpc-wesm-v2.yml
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 235c628454da394a8332711b14900a9a90ac3e9d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mdbtools
      - run: python -m pip install numpy pandas scipy requests rasterio pyproj 'shapely>=2' geopandas pyogrio
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/fws_native_lpc_wesm_v2.py
      - run: python prospective/gedi_trait_macro_sdm/fws_native_lpc_wesm_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fws-native-lpc-wesm-v2
          path: fws_native_lpc_wesm/report.json
          if-no-files-found: error
          retention-days: 90
