name: small-panel-generality-primary-v1
on:
  push:
    branches: [prospective/small-panel-generality-primary-v1]
    paths:
      - "post_freeze_extensions/small_panel_generality/run_primary_v1.py"
      - ".github/workflows/small-panel-generality-primary-v1.yml"
  workflow_dispatch:
jobs:
  primary:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pandas numpy requests pyproj
      - name: Require frozen receipt
        run: |
          test -f post_freeze_extensions/small_panel_generality/height_opening_receipt_v1.json || (echo "Missing frozen receipt" && exit 3)
      - name: Run frozen small-panel vertical primary
        run: python post_freeze_extensions/small_panel_generality/run_primary_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-small-panel-generality-primary-v1
          path: |
            post_freeze_extensions/small_panel_generality/primary_result_v1.json
            post_freeze_extensions/small_panel_generality/PRIMARY_RESULT_V1.md
          if-no-files-found: error
      - name: Pin primary result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             post_freeze_extensions/small_panel_generality/primary_result_v1.json             post_freeze_extensions/small_panel_generality/PRIMARY_RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Record small-panel prospective vertical primary"
            git push origin HEAD:prospective/small-panel-generality-primary-v1
          fi
