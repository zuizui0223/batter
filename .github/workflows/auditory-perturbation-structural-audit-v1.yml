name: auditory-perturbation-structural-audit-v1

on:
  push:
    paths:
      - "prospective/auditory_perturbation_policy/structural_audit_v1.py"
      - "prospective/auditory_perturbation_policy/AUDITORY_PERTURBATION_STRUCTURAL_AUDIT_V1.md"
      - "prospective/auditory_perturbation_policy/ACOUSTIC_POLICY_PRIMARY_V1.md"
      - ".github/workflows/auditory-perturbation-structural-audit-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/auditory-perturbation-policy-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install readers
        run: python -m pip install numpy scipy
      - name: Run structural audit
        run: python prospective/auditory_perturbation_policy/structural_audit_v1.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/auditory_perturbation_policy/STRUCTURAL_RESULT_V1.json
          git add prospective/auditory_perturbation_policy/STRUCTURAL_RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record auditory perturbation structural result"
            git push
          fi
