name: H1 2018 vampire bat maze original supplementary source gate

on:
  push:
    branches: [prospective/social-information-macro-h1-v1]
    paths:
      - 'prospective/social_macro_h1/h1_vampire2018_maze_source_gate.py'
      - '.github/workflows/h1-vampire2018-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-structure-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve and fingerprint only original 2018 maze supplement columns
        id: source
        continue-on-error: true
        run: python prospective/social_macro_h1/h1_vampire2018_maze_source_gate.py
      - name: Archive source schema receipt (no raw bats)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1-vampire2018-original-maze-source
          path: /tmp/h1_vampire_2018_source_schema.json
          if-no-files-found: error
      - name: STOP if original maze CSV not authenticated
        if: steps.source.outcome == 'failure'
        run: |
          echo "::error::Original 2018 raw maze supplement not verified. No individual reanalysis."
          exit 1
