name: child-doi-source-resolver-v1

on:
  push:
    branches:
      - study/individual-vertical-strategies-v1
    paths:
      - "scripts/resolve_child_doi_sources.py"
      - ".github/workflows/child-doi-source-resolver.yml"
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/resolve_child_doi_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-child-doi-source-resolver-v1
          path: results/child_doi_source_resolver_v1.json
