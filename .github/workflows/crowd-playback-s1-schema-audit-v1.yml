name: crowd-playback-s1-schema-audit-v1

on:
  push:
    paths:
      - "prospective/crowd_playback_individualization/STRUCTURAL_AUDIT_CONTRACT_V1.md"
      - "prospective/crowd_playback_individualization/s1_schema_audit_v1.py"
      - ".github/workflows/crowd-playback-s1-schema-audit-v1.yml"
  workflow_dispatch:

concurrency:
  group: crowd-playback-s1-schema-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/crowd-playback-individualization-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reader
        run: python -m pip install openpyxl
      - name: Run schema-only audit
        run: python prospective/crowd_playback_individualization/s1_schema_audit_v1.py
      - name: Commit schema receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/crowd_playback_individualization/S1_SCHEMA_AUDIT_V1.json
          git add prospective/crowd_playback_individualization/S1_SCHEMA_AUDIT_V1.md
          if git diff --cached --quiet; then
            echo "No schema changes"
          else
            git commit -m "Record crowd-playback S1 schema audit"
            git fetch origin prospective/crowd-playback-individualization-v1
            git rebase origin/prospective/crowd-playback-individualization-v1
            git push origin HEAD:prospective/crowd-playback-individualization-v1
          fi
