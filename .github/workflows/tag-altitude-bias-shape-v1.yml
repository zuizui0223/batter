name: tag-altitude-bias-shape-v1

on:
  push:
    branches:
      - diagnostic/tag-altitude-bias-audit-v1
    paths:
      - "contract/tag_altitude_bias_audit_v1.json"
      - "TAG_ALTITUDE_BIAS_AUDIT_CONTRACT.md"
      - "scripts/run_tag_altitude_bias_shape.py"
      - ".github/workflows/tag-altitude-bias-shape-v1.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  shape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        panel:
          - tadarida
          - eidolon
          - hypsignathus
          - phyllostomus_2022
          - phyllostomus_2023
          - phyllostomus_2016
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run frozen shift-invariant shape audit
        run: python scripts/run_tag_altitude_bias_shape.py --panel "${{ matrix.panel }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tag-bias-shape-${{ matrix.panel }}-v1
          path: results/tag_altitude_bias_shape_${{ matrix.panel }}_v1.json
          if-no-files-found: error
