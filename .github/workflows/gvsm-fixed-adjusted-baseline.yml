name: Fixed snapshot adjusted baseline consistency
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/gvsm-fixed-adjusted-baseline.yml
permissions:
  contents: read
  actions: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: europe-common-forest-support-v1
          run-id: 45585033345
          github-token: ${{ github.token }}
          path: pilot
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-fixed-snapshot-environment
          run-id: 45591426116
          github-token: ${{ github.token }}
          path: environment
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-fixed-snapshot-observation-audit
          run-id: 45593509220
          github-token: ${{ github.token }}
          path: audit
      - uses: actions/download-artifact@v4
        with:
          name: gedi-macro-iberia-join
          run-id: 45575962660
          github-token: ${{ github.token }}
          path: traits
      - uses: actions/download-artifact@v4
        with:
          name: baseline-covariates-terrain
          run-id: 45659440994
          github-token: ${{ github.token }}
          path: prior_terrain
      - uses: actions/download-artifact@v4
        with:
          name: baseline-lc100-alternative-v1
          run-id: 45713474572
          github-token: ${{ github.token }}
          path: prior_alternative
      - run: python -m pip install numpy==2.5.5 pandas==3.1.1 scipy==1.18.1 requests rasterio pyproj
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/fixed_snapshot_adjusted_baseline_v1.py prospective/gedi_trait_macro_sdm/fixed_snapshot_adjusted_covariates_v1.py
      - run: python prospective/gedi_trait_macro_sdm/fixed_snapshot_adjusted_baseline_v1.py --prepare
      - run: python prospective/gedi_trait_macro_sdm/fixed_snapshot_adjusted_covariates_v1.py
        timeout-minutes: 35
      - run: python prospective/gedi_trait_macro_sdm/fixed_snapshot_adjusted_baseline_v1.py --fit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-snapshot-adjusted-baseline-v1
          path: |
            fixed_adjusted_support/
            fixed_adjusted_covariates/
            fixed_adjusted_baseline/
          if-no-files-found: error
          retention-days: 90
