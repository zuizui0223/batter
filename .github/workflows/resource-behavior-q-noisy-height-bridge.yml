name: Bat q-stratified GPS height error bridge (source-free)

on:
  push:
    branches:
      - prospective/resource-behavior-higher-dimensional-sdm-v1-20261120
    paths:
      - 'prospective/resource_behavior_sdm/q_stratified_noisy_height_*'
      - 'prospective/resource_behavior_sdm/test_q_stratified_noisy_height_*'
      - 'prospective/resource_behavior_sdm/gps_height_error_likelihood_v1.py'
      - '.github/workflows/resource-behavior-q-noisy-height-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-world-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-free full-grid equivalence and q + GPS error tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s prospective/resource_behavior_sdm \
            -p 'test_q_stratified_noisy_height_bridge_v1.py' -v \
            > /tmp/q_gps_bridge_synthetic_test_trace.txt 2>&1
          result=$?
          cat /tmp/q_gps_bridge_synthetic_test_trace.txt
          exit "$result"
      - name: Fixed source-free null and true-resource-height scenarios
        run: |
          python prospective/resource_behavior_sdm/q_stratified_noisy_height_two_world_receipt_v1.py \
            --out /tmp/q_stratified_noisy_height_two_world_receipt_v1.json
      - name: Preserve only synthetic aggregates and diagnostic test trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q-noisy-height-synthetic-bridge-v1
          path: |
            /tmp/q_stratified_noisy_height_two_world_receipt_v1.json
            /tmp/q_gps_bridge_synthetic_test_trace.txt
          retention-days: 30
          if-no-files-found: warn
