name: route-centroid-compression-v1
on:
  push:
    branches: [post-freeze/route-centroid-compression-v1]
    paths:
      - "prospective/task_reset_lockin/ROUTE_CENTROID_COMPRESSION_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/route_centroid_compression_v1.py"
      - ".github/workflows/route-centroid-compression-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python prospective/task_reset_lockin/route_centroid_compression_v1.py > route_centroid_compression_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: route-centroid-compression-v1
          path: route_centroid_compression_result_v1.json
          if-no-files-found: error
