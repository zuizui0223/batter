name: extended-pairwise-architecture-v1

on:
  push:
    branches:
      - study/individual-vertical-strategies-v1
    paths:
      - "scripts/run_extended_pairwise_architecture.py"
      - "contract/extended_pairwise_architecture_v1.json"
      - ".github/workflows/extended-pairwise-architecture.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/run_extended_pairwise_architecture.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-extended-pairwise-architecture-v1
          path: results/extended_pairwise_architecture_v1.json
