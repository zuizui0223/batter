name: Happ independent real bat stereo correspondence v4
on:
  push:
    branches:
      - prospective/air-volume-observation-kernel-20261123
    paths:
      - 'scripts/verify_happ_real_bat_stereo_v4_independent.py'
      - 'tests/test_happ_real_bat_stereo_independent_v4.py'
      - '.github/workflows/happ-real-bat-stereo-independent-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent_source_correspondence:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project scientific numeric coordinate dependencies
        run: python -m pip install -e '.[test]' 'numpy>=1.26,<2' 'opencv-python-headless==4.9.0.80'
      - name: Source-free independent epipolar/area/unique pairing known-truth tests
        run: python -m pytest -q tests/test_happ_real_bat_stereo_independent_v4.py
      - name: Fetch exact original author v1.0.1 Git source
        run: |
          mkdir -p external
          git clone --depth 1 --branch v1.0.1 https://github.com/christofhapp/batflight3D_publication.git external/happ
          test "$(git -C external/happ rev-parse HEAD)" = "34d2f56bcee1eab9207890938aedd90a079bfcde"
      - name: Independent original real bat camera matching without author matcher
        run: python -m scripts.verify_happ_real_bat_stereo_v4_independent
      - name: Archive source independent agreement or mismatch STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happ-independent-real-bat-stereo-v4
          path: results/happ_real_bat_stereo_independent_v4.json
          if-no-files-found: warn
          retention-days: 60
