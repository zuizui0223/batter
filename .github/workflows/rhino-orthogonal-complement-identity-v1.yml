name: rhino-orthogonal-complement-identity-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/orthogonal_complement_identity_v1.py
      - prospective/task_reset_lockin/ORTHOGONAL_COMPLEMENT_IDENTITY_CONTRACT_V1.md
      - .github/workflows/rhino-orthogonal-complement-identity-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run frozen orthogonal-complement test
        run: |
          python prospective/task_reset_lockin/orthogonal_complement_identity_v1.py | tee prospective/task_reset_lockin/ORTHOGONAL_COMPLEMENT_IDENTITY_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-orthogonal-complement-identity-v1
          path: prospective/task_reset_lockin/ORTHOGONAL_COMPLEMENT_IDENTITY_RESULT_V1.json
          if-no-files-found: error
