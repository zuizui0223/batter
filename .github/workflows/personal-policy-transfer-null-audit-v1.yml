name: personal-policy-transfer-null-audit-v1
on:
  push:
    branches: [post-freeze/personal-policy-transfer-null-audit-v1]
    paths:
      - "prospective/task_reset_lockin/PERSONAL_POLICY_TRANSFER_NULL_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/personal_policy_transfer_null_v1.py"
      - ".github/workflows/personal-policy-transfer-null-audit-v1.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python prospective/task_reset_lockin/personal_policy_transfer_null_v1.py > personal_policy_transfer_null_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: personal-policy-transfer-null-audit-v1
          path: personal_policy_transfer_null_result_v1.json
          if-no-files-found: error
