name: rhino-residual-policy-dimensions-v1
on:
  push:
    branches: [post-freeze/rhino-residual-policy-dimensions-v1]
    paths:
      - "prospective/task_reset_lockin/RHINO_RESIDUAL_POLICY_DIMENSIONALITY_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/rhino_residual_policy_dimensionality_v1.py"
      - ".github/workflows/rhino-residual-policy-dimensions-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet numpy
      - run: python prospective/task_reset_lockin/rhino_residual_policy_dimensionality_v1.py > rhino_residual_policy_dimensionality_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-residual-policy-dimensions-v1
          path: rhino_residual_policy_dimensionality_result_v1.json
          if-no-files-found: error
