name: GEDI macro actual input diagnosis
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/diagnose_inputs.py
      - .github/workflows/gedi-macro-diagnosis.yml
permissions:
  contents: read
  actions: read
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      GBIF_USER: ${{ secrets.GBIF_USER }}
      GBIF_PWD: ${{ secrets.GBIF_PWD }}
      GBIF_USERNAME: ${{ secrets.GBIF_USERNAME }}
      GBIF_PASSWORD: ${{ secrets.GBIF_PASSWORD }}
      GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gedi-macro-real-inputs
          run-id: 45575472120
          github-token: ${{ github.token }}
          path: prior_inputs
      - run: python -m pip install requests
      - run: python prospective/gedi_trait_macro_sdm/diagnose_inputs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gedi-macro-input-diagnosis
          path: input_diagnostics/
          if-no-files-found: error
