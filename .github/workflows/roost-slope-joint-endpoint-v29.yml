name: Roost slope joint endpoint V29
on:
  push:
    branches: [prospective/roost-3d-connectivity-fd-20261124]
    paths:
      - scripts/roost_slope_joint_endpoint_v29.py
      - .github/workflows/roost-slope-joint-endpoint-v29.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==1.26.4 scipy==1.13.1 requests==2.32.3 openpyxl==3.1.5 pyproj==3.7.0 rasterio==1.4.3 && pip install -e .
      - run: python scripts/roost_slope_joint_endpoint_v29.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roost-slope-joint-endpoint-v29
          path: roost_fd_audit/audit_v29_slope.json
          if-no-files-found: error
