name: pteropus-terrain-dem-preflight-v1
on:
  push:
    branches: [revision/integrated-ecological-contingency-v1]
    paths:
      - "post_freeze_extensions/pteropus_terrain_audit/contract_v1.json"
      - "post_freeze_extensions/pteropus_terrain_audit/run_dem_preflight_v1.py"
      - ".github/workflows/pteropus-terrain-dem-preflight-v1.yml"
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pandas requests
      - name: Run DEM preflight without decoding elevation values
        run: python post_freeze_extensions/pteropus_terrain_audit/run_dem_preflight_v1.py
      - name: Pin DEM receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add post_freeze_extensions/pteropus_terrain_audit/dem_preflight_receipt_v1.json
          if git diff --cached --quiet; then
            echo "No receipt changes"
          else
            git commit -m "Pin Pteropus DEM preflight receipt"
            git push origin HEAD:revision/integrated-ecological-contingency-v1
          fi
