name: Airspace Maui night concordance V56
on:
  push:
    branches: [prospective/roost-3d-connectivity-fd-20261124]
    paths:
      - scripts/airspace_maui_night_concordance_v56.py
      - .github/workflows/airspace-maui-night-concordance-v56.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4 scipy==1.13.1 pandas==2.2.3 requests==2.32.3 openpyxl==3.1.5
      - run: python scripts/airspace_maui_night_concordance_v56.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airspace-maui-night-concordance-v56
          path: roost_fd_audit/audit_v56_maui_night_concordance.json
          if-no-files-found: error
