name: Source-verified GPS observation balance (aggregate only)

on:
  push:
    branches:
      - prospective/multitaxon-identity-ecology-v1
    paths:
      - "prospective/multitaxon_individuality/seasonal_edge_observation_balance_v1.py"
      - "prospective/multitaxon_individuality/tests/test_seasonal_edge_observation_balance_v1.py"
      - "prospective/multitaxon_individuality/SEASONAL_EDGE_OBSERVATION_BALANCE_DESIGN_2026_10_20.md"
      - ".github/workflows/source-verified-seasonal-effort-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen sampling and missingness rules (synthetic only)
        run: |
          PYTHONPATH=prospective/multitaxon_individuality python3 -m unittest discover \
            -s prospective/multitaxon_individuality/tests \
            -p "test_seasonal_edge_observation_balance_v1.py" -v

  original-source-analysis:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        source: [black_bear, white_tailed_deer, turkey]
    steps:
      - uses: actions/checkout@v4
      - name: Download original source, verify MD5 and pinned SHA256, standardize GPS effort
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          mkdir -p /tmp/movebank-aggregate-only
          python3 prospective/multitaxon_individuality/seasonal_edge_observation_balance_v1.py \
            --source "$SOURCE" \
            --output "/tmp/movebank-aggregate-only/${SOURCE}_observation_balance.json"
      - name: Upload only privacy-safe source/year/seed aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-balanced-${{ matrix.source }}
          path: /tmp/movebank-aggregate-only/*.json
          if-no-files-found: warn
          retention-days: 15
