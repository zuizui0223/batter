name: Independent stationary acoustic source gate V1
on:
  workflow_dispatch:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/stationary-acoustic-source-v1.yml
      - prospective/gedi_trait_macro_sdm/stationary_acoustic_source_v1.py
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/stationary_acoustic_source_v1.py
      - run: python prospective/gedi_trait_macro_sdm/stationary_acoustic_source_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stationary-acoustic-source-v1
          path: stationary_acoustic_gate/
          if-no-files-found: error
          retention-days: 90
