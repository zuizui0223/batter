name: mini-species-specific-pca1-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/mini_species_specific_pca1_v1.py
      - prospective/task_reset_lockin/MINI_SPECIES_SPECIFIC_PCA1_CONTRACT_V1.md
      - .github/workflows/mini-species-specific-pca1-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pca1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy
      - name: Run frozen Miniopterus PCA1 diagnostic
        run: |
          python prospective/task_reset_lockin/mini_species_specific_pca1_v1.py | tee prospective/task_reset_lockin/MINI_SPECIES_SPECIFIC_PCA1_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-species-specific-pca1-v1
          path: prospective/task_reset_lockin/MINI_SPECIES_SPECIFIC_PCA1_RESULT_V1.json
          if-no-files-found: error
