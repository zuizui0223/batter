name: tadarida-estimator-calibration-v1

on:
  push:
    branches:
      - diagnostic/tadarida-estimator-calibration-v1
    paths:
      - "contract/tadarida_estimator_calibration_v1.json"
      - "TADARIDA_ESTIMATOR_CALIBRATION_CONTRACT.md"
      - "scripts/run_tadarida_estimator_calibration.py"
      - "src/batter/analysis.py"
      - ".github/workflows/tadarida-estimator-calibration-v1.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run frozen estimator calibration
        run: python scripts/run_tadarida_estimator_calibration.py
      - uses: actions/upload-artifact@v4
        with:
          name: tadarida-estimator-calibration-v1
          path: results/tadarida_estimator_calibration_v1.json
          if-no-files-found: error
