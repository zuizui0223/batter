name: Authenticated GEDI measured profile validation V1
on:
  workflow_dispatch:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/gedi-authenticated-measured-profile-v1.yml
      - prospective/gedi_trait_macro_sdm/gedi_authenticated_measured_v1.py
      - prospective/gedi_trait_macro_sdm/gedi_matched_profile_fit_v1.py
permissions:
  contents: read
  actions: read
concurrency:
  group: gedi-authenticated-measured-v1
  cancel-in-progress: false
jobs:
  raw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'earthaccess>=0.14' requests numpy pandas h5py
      - run: python prospective/gedi_trait_macro_sdm/gedi_authenticated_measured_v1.py raw
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gedi-direct-l2b-v1
          path: gedi_raw/
          if-no-files-found: error
          retention-days: 90
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: europe-common-forest-support-v1
          run-id: 45585033345
          github-token: ${{ github.token }}
          path: pilot
      - uses: actions/download-artifact@v4
        with:
          name: baseline-covariates-terrain
          run-id: 45659440994
          github-token: ${{ github.token }}
          path: baseline_terrain
      - uses: actions/download-artifact@v4
        with:
          name: baseline-lc100-alternative-v1
          run-id: 45713474572
          github-token: ${{ github.token }}
          path: .
      - run: python -m pip install 'earthaccess>=0.14' 'rasterio>=1.4' requests numpy pandas scipy
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/gedi_authenticated_measured_v1.py prospective/gedi_trait_macro_sdm/gedi_matched_profile_fit_v1.py
      - run: python prospective/gedi_trait_macro_sdm/gedi_authenticated_measured_v1.py grid
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        timeout-minutes: 65
      - run: python prospective/gedi_trait_macro_sdm/gedi_matched_profile_fit_v1.py
        timeout-minutes: 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gedi-measured-grid-validation-v1
          path: |
            gedi_grid/
            gedi_matched_fit/
          if-no-files-found: error
          retention-days: 90
