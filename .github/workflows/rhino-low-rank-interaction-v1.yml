name: rhino-low-rank-interaction-v1
on:
  push:
    branches: [post-freeze/rhino-low-rank-interaction-v1]
    paths:
      - "prospective/task_reset_lockin/LOW_RANK_INDIVIDUAL_ENVIRONMENT_INTERACTION_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/low_rank_individual_environment_interaction_v1.py"
      - ".github/workflows/rhino-low-rank-interaction-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet numpy
      - run: python prospective/task_reset_lockin/low_rank_individual_environment_interaction_v1.py > low_rank_interaction_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-low-rank-interaction-v1
          path: low_rank_interaction_result_v1.json
          if-no-files-found: error
