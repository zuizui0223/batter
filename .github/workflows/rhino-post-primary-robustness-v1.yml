name: rhino-post-primary-robustness-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/post_primary_robustness_v1.py
      - prospective/task_reset_lockin/POST_PRIMARY_ROBUSTNESS_CONTRACT_V1.md
      - prospective/task_reset_lockin/rhino_configuration_identity_primary_v1.py
      - .github/workflows/rhino-post-primary-robustness-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --quiet numpy
      - name: Syntax check
        run: python -m py_compile prospective/task_reset_lockin/post_primary_robustness_v1.py
      - name: Run frozen post-primary diagnostics
        run: |
          python prospective/task_reset_lockin/post_primary_robustness_v1.py | tee prospective/task_reset_lockin/POST_PRIMARY_ROBUSTNESS_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-post-primary-robustness-v1
          path: prospective/task_reset_lockin/POST_PRIMARY_ROBUSTNESS_RESULT_V1.json
          if-no-files-found: error
