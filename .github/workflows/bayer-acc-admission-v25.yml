name: Bayer accelerometry source and sampling V25
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/bayer_acc_admission_v25.py
      - .github/workflows/bayer-acc-admission-v25.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy==2.4.6
      - run: python scripts/bayer_acc_admission_v25.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayer-acc-admission-v25
          path: results/bayer_acc_admission_v25.json
          retention-days: 60
          if-no-files-found: error
