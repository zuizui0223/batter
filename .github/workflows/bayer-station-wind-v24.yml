name: Bayer station wind convention sensitivity V24
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/bayer_station_wind_v24.py
      - .github/workflows/bayer-station-wind-v24.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy==2.4.6
      - run: python scripts/bayer_station_wind_v24.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayer-station-wind-v24
          path: results/bayer_station_wind_v24.json
          if-no-files-found: error
          retention-days: 60
