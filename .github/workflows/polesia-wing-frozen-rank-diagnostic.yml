name: Polesia frozen wing rank descriptive diagnostic
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/polesia-wing-frozen-rank-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ecfc9c856962f6af602fd42367f0cce4b2d38591
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wing-pavd-frozen-trait-domain-v1
          run-id: 45719681892
          github-token: ${{ github.token }}
          path: domain
      - run: python -m pip install numpy pandas scipy
      - run: python prospective/gedi_trait_macro_sdm/polesia_wing_frozen_rank_diagnostic_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polesia-wing-rank-descriptive-v1
          path: polesia_wing_rank/report.json
          if-no-files-found: warn
