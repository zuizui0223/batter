name: peer-day-residual-identity-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/peer_day_residual_identity_v1.py
      - prospective/field_policy_bridge/PEER_DAY_RESIDUAL_IDENTITY_CONTRACT_V1.md
      - .github/workflows/peer-day-residual-identity-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet -e .
      - name: Run peer-day residual identity test
        run: |
          python prospective/field_policy_bridge/peer_day_residual_identity_v1.py | tee prospective/field_policy_bridge/PEER_DAY_RESIDUAL_IDENTITY_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peer-day-residual-identity-v1
          path: prospective/field_policy_bridge/PEER_DAY_RESIDUAL_IDENTITY_RESULT_V1.json
          if-no-files-found: warn
