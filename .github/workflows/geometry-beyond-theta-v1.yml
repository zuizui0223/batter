name: geometry-beyond-theta-v1
on:
  push:
    branches: [post-freeze/geometry-beyond-theta-v1]
    paths:
      - "prospective/task_reset_lockin/GEOMETRY_BEYOND_THETA_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/geometry_beyond_theta_v1.py"
      - ".github/workflows/geometry-beyond-theta-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python prospective/task_reset_lockin/geometry_beyond_theta_v1.py > geometry_beyond_theta_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: geometry-beyond-theta-v1
          path: geometry_beyond_theta_result_v1.json
          if-no-files-found: error
