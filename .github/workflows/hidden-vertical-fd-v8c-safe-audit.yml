name: Hidden vertical FD V8c SAFE geography and row-grain audit
on:
  push:
    branches: [prospective/hidden-vertical-functional-diversity-20261127]
    paths: ['.github/workflows/hidden-vertical-fd-v8c-safe-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --only-binary=:all: openpyxl==3.1.5
      - run: python prospective/hidden_vertical_fd/safe_v8c_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safe-v8c-audit
          path: safe_v8c_audit.json
          if-no-files-found: error
          retention-days: 14
