name: learning-raw-trajectory-two-axis-v1

on:
  push:
    branches:
      - prospective/learning-policy-state-v1
    paths:
      - prospective/learning_policy_state/raw_trajectory_two_axis_v1.py
      - prospective/learning_policy_state/RAW_TRAJECTORY_TWO_AXIS_CONTRACT_V1.md
      - .github/workflows/learning-raw-trajectory-two-axis-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-axis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run frozen raw-trajectory two-axis replication
        run: |
          python prospective/learning_policy_state/raw_trajectory_two_axis_v1.py | tee prospective/learning_policy_state/RAW_TRAJECTORY_TWO_AXIS_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: learning-raw-trajectory-two-axis-v1
          path: prospective/learning_policy_state/RAW_TRAJECTORY_TWO_AXIS_RESULT_V1.json
          if-no-files-found: error
