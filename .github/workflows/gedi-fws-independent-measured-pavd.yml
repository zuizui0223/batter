name: FWS independent measured GEDI PAVD diagnostic
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/gedi-fws-independent-measured-pavd.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measured:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f937b68d2c607004f1ef3a8fe2615e85da0b8e90
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mdbtools
      - run: python -m pip install 'earthaccess>=0.14' 'rasterio>=1.4' requests numpy pandas scipy pyproj
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/fws_measured_pavd_independent_v1.py
      - run: python prospective/gedi_trait_macro_sdm/fws_measured_pavd_independent_v1.py
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        timeout-minutes: 72
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fws-independent-measured-pavd-v1
          path: fws_measured_pavd/report.json
          if-no-files-found: warn
          retention-days: 90
