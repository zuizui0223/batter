name: Wing span and LiDAR voxel resolution audit
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/wing_span_voxel_scale_audit_v1.py
      - .github/workflows/wing-span-voxel-scale-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 88759dd5e1d9622cd8453a644b440c7cc70d02dc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: crane-physical-lsa-crosswalk-v1
          run-id: 45717291943
          github-token: ${{ github.token }}
          path: wing
      - uses: actions/download-artifact@v4
        with:
          name: wing-pavd-frozen-trait-domain-v1
          run-id: 45719681892
          github-token: ${{ github.token }}
          path: domain
      - run: python -m pip install numpy pandas
      - run: python prospective/gedi_trait_macro_sdm/wing_span_voxel_scale_audit_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wing-span-voxel-scale-v1
          path: wing_span_scale/
          if-no-files-found: warn
