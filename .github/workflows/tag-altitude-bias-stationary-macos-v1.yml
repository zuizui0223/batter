name: tag-altitude-bias-stationary-macos-v1

on:
  push:
    branches:
      - diagnostic/tag-altitude-bias-audit-v1
    paths:
      - ".github/workflows/tag-altitude-bias-stationary-macos-v1.yml"
  workflow_dispatch:

jobs:
  stationary-macos:
    runs-on: macos-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        panel:
          - hypsignathus
          - phyllostomus_2016
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Download canonical x-y/time-only preflight artifact
        uses: actions/download-artifact@v4
        with:
          name: tag-bias-preflight-${{ matrix.panel }}-v1
          path: _preflight
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36325288331
      - name: Stage frozen preflight JSON
        run: |
          mkdir -p results
          src="$(find _preflight -type f -name "tag_altitude_bias_preflight_${{ matrix.panel }}_v1.json" -print -quit)"
          test -n "$src"
          cp "$src" "results/tag_altitude_bias_preflight_${{ matrix.panel }}_v1.json"
      - name: Run frozen stationary-height correction
        run: python scripts/run_tag_altitude_bias_stationary.py --panel "${{ matrix.panel }}"
      - uses: actions/upload-artifact@v4
        with:
          name: tag-bias-stationary-macos-${{ matrix.panel }}-v1
          path: results/tag_altitude_bias_stationary_${{ matrix.panel }}_v1.json
          if-no-files-found: error
