name: Unified manuscript figures (source-summary guard)

on:
  pull_request:
    paths:
      - 'prospective/unified_individuality/**'
      - '.github/workflows/unified-manuscript-figures-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-unified-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate six vector figures from pinned source summaries
        run: node prospective/unified_individuality/figures/generate_integrated_figures_v1.cjs
      - name: Regenerate exact original 103-individual Figure 5A/B composite
        run: node prospective/unified_individuality/figures/build_figure5_composite_v2.cjs
      - name: Rebuild anonymous journal-order complete text
        run: node prospective/unified_individuality/build_complete_anonymous_text_v1.cjs
      - name: Guard against stale or hand-edited figures and anonymous text
        run: git diff --exit-code -- prospective/unified_individuality/figures/ prospective/unified_individuality/COMPLETE_ANONYMOUS_TEXT_DRAFT_V1.md
      - name: Check scientific gates, labels, and SVG XML
        run: python3 prospective/unified_individuality/figures/validate_integrated_figures_v1.py
      - name: Audit source-bounded ecological mechanism and mathematical counterexample
        run: python3 prospective/unified_individuality/validate_ecological_identifiability_v1.py
      - name: Upload six main manuscript figures including Figure 5 composite for QA
        uses: actions/upload-artifact@v4
        with:
          name: unified-manuscript-figures-svg-v1
          path: prospective/unified_individuality/figures/FIGURE_*.svg
          if-no-files-found: error
          retention-days: 30
