name: Roost slope cadence datum V22
on:
  push:
    branches: [prospective/roost-3d-connectivity-fd-20261124]
    paths:
      - scripts/roost_slope_cadence_datum_v22.py
      - .github/workflows/roost-slope-cadence-v22.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==1.26.4 requests==2.32.3 openpyxl==3.1.5 pyproj==3.7.0 && pip install -e .
      - run: python scripts/roost_slope_cadence_datum_v22.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roost-slope-cadence-v22
          path: roost_fd_audit/audit_v22_slope.json
          if-no-files-found: error
