name: early-experience-mendeley-api-probe-v1

on:
  push:
    paths:
      - "prospective/early_experience_specialization/mendeley_api_base_probe_v1.py"
      - ".github/workflows/early-experience-mendeley-api-probe-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/early-experience-specialization-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe public API bases
        run: python prospective/early_experience_specialization/mendeley_api_base_probe_v1.py
      - name: Commit transport receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/early_experience_specialization/MENDELEY_API_BASE_PROBE_V1.json
          git add prospective/early_experience_specialization/MENDELEY_API_BASE_PROBE_V1.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record Mendeley API base probe"
            git pull --rebase origin prospective/early-experience-specialization-v1
            git push origin HEAD:prospective/early-experience-specialization-v1
          fi
