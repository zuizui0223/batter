name: same-night-500m-preflight-v1
on:
  push:
    branches: [exploratory/same-night-500m-preflight-v1]
    paths:
      - "post_freeze_extensions/same_night_500m/**"
      - ".github/workflows/same-night-500m-preflight-v1.yml"
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python post_freeze_extensions/same_night_500m/preflight_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-same-night-500m-preflight-v1
          path: |
            post_freeze_extensions/same_night_500m/preflight_result_v1.json
            post_freeze_extensions/same_night_500m/PREFLIGHT_RESULT_V1.md
          if-no-files-found: error
