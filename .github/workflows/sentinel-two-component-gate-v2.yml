name: sentinel-two-component-gate-v2
on:
  push:
    branches:
      - prospective/sentinel-two-component-gate-v2
    paths:
      - "prospective/solution_repertoire_experiment/sentinel_two_component_gate_v2.py"
      - ".github/workflows/sentinel-two-component-gate-v2.yml"
  workflow_dispatch:

jobs:
  conditionally-randomized-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pin numerical runtime
        run: python -m pip install 'numpy==2.3.5'
      - name: Check frozen source SHA256
        run: |
          printf '%s\n' '93b8dfc9f10c9cc78bc1c068a80745fdf9f4787b5c262c3e355fc4b25410408b  prospective/solution_repertoire_experiment/sentinel_two_component_gate_v2.py' | sha256sum -c -
      - name: Verify conditional 4-way and primary 36-way two-block nulls
        run: python prospective/solution_repertoire_experiment/sentinel_two_component_gate_v2.py --self-test
      - name: Reproduce all v2 locked synthetic scenarios for 18 and 24 animals
        run: |
          python prospective/solution_repertoire_experiment/sentinel_two_component_gate_v2.py --out SENTINEL_TWO_COMPONENT_GATE_RESULT_V2.json
          printf '%s\n' '59b37b993a33798cd949297529e8048e88426ddd1114935f4b4f3f26f0642de5  SENTINEL_TWO_COMPONENT_GATE_RESULT_V2.json' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-two-component-gate-v2
          path: SENTINEL_TWO_COMPONENT_GATE_RESULT_V2.json
          if-no-files-found: error
