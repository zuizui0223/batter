name: crowd-learning-s1-schema-v1

on:
  push:
    paths:
      - "prospective/crowd_learning_personal_offset/AUDIT_CONTRACT_V1.md"
      - "prospective/crowd_learning_personal_offset/audit_s1_schema_v1.py"
      - ".github/workflows/crowd-learning-s1-schema-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/crowd-learning-personal-offset-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl
      - name: Run structure-only S1 Data audit
        run: python prospective/crowd_learning_personal_offset/audit_s1_schema_v1.py
      - name: Commit schema receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/crowd_learning_personal_offset/S1_DATA_SCHEMA_V1.json
          git add prospective/crowd_learning_personal_offset/S1_DATA_SCHEMA_V1.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record crowd-learning S1 Data schema"
            git fetch origin prospective/crowd-learning-personal-offset-v1
            git rebase origin/prospective/crowd-learning-personal-offset-v1
            git push origin HEAD:prospective/crowd-learning-personal-offset-v1
          fi
