name: route-centroid-cross-config-v1
on:
  push:
    branches: [post-freeze/route-centroid-cross-config-v1]
    paths:
      - "prospective/task_reset_lockin/CROSS_CONFIGURATION_ROUTE_CENTROID_PORTABILITY_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/cross_configuration_route_centroid_portability_v1.py"
      - ".github/workflows/route-centroid-cross-config-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python prospective/task_reset_lockin/cross_configuration_route_centroid_portability_v1.py > route_centroid_cross_config_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: route-centroid-cross-config-v1
          path: route_centroid_cross_config_result_v1.json
          if-no-files-found: error
