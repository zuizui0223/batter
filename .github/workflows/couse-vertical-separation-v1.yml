name: couse-vertical-separation-v1

on:
  push:
    branches:
      - post-freeze/3d-niche-partition-v1
    paths:
      - "post_freeze_extensions/3d_niche_partition/run_couse_vertical_separation_v1.py"
      - "post_freeze_extensions/3d_niche_partition/COUSE_PRIMARY_ENCOUNTER_RECEIPT_V1.md"
      - "post_freeze_extensions/3d_niche_partition/couse_primary_encounter_receipt_v1.json"
      - "post_freeze_extensions/3d_niche_partition/COUSE_NULL_AMENDMENT_V1.md"
      - "post_freeze_extensions/3d_niche_partition/original_terrain_dem_preflight_receipt_v1.json"
      - ".github/workflows/couse-vertical-separation-v1.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  separation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        panel:
          - hypsignathus
          - phyllostomus_2022
          - phyllostomus_2023
          - phyllostomus_2016
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pandas requests pyproj
      - name: Run fixed-encounter vertical-phase co-use test
        run: python post_freeze_extensions/3d_niche_partition/run_couse_vertical_separation_v1.py --panel "${{ matrix.panel }}"
      - uses: actions/upload-artifact@v4
        with:
          name: couse-vertical-separation-${{ matrix.panel }}-v1
          path: post_freeze_extensions/3d_niche_partition/couse_vertical_results/${{ matrix.panel }}_couse_vertical_result_v1.json
          if-no-files-found: error
