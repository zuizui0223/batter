name: carrier-positive-policy-shape-boundary-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/carrier_positive_policy_shape_boundary_v1.py
      - prospective/field_policy_bridge/CARRIER_POSITIVE_POLICY_SHAPE_BOUNDARY_CONTRACT_V1.md
      - .github/workflows/carrier-positive-policy-shape-boundary-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install batter and dependencies
        run: python -m pip install --quiet -e .
      - name: Run carrier-positive boundary diagnostic
        run: |
          python prospective/field_policy_bridge/carrier_positive_policy_shape_boundary_v1.py | tee prospective/field_policy_bridge/CARRIER_POSITIVE_POLICY_SHAPE_BOUNDARY_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: carrier-positive-policy-shape-boundary-v1
          path: prospective/field_policy_bridge/CARRIER_POSITIVE_POLICY_SHAPE_BOUNDARY_RESULT_V1.json
          if-no-files-found: error
