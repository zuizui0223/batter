name: early-experience-cohort-structure-v1

on:
  push:
    paths:
      - "prospective/early_experience_specialization/COHORT_STRUCTURE_AUDIT_V1.md"
      - "prospective/early_experience_specialization/cohort_structure_audit_v1.py"
      - ".github/workflows/early-experience-cohort-structure-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: early-experience-cohort-structure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/early-experience-specialization-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reader
        run: python -m pip install numpy openpyxl
      - name: Run cohort structure audit
        run: python prospective/early_experience_specialization/cohort_structure_audit_v1.py
      - name: Commit structural receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/early_experience_specialization/COHORT_STRUCTURE_RESULT_V1.json
          git add prospective/early_experience_specialization/COHORT_STRUCTURE_RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No structural changes"
          else
            git commit -m "Record early-experience cohort structure"
            git pull --rebase origin prospective/early-experience-specialization-v1
            git push origin HEAD:prospective/early-experience-specialization-v1
          fi
