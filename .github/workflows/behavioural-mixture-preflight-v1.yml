name: behavioural-mixture-preflight-v1

on:
  push:
    branches:
      - exploratory/behavioral-mixture-v1
    paths:
      - "post_freeze_extensions/behavioural_mixture/preflight_*"
      - ".github/workflows/behavioural-mixture-preflight-v1.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[figure]"
      - run: python post_freeze_extensions/behavioural_mixture/preflight_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-behavioural-mixture-preflight-v1
          path: post_freeze_extensions/behavioural_mixture/preflight_result_v1.json
          if-no-files-found: error
