name: early-experience-schema-audit-v1

on:
  push:
    paths:
      - "prospective/early_experience_specialization/public_schema_audit_v1.py"
      - ".github/workflows/early-experience-schema-audit-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: early-experience-schema-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/early-experience-specialization-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install structural readers
        run: python -m pip install openpyxl scipy
      - name: Run schema-only audit
        run: python prospective/early_experience_specialization/public_schema_audit_v1.py
      - name: Commit schema receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/early_experience_specialization/PUBLIC_SCHEMA_AUDIT_V1.json
          git add prospective/early_experience_specialization/PUBLIC_SCHEMA_AUDIT_V1.md
          if git diff --cached --quiet; then
            echo "No schema changes"
          else
            git commit -m "Record early-experience public schema audit"
            git pull --rebase origin prospective/early-experience-specialization-v1
            git push origin HEAD:prospective/early-experience-specialization-v1
          fi
