name: skill-feedback-ecological-phase-v1
on:
  push:
    branches:
      - prospective/orthogonal-route-practice-v1
    paths:
      - "prospective/solution_repertoire_experiment/skill_feedback_phase_v1.py"
      - ".github/workflows/skill-feedback-ecological-phase-v1.yml"
  workflow_dispatch:
jobs:
  mathematical-bifurcation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
      - name: Check exact bifurcation and stochastic branch retention
        run: |
          python prospective/solution_repertoire_experiment/skill_feedback_phase_v1.py > phase_stdout.json
      - uses: actions/upload-artifact@v4
        with:
          name: skill-feedback-ecological-phase-v1
          path: |
            SKILL_FEEDBACK_PHASE_RESULT_V1.json
            phase_stdout.json
          if-no-files-found: error
