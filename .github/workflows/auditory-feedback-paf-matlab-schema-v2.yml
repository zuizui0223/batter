name: auditory-feedback-paf-matlab-schema-v2

on:
  push:
    paths:
      - "prospective/auditory_feedback_individualization/download_paf_for_schema_v2.py"
      - "prospective/auditory_feedback_individualization/paf_schema_audit_matlab_v2.m"
      - ".github/workflows/auditory-feedback-paf-matlab-schema-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/auditory-feedback-individualization-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download PAF source
        run: python prospective/auditory_feedback_individualization/download_paf_for_schema_v2.py
      - uses: matlab-actions/setup-matlab@v2
      - name: Inspect MATLAB table structure only
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('prospective/auditory_feedback_individualization'); paf_schema_audit_matlab_v2
      - name: Commit schema receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/auditory_feedback_individualization/PAF_SCHEMA_AUDIT_V2.json
          git add prospective/auditory_feedback_individualization/PAF_SCHEMA_AUDIT_V2.md
          if git diff --cached --quiet; then
            echo "No schema changes"
          else
            git commit -m "Record MATLAB-native PAF schema audit"
            git fetch origin prospective/auditory-feedback-individualization-v1
            git rebase origin/prospective/auditory-feedback-individualization-v1
            git push origin HEAD:prospective/auditory-feedback-individualization-v1
          fi
