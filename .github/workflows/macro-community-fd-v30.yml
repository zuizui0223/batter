name: V30 continental structural grain information
on:
  push:
    branches: [prospective/macro-community-fd-20261127]
    paths:
      - .github/workflows/macro-community-fd-v30.yml
permissions:
  contents: read
  actions: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: europe-common-forest-support-v1
          run-id: 45585033345
          github-token: ${{ github.token }}
          path: pilot
      - uses: actions/download-artifact@v4
        with:
          name: baseline-covariates-terrain
          run-id: 45659440994
          github-token: ${{ github.token }}
          path: prior_terrain
      - uses: actions/download-artifact@v4
        with:
          name: baseline-lc100-alternative-v1
          run-id: 45713474572
          github-token: ${{ github.token }}
          path: prior_alternative
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3 rasterio==1.4.3 pyproj==3.7.1 requests==2.32.5
      - run: python -m py_compile prospective/macro_community_fd/macro_fd_v30_structural_grain.py
      - run: python prospective/macro_community_fd/macro_fd_v30_structural_grain.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-community-fd-v30-aggregate
          path: macro_fd_v30_result.json
          if-no-files-found: error
          retention-days: 90
