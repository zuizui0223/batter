name: LC100 forest-type and terrain alternative baseline sensitivity
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/gvsm-baseline-lc100-alternative.yml
permissions:
  contents: read
  actions: read
jobs:
  alternative:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: europe-common-forest-support-v1
          run-id: 45585033345
          github-token: ${{ github.token }}
          path: pilot
      - uses: actions/download-artifact@v4
        with:
          name: baseline-covariates-terrain
          run-id: 45659440994
          github-token: ${{ github.token }}
          path: baseline_terrain
      - run: python -m pip install numpy==2.5.5 pandas==3.1.1 scipy==1.18.1 requests rasterio pyproj
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/baseline_lc100_covariates_v1.py prospective/gedi_trait_macro_sdm/baseline_leaf_terrain_challenge_v1.py
      - run: python prospective/gedi_trait_macro_sdm/baseline_lc100_covariates_v1.py
        timeout-minutes: 35
      - run: python prospective/gedi_trait_macro_sdm/baseline_leaf_terrain_challenge_v1.py --lc100-alternative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-lc100-alternative-v1
          path: |
            baseline_lc100/
            baseline_lc100_challenge/
          if-no-files-found: error
          retention-days: 90
