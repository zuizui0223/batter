name: yamada-personal-speed-state-primary-v1
on:
  push:
    branches: [prospective/learning-state-theta-v1]
    paths:
      - prospective/learning_state_theta/personal_speed_state_v1.py
      - prospective/learning_state_theta/PERSONAL_SPEED_STATE_CONTRACT_V1.md
      - .github/workflows/yamada-personal-speed-state-primary-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  primary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet numpy
      - name: Run frozen scalar persistence primary
        run: python prospective/learning_state_theta/personal_speed_state_v1.py | tee prospective/learning_state_theta/PERSONAL_SPEED_STATE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: yamada-personal-speed-state-primary-v1
          path: prospective/learning_state_theta/PERSONAL_SPEED_STATE_RESULT_V1.json
          if-no-files-found: error
