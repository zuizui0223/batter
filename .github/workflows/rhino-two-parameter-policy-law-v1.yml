name: rhino-two-parameter-policy-law-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/two_parameter_policy_law_v1.py
      - prospective/task_reset_lockin/TWO_PARAMETER_POLICY_LAW_CONTRACT_V1.md
      - .github/workflows/rhino-two-parameter-policy-law-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  law:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run two-parameter held-out law
        run: |
          python prospective/task_reset_lockin/two_parameter_policy_law_v1.py | tee prospective/task_reset_lockin/TWO_PARAMETER_POLICY_LAW_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-two-parameter-policy-law-v1
          path: prospective/task_reset_lockin/TWO_PARAMETER_POLICY_LAW_RESULT_V1.json
          if-no-files-found: error
