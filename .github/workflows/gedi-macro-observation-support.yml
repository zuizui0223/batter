name: Existing European occurrence observation support audit
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/observation_support_audit_v1.py
      - .github/workflows/gedi-macro-observation-support.yml
permissions:
  contents: read
  actions: read
jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: europe-own-database-support-v1
          run-id: 45579163494
          github-token: ${{ github.token }}
          path: census
      - uses: actions/download-artifact@v4
        with:
          name: gedi-macro-iberia-join
          run-id: 45575962660
          github-token: ${{ github.token }}
          path: traits
      - run: python -m pip install numpy pandas
      - run: python prospective/gedi_trait_macro_sdm/observation_support_audit_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: europe-observation-support-v1
          path: observation_support/
          retention-days: 90
          if-no-files-found: error
