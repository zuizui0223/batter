name: Own Iberian occurrence trait environment database
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/join_own_database_v1.py
      - .github/workflows/gedi-macro-own-database.yml
permissions:
  contents: read
  actions: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gedi-macro-iberia-join
          run-id: 45575962660
          github-token: ${{ github.token }}
          path: prior_occurrences
      - uses: actions/download-artifact@v4
        with:
          name: iberia-chelsa-baseline
          run-id: 45576537101
          github-token: ${{ github.token }}
          path: prior_climate
      - uses: actions/download-artifact@v4
        with:
          name: iberia-worldcover-baseline
          run-id: 45576649247
          github-token: ${{ github.token }}
          path: prior_landcover
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-iberia-real-source
          run-id: 45577861777
          github-token: ${{ github.token }}
          path: prior_gvsm
      - run: python -m pip install numpy pandas rasterio pyproj
      - run: python prospective/gedi_trait_macro_sdm/join_own_database_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iberia-own-database-v1
          path: own_database/
          retention-days: 90
          if-no-files-found: error
