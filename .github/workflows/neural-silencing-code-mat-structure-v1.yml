name: neural-silencing-code-mat-structure-v1

on:
  push:
    branches:
      - prospective/neural-silencing-policy-v1
    paths:
      - prospective/neural_silencing_policy/code_mat_structure_v1.py
      - prospective/neural_silencing_policy/CODE_MAT_STRUCTURE_CONTRACT_V1.md
      - .github/workflows/neural-silencing-code-mat-structure-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install structural readers
        run: python -m pip install --quiet scipy h5py
      - name: Open source code and MAT directories only
        shell: bash
        run: |
          set -euo pipefail
          python prospective/neural_silencing_policy/code_mat_structure_v1.py | tee prospective/neural_silencing_policy/CODE_MAT_STRUCTURE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neural-silencing-code-mat-structure-v1
          path: prospective/neural_silencing_policy/CODE_MAT_STRUCTURE_RESULT_V1.json
          if-no-files-found: warn
