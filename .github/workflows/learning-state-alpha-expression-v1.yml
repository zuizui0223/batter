name: learning-state-alpha-expression-v1
on:
  push:
    branches: [post-freeze/learning-alpha-expression-v1]
    paths:
      - "prospective/learning_state_theta/LEARNING_STATE_EXPRESSION_STRENGTH_CONTRACT_V1.md"
      - "prospective/learning_state_theta/learning_state_expression_strength_v1.py"
      - ".github/workflows/learning-state-alpha-expression-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python prospective/learning_state_theta/learning_state_expression_strength_v1.py > learning_state_expression_strength_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: learning-state-alpha-expression-v1
          path: learning_state_expression_strength_result_v1.json
          if-no-files-found: error
