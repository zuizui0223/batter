name: Bayer historical wind and GPS-HR baseline V19
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/bayer_wind_hr_v19.py
      - .github/workflows/bayer-wind-hr-v19.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy==2.4.6
      - run: python scripts/bayer_wind_hr_v19.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayer-wind-hr-v19
          path: results/bayer_wind_hr_v19.json
          retention-days: 60
          if-no-files-found: error
