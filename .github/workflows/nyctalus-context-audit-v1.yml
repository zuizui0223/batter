name: nyctalus-context-audit-v1
on:
  push:
    branches: [post-freeze/nyctalus-context-audit-v1]
    paths:
      - "post_freeze_extensions/nyctalus_context_audit/**"
      - ".github/workflows/nyctalus-context-audit-v1.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pandas requests
      - name: Audit dist_start semantics without vertical outcomes
        run: python post_freeze_extensions/nyctalus_context_audit/run_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-nyctalus-context-audit-v1
          path: |
            post_freeze_extensions/nyctalus_context_audit/result_v1.json
            post_freeze_extensions/nyctalus_context_audit/RESULT_V1.md
          if-no-files-found: error
