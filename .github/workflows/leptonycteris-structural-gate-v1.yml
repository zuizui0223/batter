name: leptonycteris-structural-gate-v1
on:
  push:
    branches: [prospective/leptonycteris-structural-gate-v1]
    paths:
      - "post_freeze_extensions/leptonycteris_external_validation/**"
      - ".github/workflows/leptonycteris-structural-gate-v1.yml"
  workflow_dispatch:
jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e . pandas requests beautifulsoup4 openpyxl
      - name: Run outcome-blind structural gate
        run: python post_freeze_extensions/leptonycteris_external_validation/structural_preflight_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-leptonycteris-structural-gate-v1
          path: |
            post_freeze_extensions/leptonycteris_external_validation/structural_result_v1.json
            post_freeze_extensions/leptonycteris_external_validation/STRUCTURAL_RESULT_V1.md
          if-no-files-found: error
