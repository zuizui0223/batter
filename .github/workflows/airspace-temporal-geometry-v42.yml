name: Airspace temporal geometry V42
on:
  push:
    branches: [prospective/roost-3d-connectivity-fd-20261124]
    paths:
      - scripts/airspace_temporal_geometry_v42.py
      - .github/workflows/airspace-temporal-geometry-v42.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4 pandas==2.2.3 requests==2.32.3 openpyxl==3.1.5
      - run: python scripts/airspace_temporal_geometry_v42.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airspace-temporal-geometry-v42
          path: roost_fd_audit/audit_v42_temporal_geometry.json
          if-no-files-found: error
