name: allocation-state-autocorrelation-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/allocation_state_autocorrelation_v1.py
      - prospective/field_policy_bridge/ALLOCATION_STATE_AUTOCORRELATION_CONTRACT_V1.md
      - .github/workflows/allocation-state-autocorrelation-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet -e .
      - name: Run within-individual state persistence test
        run: |
          python prospective/field_policy_bridge/allocation_state_autocorrelation_v1.py | tee prospective/field_policy_bridge/ALLOCATION_STATE_AUTOCORRELATION_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allocation-state-autocorrelation-v1
          path: prospective/field_policy_bridge/ALLOCATION_STATE_AUTOCORRELATION_RESULT_V1.json
          if-no-files-found: warn
