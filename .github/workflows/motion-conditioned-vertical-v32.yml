name: Motion-conditioned vertical identity V32
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/motion_conditioned_vertical_v32.py
      - .github/workflows/motion-conditioned-vertical-v32.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        panel: [tadarida, eidolon, hypsignathus, phyllostomus_2022, phyllostomus_2023, phyllostomus_2016]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m scripts.motion_conditioned_vertical_v32 --panel ${{ matrix.panel }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-conditioned-v32-${{ matrix.panel }}
          path: results/motion_conditioned_vertical_v32_${{ matrix.panel }}.json
          if-no-files-found: error
          retention-days: 60
