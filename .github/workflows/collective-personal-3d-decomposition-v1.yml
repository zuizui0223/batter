name: collective-personal-3d-decomposition-v1

on:
  push:
    branches: [post-freeze/collective-personal-3d-decomposition-v1]
    paths:
      - "post_freeze_extensions/collective_personal_3d_decomposition/**"
      - ".github/workflows/collective-personal-3d-decomposition-v1.yml"
  workflow_dispatch:

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python post_freeze_extensions/collective_personal_3d_decomposition/run_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: collective-personal-3d-decomposition-v1
          path: |
            post_freeze_extensions/collective_personal_3d_decomposition/result_v1.json
            post_freeze_extensions/collective_personal_3d_decomposition/RESULT_V1.md
          if-no-files-found: error
