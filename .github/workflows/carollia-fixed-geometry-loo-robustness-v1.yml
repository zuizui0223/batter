name: carollia-fixed-geometry-loo-robustness-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/CAROLLIA_FIXED_GEOMETRY_LOO_ROBUSTNESS_CONTRACT_V1.md
      - prospective/task_reset_lockin/carollia_fixed_geometry_loo_robustness_v1.py
      - .github/workflows/carollia-fixed-geometry-loo-robustness-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet numpy h5py
      - name: Run exhaustive fixed-geometry LOO audit
        shell: bash
        run: |
          set -euo pipefail
          python prospective/task_reset_lockin/carollia_fixed_geometry_loo_robustness_v1.py | tee prospective/task_reset_lockin/CAROLLIA_FIXED_GEOMETRY_LOO_ROBUSTNESS_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carollia-fixed-geometry-loo-robustness-v1
          path: prospective/task_reset_lockin/CAROLLIA_FIXED_GEOMETRY_LOO_ROBUSTNESS_RESULT_V1.json
          if-no-files-found: warn
