name: movement-state-conditioning-v1

on:
  push:
    branches:
      - exploratory/movement-state-conditioning-v1
    paths:
      - "post_freeze_extensions/movement_state_conditioning/contract_v1.json"
      - "post_freeze_extensions/movement_state_conditioning/run_v1.py"
      - ".github/workflows/movement-state-conditioning-v1.yml"
  workflow_dispatch:

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        panel:
          - eidolon
          - hypsignathus
          - phyllostomus_2022
          - phyllostomus_2023
          - phyllostomus_2016
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run frozen movement-state-conditioned identity test
        run: python post_freeze_extensions/movement_state_conditioning/run_v1.py --panel "${{ matrix.panel }}"
      - uses: actions/upload-artifact@v4
        with:
          name: movement-state-panel-${{ matrix.panel }}-v1
          path: post_freeze_extensions/movement_state_conditioning/panel_results/panel_${{ matrix.panel }}_v1.json
          if-no-files-found: error

  aggregate:
    needs: panel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: movement-state-panel-*-v1
          path: post_freeze_extensions/movement_state_conditioning/panel_results
          merge-multiple: true
      - name: Aggregate frozen movement-state test
        run: python post_freeze_extensions/movement_state_conditioning/run_v1.py --aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: batter-movement-state-conditioning-v1
          path: |
            post_freeze_extensions/movement_state_conditioning/result_v1.json
            post_freeze_extensions/movement_state_conditioning/RESULT_V1.md
          if-no-files-found: error
