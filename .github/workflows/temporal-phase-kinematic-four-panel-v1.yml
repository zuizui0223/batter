name: temporal-phase-kinematic-four-panel-v1
on:
  push:
    branches: [exploratory/temporal-phase-kinematic-four-panel-v1]
    paths:
      - "post_freeze_extensions/temporal_phase_kinematic_four_panel/**"
      - ".github/workflows/temporal-phase-kinematic-four-panel-v1.yml"
  workflow_dispatch:
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix:
        panel: [hypsignathus, phyllostomus_2022, phyllostomus_2023, phyllostomus_2016]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python post_freeze_extensions/temporal_phase_kinematic_four_panel/run_v1.py --panel "${{ matrix.panel }}"
      - uses: actions/upload-artifact@v4
        with:
          name: temporal-phase-kinematic-four-${{ matrix.panel }}-v1
          path: post_freeze_extensions/temporal_phase_kinematic_four_panel/panel_results/panel_${{ matrix.panel }}_v1.json
          if-no-files-found: error
  aggregate:
    needs: panel
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: temporal-phase-kinematic-four-*-v1
          path: post_freeze_extensions/temporal_phase_kinematic_four_panel/panel_results
          merge-multiple: true
      - run: python post_freeze_extensions/temporal_phase_kinematic_four_panel/run_v1.py --aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: batter-temporal-phase-kinematic-four-panel-v1
          path: |
            post_freeze_extensions/temporal_phase_kinematic_four_panel/result_v1.json
            post_freeze_extensions/temporal_phase_kinematic_four_panel/RESULT_V1.md
          if-no-files-found: error
