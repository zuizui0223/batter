name: Acoustic trajectory buzz geometry V36
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/acoustic_buzz_geometry_v36.py
      - .github/workflows/acoustic-buzz-geometry-v36.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy scipy
      - run: python scripts/acoustic_buzz_geometry_v36.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acoustic-buzz-geometry-v36
          path: results/acoustic_buzz_geometry_v36.json
          if-no-files-found: error
          retention-days: 60
