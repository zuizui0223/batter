name: public-causal-synthesis-figures-v1

on:
  push:
    paths:
      - "prospective/public_causal_synthesis/MASTER_RESULTS_TABLE_V1.md"
      - "prospective/public_causal_synthesis/FIGURE_PLAN_V1.md"
      - "prospective/public_causal_synthesis/plot_synthesis_figures_v1.py"
      - ".github/workflows/public-causal-synthesis-figures-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-causal-synthesis-figures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/public-causal-synthesis-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plotting dependency
        run: python -m pip install matplotlib numpy
      - name: Generate figures
        run: python prospective/public_causal_synthesis/plot_synthesis_figures_v1.py
      - name: Commit figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/public_causal/
          if git diff --cached --quiet; then
            echo "No figure changes"
          else
            git commit -m "Generate public causal synthesis figures v1"
            git fetch origin prospective/public-causal-synthesis-v1
            git rebase origin/prospective/public-causal-synthesis-v1
            git push origin HEAD:prospective/public-causal-synthesis-v1
          fi
