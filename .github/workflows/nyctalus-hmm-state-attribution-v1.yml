name: nyctalus-hmm-state-attribution-v1
on:
  push:
    branches: [post-freeze/nyctalus-hmm-state-attribution-v1]
    paths:
      - "post_freeze_extensions/nyctalus_hmm_state_attribution/**"
      - ".github/workflows/nyctalus-hmm-state-attribution-v1.yml"
  workflow_dispatch:
jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e . pandas requests
      - name: Run frozen support-matched attribution
        run: python post_freeze_extensions/nyctalus_hmm_state_attribution/run_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-nyctalus-hmm-state-attribution-v1
          path: |
            post_freeze_extensions/nyctalus_hmm_state_attribution/result_v1.json
            post_freeze_extensions/nyctalus_hmm_state_attribution/RESULT_V1.md
          if-no-files-found: error
