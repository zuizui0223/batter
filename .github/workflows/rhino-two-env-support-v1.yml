name: rhino-two-env-support-v1
on:
  push:
    branches: [post-freeze/rhino-two-env-support-v1]
    paths:
      - "prospective/task_reset_lockin/RHINO_TWO_ENV_SUPPORT_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/rhino_two_env_support_v1.py"
      - ".github/workflows/rhino-two-env-support-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python prospective/task_reset_lockin/rhino_two_env_support_v1.py > rhino_two_env_support_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-two-env-support-v1
          path: rhino_two_env_support_result_v1.json
          if-no-files-found: error
