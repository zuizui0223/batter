name: myotis-masking-structure-audit-v1

on:
  push:
    paths:
      - "prospective/myotis_masker_personal_state/MYOTIS_MASKING_STRUCTURE_AUDIT_CONTRACT_V1.md"
      - "prospective/myotis_masker_personal_state/CONTROL1_ACOUSTIC_STATE_CONTRACT_V1.md"
      - "prospective/myotis_masker_personal_state/MAIN_FLIGHT_TIME_STATE_CONTRACT_V1.md"
      - "prospective/myotis_masker_personal_state/myotis_structure_audit_v1.py"
      - ".github/workflows/myotis-masking-structure-audit-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/myotis-masker-personal-state-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run outcome-blind structural audit
        run: python prospective/myotis_masker_personal_state/myotis_structure_audit_v1.py
      - name: Commit structural receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/myotis_masker_personal_state/MYOTIS_STRUCTURE_RESULT_V1.json
          git add prospective/myotis_masker_personal_state/MYOTIS_STRUCTURE_RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No structural changes"
          else
            git commit -m "Record Myotis masking structural audit"
            git push
          fi
