name: rhino-theta-lane-link-v1
on:
  push:
    branches: [post-freeze/rhino-theta-lane-link-v1]
    paths:
      - "prospective/task_reset_lockin/THETA_LANE_LINK_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/theta_lane_link_v1.py"
      - ".github/workflows/rhino-theta-lane-link-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python prospective/task_reset_lockin/theta_lane_link_v1.py > theta_lane_link_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-theta-lane-link-v1
          path: theta_lane_link_result_v1.json
          if-no-files-found: error
