name: Bighorn moose strict date-only source rescue (aggregate only)

on:
  workflow_dispatch:
  push:
    branches: [prospective/multitaxon-identity-ecology-v1]
    paths:
      - 'prospective/multitaxon_individuality/bighorn_date_only_x_v1.py'
      - 'prospective/multitaxon_individuality/tests/test_bighorn_date_only_x_v1.py'
      - '.github/workflows/bighorn-date-only-original-x-v1.yml'

permissions:
  contents: read

jobs:
  source-day-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Strict synthetic timestamp tests; no raw tracks
        run: python3 -m unittest discover -s prospective/multitaxon_individuality/tests -p 'test_bighorn_date_only_x_v1.py' -v
      - name: Get complete public original files, verify publisher MD5, compute matched dyad X
        run: |
          mkdir -p "$RUNNER_TEMP/aggregate" "$RUNNER_TEMP/originals"
          python3 prospective/multitaxon_individuality/bighorn_date_only_x_v1.py \
            --cache "$RUNNER_TEMP/originals" \
            --out "$RUNNER_TEMP/aggregate/BIGHORN_DATE_ONLY_X_2026_10_20.json"
      - name: Upload source-safe aggregate receipt, not GPS or identifiers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bighorn-date-only-source-aggregate
          path: ${{ runner.temp }}/aggregate/BIGHORN_DATE_ONLY_X_2026_10_20.json
          if-no-files-found: ignore
          retention-days: 14