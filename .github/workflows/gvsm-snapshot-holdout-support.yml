name: GVSM fixed snapshot disjoint holdout support
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/snapshot_holdout_support_v1.py
      - .github/workflows/gvsm-snapshot-holdout-support.yml
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-gbif-fixed-snapshot
          run-id: 45591123869
          github-token: ${{ github.token }}
          path: fixed
      - uses: actions/download-artifact@v4
        with:
          name: europe-common-forest-support-v1
          run-id: 45585033345
          github-token: ${{ github.token }}
          path: common_forest
      - uses: actions/download-artifact@v4
        with:
          name: gedi-macro-iberia-join
          run-id: 45575962660
          github-token: ${{ github.token }}
          path: traits
      - run: python -m pip install numpy pandas pyproj
      - run: python prospective/gedi_trait_macro_sdm/snapshot_holdout_support_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gvsm-fixed-snapshot-holdout-support
          path: snapshot_holdout_support/
          if-no-files-found: error
