name: pairwise-null-vectorized-v1
on:
  push:
    branches: [diagnostic/cross-panel-confound-audit-v1]
    paths:
      - "scripts/run_effect_translation_null_calibration_vectorized.py"
      - ".github/workflows/pairwise-null-vectorized-v1.yml"
  workflow_dispatch:
jobs:
  vectorized-null:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        panel: [tadarida, hypsignathus, phyllostomus_2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python scripts/run_effect_translation_null_calibration_vectorized.py --panel "${{ matrix.panel }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pairwise-null-vectorized-${{ matrix.panel }}-v1
          path: results/effect_null_pairwise_vectorized_${{ matrix.panel }}_v1.json
          if-no-files-found: error
