name: Roost slope Desmodus preflight V20
on:
  push:
    branches: [prospective/roost-3d-connectivity-fd-20261124]
    paths:
      - scripts/roost_slope_desmodus_preflight_v20.py
      - .github/workflows/roost-slope-desmodus-preflight-v20.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==1.26.4 requests==2.32.3 openpyxl==3.1.5
      - run: python scripts/roost_slope_desmodus_preflight_v20.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roost-slope-desmodus-preflight-v20
          path: roost_fd_audit/audit_v20_desmodus.json
          if-no-files-found: error
