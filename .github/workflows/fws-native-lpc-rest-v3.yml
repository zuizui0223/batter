name: FWS official LPC REST geometry support V3
on:
  workflow_dispatch:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/fws-native-lpc-rest-v3.yml
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ebc2535e009bcbde19fa076f4a9c3f9501f966a9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mdbtools
      - run: python -m pip install numpy pandas scipy requests rasterio pyproj 'shapely>=2' pyogrio
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/fws_native_lpc_rest_v3.py
      - run: python prospective/gedi_trait_macro_sdm/fws_native_lpc_rest_v3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fws-native-lpc-rest-v3
          path: fws_native_lpc_rest/report.json
          if-no-files-found: error
          retention-days: 90
