name: Bat-to-LiDAR independent surveyed registration gate v1
on:
  push:
    branches:
      - prospective/air-volume-observation-kernel-20261123
    paths:
      - 'src/batter/air_volume_registration_v1.py'
      - 'tests/test_air_volume_registration_v1.py'
      - '.github/workflows/bat-lidar-rigid-registration-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic_noncollinear_world_ties:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install batter existing scientific test package
        run: python -m pip install -e '.[test]'
      - name: Rigid surveyed source CRS/AGL/heldout control tests
        run: python -m pytest -q tests/test_air_volume_registration_v1.py
