name: England measured woodland structure public grid support V1
on:
  workflow_dispatch:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/england-woodland-structure-gate-v1.yml
permissions:
  contents: read
  actions: read
jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7af1a999be10be939d4d5bdca562540c16b370a7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: independent-community-england-v1
          run-id: 45867952345
          github-token: ${{ github.token }}
          path: nwbs
      - run: python -m pip install numpy pandas requests rasterio pyogrio
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/england_woodland_structure_gate_v1.py
      - run: python prospective/gedi_trait_macro_sdm/england_woodland_structure_gate_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: england-woodland-structure-public-grid-v1
          path: england_woodland_structure/
          if-no-files-found: error
          retention-days: 90
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7af1a999be10be939d4d5bdca562540c16b370a7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas requests rasterio pyogrio
      - run: python prospective/gedi_trait_macro_sdm/england_woodland_structure_gate_v1.py limitations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: england-ncea-limitations-v1
          path: england_woodland_structure/
          if-no-files-found: error
          retention-days: 90
