name: carollia-external-axis-influence-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/carollia_external_axis_influence_v1.py
      - prospective/task_reset_lockin/CAROLLIA_EXTERNAL_AXIS_INFLUENCE_CONTRACT_V1.md
      - .github/workflows/carollia-external-axis-influence-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet numpy h5py
      - name: Run frozen Carollia decomposition and influence audit
        run: |
          python prospective/task_reset_lockin/carollia_external_axis_influence_v1.py | tee prospective/task_reset_lockin/CAROLLIA_EXTERNAL_AXIS_INFLUENCE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: carollia-external-axis-influence-v1
          path: prospective/task_reset_lockin/CAROLLIA_EXTERNAL_AXIS_INFLUENCE_RESULT_V1.json
          if-no-files-found: error
