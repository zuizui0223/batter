name: jae-active-reference-guard-v0.4.0

on:
  push:
    branches:
      - release/jae-v0.4.0-rc2
    paths:
      - "README.md"
      - "CURRENT_STATUS.md"
      - "SUBMISSION_MANIFEST_JAE_V0_4_0.md"
      - "SUBMISSION_MANIFEST_JAE_V0_4_0.json"
      - "manuscript/JAE_SUBMISSION_READINESS_V0_4_0.md"
      - "FINAL_METADATA_INTAKE_JAE_V0_4_0.md"
      - "RELEASE_NOTES_JAE_V0_4_0.md"
      - "submission/jae_v0_4_0_metadata.template.json"
      - "scripts/check_active_submission_refs_v0_4_0.py"
      - ".github/workflows/jae-active-reference-guard-v0.4.0.yml"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_active_submission_refs_v0_4_0.py
