name: rhino-geometry-env-shared-decoder-lobo-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/GEOMETRY_ENV_SHARED_DECODER_LOBO_CONTRACT_V1.md
      - prospective/task_reset_lockin/geometry_env_shared_decoder_lobo_v1.py
      - .github/workflows/rhino-geometry-env-shared-decoder-lobo-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run LOBO environment-specific decoder test
        shell: bash
        run: |
          set -euo pipefail
          python prospective/task_reset_lockin/geometry_env_shared_decoder_lobo_v1.py | tee prospective/task_reset_lockin/GEOMETRY_ENV_SHARED_DECODER_LOBO_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhino-geometry-env-shared-decoder-lobo-v1
          path: prospective/task_reset_lockin/GEOMETRY_ENV_SHARED_DECODER_LOBO_RESULT_V1.json
          if-no-files-found: warn
