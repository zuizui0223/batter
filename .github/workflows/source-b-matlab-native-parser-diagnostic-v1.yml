name: source-b-matlab-native-parser-diagnostic-v1

on:
  push:
    branches:
      - prospective/ontogenetic-path-dependence-v1
    paths:
      - prospective/ontogenetic_path_dependence/SOURCE_B_MATLAB_NATIVE_READER_AMENDMENT_V1.md
      - prospective/ontogenetic_path_dependence/download_matlab_probe_v1.py
      - prospective/ontogenetic_path_dependence/source_b_matlab_native_parser_diagnostic_v1.m
      - .github/workflows/source-b-matlab-native-parser-diagnostic-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matlab-native-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download identity-pinned probe files
        run: python prospective/ontogenetic_path_dependence/download_matlab_probe_v1.py
      - name: Guard numeric output
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("prospective/ontogenetic_path_dependence/source_b_matlab_native_parser_diagnostic_v1.m").read_text()
          banned=["min(","max(","mean(","median(","disp(v)","fprintf('%f","plot(","scatter("]
          hits=[x for x in banned if x in p]
          if hits:
              raise SystemExit(f"numeric-output guard failed: {hits}")
          print("class/name/shape-only guard PASS")
          PY
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
      - name: Run MATLAB-native diagnostic
        uses: matlab-actions/run-command@v2
        with:
          command: addpath("prospective/ontogenetic_path_dependence"), source_b_matlab_native_parser_diagnostic_v1
