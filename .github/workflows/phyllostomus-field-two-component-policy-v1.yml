name: phyllostomus-field-two-component-policy-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/field_two_component_policy_carrier_v1.py
      - prospective/field_policy_bridge/FIELD_TWO_COMPONENT_POLICY_CARRIER_CONTRACT_V1.md
      - .github/workflows/phyllostomus-field-two-component-policy-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy2d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet -e .
      - name: Run frozen 2-D field policy diagnostic
        run: |
          python prospective/field_policy_bridge/field_two_component_policy_carrier_v1.py | tee prospective/field_policy_bridge/FIELD_TWO_COMPONENT_POLICY_CARRIER_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: phyllostomus-field-two-component-policy-v1
          path: prospective/field_policy_bridge/FIELD_TWO_COMPONENT_POLICY_CARRIER_RESULT_V1.json
          if-no-files-found: error
