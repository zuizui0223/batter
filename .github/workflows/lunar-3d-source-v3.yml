name: Lunar 3D V3 source reference and night admission
on:
  push:
    branches:
      - prospective/lunar-3d-response-gate-v1-20261122
    paths:
      - 'prospective/lunar_3d/lunar_source_admission_v3.py'
      - 'prospective/lunar_3d/test_lunar_source_admission_v3.py'
      - '.github/workflows/lunar-3d-source-v3.yml'
  workflow_dispatch:
jobs:
  v3_source_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pyswisseph==2.10.3.2'
      - name: Source-free v3 tests
        run: python -m unittest -v prospective.lunar_3d.test_lunar_source_admission_v3
      - name: Original source + reference eligible support
        run: python -m prospective.lunar_3d.lunar_source_admission_v3
      - name: Archive only anonymous source-level support
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunar-v3-source-admission
          path: results/lunar_3d_source_admission_v3.json
          if-no-files-found: warn
          retention-days: 30
