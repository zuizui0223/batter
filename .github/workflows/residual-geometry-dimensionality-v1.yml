name: residual-geometry-dimensionality-v1
on:
  push:
    branches: [post-freeze/residual-geometry-dimensionality-v1]
    paths:
      - "prospective/task_reset_lockin/RESIDUAL_GEOMETRY_DIMENSIONALITY_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/residual_geometry_dimensionality_v1.py"
      - ".github/workflows/residual-geometry-dimensionality-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python prospective/task_reset_lockin/residual_geometry_dimensionality_v1.py > residual_geometry_dimensionality_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: residual-geometry-dimensionality-v1
          path: residual_geometry_dimensionality_result_v1.json
          if-no-files-found: error
