name: Restore JAE original individual 3D profile Figure 6

on:
  pull_request:
    paths:
      - '.github/workflows/unified-restore-original-profile-v1.yml'

permissions:
  contents: write
  actions: read

jobs:
  import-source-profile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'prospective/unified-be-jae-individuality-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Download originally frozen JAE Figure 6 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/jae-original-figure
          gh run download 36375056204 \
            --repo "$GH_REPO" \
            --name centered-shape-profile-descriptive-v1 \
            --dir /tmp/jae-original-figure

      - name: Validate exact source hash and per-individual profile integrity
        run: |
          python3 - <<'PY'
          import csv, hashlib, json
          from collections import Counter
          from pathlib import Path

          root=Path('/tmp/jae-original-figure')
          expected={
              'results/centered_shape_individual_profiles_v1.csv':'91cae4c22588db0976dfe3e273eabebaa89dc2844e996f42d01ef617672dc3f8',
              'results/centered_shape_individual_profiles_v1.json':'9efd5d2914ad012905a004aee1114d715deaaf94e3f54689deb4f1208a188cb2',
              'figures/submission_v0_3_7/figure6_individual_centered_shape_profiles.png':'654350e40124f0b3e9430c594adc71ae4e4688c31ac78f633c5797b3b3297009',
          }
          for relative,digest in expected.items():
              fp=root/relative
              assert fp.is_file(), f'Missing original archived artifact: {relative}'
              calculated=hashlib.sha256(fp.read_bytes()).hexdigest()
              assert calculated==digest, f'SHA256 mismatch: {relative} {calculated}'
              print('SHA256 OK',relative)

          with (root/'results/centered_shape_individual_profiles_v1.csv').open(newline='',encoding='utf-8') as f:
              rows=list(csv.DictReader(f))
          expected_n={'eidolon':20,'hypsignathus':24,'phyllostomus_2022':33,'phyllostomus_2023':16,'phyllostomus_2016':10}
          counts=Counter(r['panel'] for r in rows)
          assert counts==expected_n, counts
          assert len(rows)==103
          assert all(r['individual'] for r in rows)
          for row in rows:
              cols=[x for x in row if x.startswith('bin_')]
              assert len(cols)==10
              probs=[float(row[x]) for x in cols]
              assert all(0 <= p <= 1 for p in probs)
              assert abs(sum(probs)-1) <= 1e-9, row['individual']
              assert abs(sum(probs[7:])-float(row['upper_tail_mass_ge_100m']))<1e-9
              assert abs(sum(probs[:3])-float(row['lower_tail_mass_le_minus100m']))<1e-9
              assert abs(sum(probs[4:6])-float(row['central_mass_minus50_to_50m']))<1e-9
          original=json.loads((root/'results/centered_shape_individual_profiles_v1.json').read_text())
          assert original['study_id']=='batter-centered-shape-profile-descriptive-v1'
          assert len(original['individual_profiles'])==103
          assert not original['claim_boundary']['new_hypothesis_test']
          print('PASS original individual profile integrity: 103 rows / 5 panels / 10 bins each')
          PY

      - name: Copy immutable original CSV JSON PNG to integration branch
        run: |
          dest="prospective/unified_individuality/figures/original_jae"
          mkdir -p "$dest"
          cp /tmp/jae-original-figure/results/centered_shape_individual_profiles_v1.csv "$dest/"
          cp /tmp/jae-original-figure/results/centered_shape_individual_profiles_v1.json "$dest/"
          cp /tmp/jae-original-figure/figures/submission_v0_3_7/figure6_individual_centered_shape_profiles.png "$dest/"
          if git diff --quiet -- "$dest" && test -z "$(git ls-files --others --exclude-standard "$dest")"; then
            echo "Source artifacts already present, no commit needed."
          else
            git add -- "$dest"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Restore original frozen JAE Figure 6 profile data and rendered PNG'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
