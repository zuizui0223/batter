name: Stratified survey expansion source gate
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/stratified-survey-expansion-gate-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75f6ada4d23009f492b119c0655f682efcd3232c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests openpyxl
      - run: python prospective/gedi_trait_macro_sdm/stratified_survey_expansion_gate_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stratified-survey-expansion-gate-v1
          path: stratified_survey_gate/report.json
          if-no-files-found: warn
