name: nyctalus-resource-context-attribution-v1
on:
  push:
    branches: [post-freeze/nyctalus-resource-context-attribution-v1]
    paths:
      - "post_freeze_extensions/nyctalus_resource_context/attribution_contract_v1.json"
      - "post_freeze_extensions/nyctalus_resource_context/run_attribution_v1.py"
      - ".github/workflows/nyctalus-resource-context-attribution-v1.yml"
  workflow_dispatch:
jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e . pandas numpy requests
      - name: Run frozen source-RSF resource-context attribution
        run: python post_freeze_extensions/nyctalus_resource_context/run_attribution_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-nyctalus-resource-context-attribution-v1
          path: |
            post_freeze_extensions/nyctalus_resource_context/attribution_result_v1.json
            post_freeze_extensions/nyctalus_resource_context/ATTRIBUTION_RESULT_V1.md
          if-no-files-found: error
