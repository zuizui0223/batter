name: rhino-pulse-semantics-v1

on:
  push:
    branches: [prospective/task-reset-lockin-v1]
    paths:
      - prospective/task_reset_lockin/rhino_pulse_semantics_v1.py
      - prospective/task_reset_lockin/RHINO_PULSE_SEMANTICS_OPENING_V1.md
      - .github/workflows/rhino-pulse-semantics-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy
      - name: Open pulse semantics only
        run: |
          python prospective/task_reset_lockin/rhino_pulse_semantics_v1.py | tee prospective/task_reset_lockin/RHINO_PULSE_SEMANTICS_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-pulse-semantics-v1
          path: prospective/task_reset_lockin/RHINO_PULSE_SEMANTICS_RESULT_V1.json
          if-no-files-found: error
