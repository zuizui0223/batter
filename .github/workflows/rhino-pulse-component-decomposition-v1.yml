name: rhino-pulse-component-decomposition-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/pulse_component_decomposition_v1.py
      - prospective/task_reset_lockin/PULSE_COMPONENT_DECOMPOSITION_CONTRACT_V1.md
      - .github/workflows/rhino-pulse-component-decomposition-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pulse-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run frozen pulse-component diagnostics
        run: |
          python prospective/task_reset_lockin/pulse_component_decomposition_v1.py | tee prospective/task_reset_lockin/PULSE_COMPONENT_DECOMPOSITION_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-pulse-component-decomposition-v1
          path: prospective/task_reset_lockin/PULSE_COMPONENT_DECOMPOSITION_RESULT_V1.json
          if-no-files-found: error
