name: partitioning-i-compatibility-v1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: python post_freeze_extensions/3d_niche_partition/run_partitioning_i_compatibility_v1.py
      - name: commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add post_freeze_extensions/3d_niche_partition/partitioning_calibration_results
          git diff --cached --quiet || git commit -m "Run partitioning I compatibility calibration"
          git push
