name: Airspace calibration schema V47
on:
  push:
    branches: [prospective/roost-3d-connectivity-fd-20261124]
    paths:
      - scripts/airspace_calibration_schema_v47.py
      - .github/workflows/airspace-calibration-schema-v47.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy==1.26.4 pandas==2.2.3 requests==2.32.3 openpyxl==3.1.5 py7zr==1.0.0
      - run: python scripts/airspace_calibration_schema_v47.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airspace-calibration-schema-v47
          path: roost_fd_audit/audit_v47_calibration_schema.json
          if-no-files-found: error
