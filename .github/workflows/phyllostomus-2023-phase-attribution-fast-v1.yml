name: phyllostomus-2023-phase-attribution-fast-v1
on:
  push:
    branches: [exploratory/phyllostomus-2023-phase-attribution-fast-v1]
    paths:
      - "post_freeze_extensions/phyllostomus_2023_phase_attribution_fast/**"
      - ".github/workflows/phyllostomus-2023-phase-attribution-fast-v1.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python post_freeze_extensions/phyllostomus_2023_phase_attribution_fast/run_fast_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-phyllostomus-2023-phase-attribution-fast-v1
          path: |
            post_freeze_extensions/phyllostomus_2023_phase_attribution_fast/result_v1.json
            post_freeze_extensions/phyllostomus_2023_phase_attribution_fast/RESULT_V1.md
          if-no-files-found: error
