name: GEDI macro native raster extraction
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/gedi_native_crop.py
      - .github/workflows/gedi-macro-native-crop.yml
permissions:
  contents: read
jobs:
  native-crop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authorized raster access libraries only with credentials
        run: |
          if [[ -n "$EARTHDATA_TOKEN" || ( -n "$EARTHDATA_USERNAME" && -n "$EARTHDATA_PASSWORD" ) ]]; then
            python -m pip install earthaccess 'rasterio>=1.4' numpy requests
          fi
      - name: Extract exact native raster grid or fail closed
        run: python prospective/gedi_trait_macro_sdm/gedi_native_crop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gedi-macro-native-crop
          path: gedi_native/
          if-no-files-found: error
