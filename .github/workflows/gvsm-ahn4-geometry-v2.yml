name: AHN4 shifted-grid structure validation V2
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/gvsm-ahn4-geometry-v2.yml
      - prospective/gedi_trait_macro_sdm/ahn4_structural_validation_v2.py
      - prospective/gedi_trait_macro_sdm/ahn_native_grid_overlap.py
permissions:
  contents: read
  actions: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas rasterio requests pyproj scipy scikit-learn
      - run: python prospective/gedi_trait_macro_sdm/ahn_native_grid_overlap.py
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-fixed-snapshot-environment
          run-id: 45591426116
          github-token: ${{ github.token }}
          path: fixed
      - uses: actions/cache/restore@v4
        id: raster_cache
        with:
          path: ahn_local/*.tif
          key: ahn4-15261042-verified-members-v2
          restore-keys: |
            ahn4-15261042-verified-members-v2-
      - run: python prospective/gedi_trait_macro_sdm/ahn4_structural_validation_v2.py
        timeout-minutes: 80
      - uses: actions/cache/save@v4
        if: always() && steps.raster_cache.outputs.cache-hit != 'true'
        with:
          path: ahn_local/*.tif
          key: ahn4-15261042-verified-members-v2-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gvsm-ahn4-geometry-v2
          path: |
            ahn_validation/report.json
            ahn_validation/*.json
            ahn_validation/*.csv.gz
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gvsm-ahn4-native-window-checkpoints-v2
          path: ahn_validation/native_window_checkpoints/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
