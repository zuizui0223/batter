name: early-experience-state-rewriting-secondary-v1

on:
  push:
    paths:
      - "prospective/early_experience_specialization/STATE_REWRITING_SECONDARY_V1.md"
      - "prospective/early_experience_specialization/run_state_rewriting_secondary_v1.py"
      - ".github/workflows/early-experience-state-rewriting-secondary-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  secondary:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/early-experience-specialization-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install readers
        run: python -m pip install numpy openpyxl
      - name: Run descriptive secondary
        run: python prospective/early_experience_specialization/run_state_rewriting_secondary_v1.py
      - name: Commit descriptive receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/early_experience_specialization/STATE_REWRITING_SECONDARY_RESULT_V1.json
          git add prospective/early_experience_specialization/STATE_REWRITING_SECONDARY_RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Record early-experience state-rewriting secondary"
            git fetch origin prospective/early-experience-specialization-v1
            git rebase origin/prospective/early-experience-specialization-v1
            git push origin HEAD:prospective/early-experience-specialization-v1
          fi
