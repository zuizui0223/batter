name: fine-place-same-night-fast-validation-v1
on:
  push:
    branches: [exploratory/fine-place-same-night-fast-v1]
    paths:
      - "post_freeze_extensions/fine_place_same_night_four_panel_fast/**"
      - ".github/workflows/fine-place-same-night-fast-validation-v1.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - name: Validate cached implementation against completed 2023 result
        run: python post_freeze_extensions/fine_place_same_night_four_panel_fast/run_fast_v1.py --panel phyllostomus_2023 --validate-2023
      - uses: actions/upload-artifact@v4
        with:
          name: same-night-fast-validation-2023-v1
          path: post_freeze_extensions/fine_place_same_night_four_panel_fast/panel_phyllostomus_2023_fast_v1.json
          if-no-files-found: error
