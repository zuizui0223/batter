name: Roost slope native NMEA V33
on:
  push:
    branches: [prospective/roost-3d-connectivity-fd-20261124]
    paths:
      - scripts/roost_slope_native_nmea_v33.py
      - .github/workflows/roost-slope-native-nmea-v33.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==1.26.4 scipy==1.13.1 requests==2.32.3 openpyxl==3.1.5 h5py==3.11.0
      - run: python scripts/roost_slope_native_nmea_v33.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roost-slope-native-nmea-v33
          path: roost_fd_audit/audit_v33_native_nmea.json
          if-no-files-found: error
