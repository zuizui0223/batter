name: phast-colony-transfer-preflight-v1
on:
  push:
    branches: [post-freeze/phast-colony-transfer-preflight-v1]
    paths:
      - "post_freeze_extensions/phast_colony_transfer_preflight/**"
      - ".github/workflows/phast-colony-transfer-preflight-v1.yml"
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python post_freeze_extensions/phast_colony_transfer_preflight/run_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: phast-colony-transfer-preflight-v1
          path: post_freeze_extensions/phast_colony_transfer_preflight/result_v1.json
          if-no-files-found: error
