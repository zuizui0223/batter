name: independent-call-sampled-two-axis-validation-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/independent_call_sampled_two_axis_validation_v1.py
      - prospective/task_reset_lockin/INDEPENDENT_CALL_SAMPLED_TWO_AXIS_VALIDATION_CONTRACT_V1.md
      - .github/workflows/independent-call-sampled-two-axis-validation-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run frozen independent validation
        run: |
          python prospective/task_reset_lockin/independent_call_sampled_two_axis_validation_v1.py | tee prospective/task_reset_lockin/INDEPENDENT_CALL_SAMPLED_TWO_AXIS_VALIDATION_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-call-sampled-two-axis-validation-v1
          path: prospective/task_reset_lockin/INDEPENDENT_CALL_SAMPLED_TWO_AXIS_VALIDATION_RESULT_V1.json
          if-no-files-found: warn
