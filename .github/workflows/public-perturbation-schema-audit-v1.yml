name: public-perturbation-schema-audit-v1

on:
  push:
    paths:
      - "prospective/public_perturbation_audit/PUBLIC_SCHEMA_OPENING_CONTRACT_V1.md"
      - "prospective/public_perturbation_audit/public_perturbation_schema_audit_v1.py"
      - ".github/workflows/public-perturbation-schema-audit-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/public-perturbation-audit-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install structural readers
        run: python -m pip install numpy scipy h5py openpyxl
      - name: Run schema-only audit
        run: python prospective/public_perturbation_audit/public_perturbation_schema_audit_v1.py
      - name: Commit schema receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/public_perturbation_audit/PUBLIC_SCHEMA_AUDIT_RESULT_V1.json
          git add prospective/public_perturbation_audit/PUBLIC_SCHEMA_AUDIT_RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No schema changes"
          else
            git commit -m "Record public perturbation schema audit"
            git push
          fi
