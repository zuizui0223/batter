name: Bayer original weather and QI metadata V18
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/bayer_weather_qi_v18.py
      - .github/workflows/bayer-weather-qi-v18.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy==2.4.6
      - run: python scripts/bayer_weather_qi_v18.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayer-weather-qi-v18
          path: results/bayer_weather_qi_v18.json
          if-no-files-found: error
          retention-days: 60
