name: rhino-mini-exact-n19-resampling-v1
on:
  push:
    branches: [post-freeze/rhino-mini-n19-resampling-v1]
    paths:
      - "prospective/task_reset_lockin/RHINO_MINI_EXACT_N19_RESAMPLING_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/rhino_mini_exact_n19_resampling_v1.py"
      - ".github/workflows/rhino-mini-exact-n19-resampling-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python prospective/task_reset_lockin/rhino_mini_exact_n19_resampling_v1.py > rhino_mini_exact_n19_resampling_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-mini-exact-n19-resampling-v1
          path: rhino_mini_exact_n19_resampling_result_v1.json
          if-no-files-found: error
