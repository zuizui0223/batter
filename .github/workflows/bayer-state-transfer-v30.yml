name: Bayer candidate flight state and HR transfer V30
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/bayer_state_transfer_v30.py
      - .github/workflows/bayer-state-transfer-v30.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy==2.4.6
      - run: python scripts/bayer_state_transfer_v30.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayer-state-transfer-v30
          path: results/bayer_state_transfer_v30.json
          if-no-files-found: error
          retention-days: 60
