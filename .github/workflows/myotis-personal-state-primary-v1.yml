name: myotis-personal-state-primary-v1

on:
  push:
    paths:
      - "prospective/myotis_masker_personal_state/MYOTIS_STRUCTURE_RESULT_V1.json"
      - "prospective/myotis_masker_personal_state/CONTROL1_ACOUSTIC_STATE_CONTRACT_V1.md"
      - "prospective/myotis_masker_personal_state/MAIN_FLIGHT_TIME_STATE_CONTRACT_V1.md"
      - "prospective/myotis_masker_personal_state/run_myotis_personal_state_v1.py"
      - ".github/workflows/myotis-personal-state-primary-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  primary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/myotis-masker-personal-state-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical dependency
        run: python -m pip install numpy
      - name: Run frozen Myotis primary
        run: python prospective/myotis_masker_personal_state/run_myotis_personal_state_v1.py
      - name: Commit primary result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f prospective/myotis_masker_personal_state/MYOTIS_PERSONAL_STATE_RESULT_V1.json ]; then
            echo "No primary result yet"
            exit 0
          fi
          git add prospective/myotis_masker_personal_state/MYOTIS_PERSONAL_STATE_RESULT_V1.json
          git add prospective/myotis_masker_personal_state/MYOTIS_PERSONAL_STATE_RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Record frozen Myotis personal-state primary"
            git push
          fi
