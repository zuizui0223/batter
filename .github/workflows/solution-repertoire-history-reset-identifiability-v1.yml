name: solution-repertoire-history-reset-identifiability-v1
on:
  workflow_dispatch:
  push:
    branches: [prospective/solution-repertoire-history-reset-v1]
    paths:
      - "prospective/solution_repertoire_experiment/history_reset_identifiability_stress_v1.py"
      - "prospective/solution_repertoire_experiment/HISTORY_RESET_IDENTIFIABILITY_AUDIT_V1.md"
      - ".github/workflows/solution-repertoire-history-reset-identifiability-v1.yml"
jobs:
  synthetic-design-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Compare P1 to original source and run exact-randomization synthetic audit
        run: python prospective/solution_repertoire_experiment/history_reset_identifiability_stress_v1.py
      - name: Publish synthetic (not empirical) outcomes
        uses: actions/upload-artifact@v4
        with:
          name: solution-repertoire-history-reset-synthetic-v1
          path: prospective/solution_repertoire_experiment/HISTORY_RESET_IDENTIFIABILITY_SIMULATION_V1.json
          if-no-files-found: error
