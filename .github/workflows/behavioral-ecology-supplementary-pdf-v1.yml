name: behavioral-ecology-supplementary-pdf-v1

on:
  push:
    branches:
      - prospective/public-causal-synthesis-v1
    paths:
      - "prospective/public_causal_synthesis/SUPPLEMENTARY_MATERIAL_DRAFT_V1.md"
      - "prospective/public_causal_synthesis/build_supplementary_pdf_v1.py"
      - "figures/public_causal_supplement/**"
      - ".github/workflows/behavioral-ecology-supplementary-pdf-v1.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/public-causal-synthesis-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF build dependencies
        run: |
          python -m pip install pymupdf markdown weasyprint
      - name: Build and internally verify supplementary PDF
        run: python prospective/public_causal_synthesis/build_supplementary_pdf_v1.py
      - name: Render every page for visual-review artifact
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          pdf=Path("submission/public_causal/SUPPLEMENTARY_MATERIAL_V1.pdf")
          out=Path("submission/public_causal/supplement_render_all")
          out.mkdir(parents=True,exist_ok=True)
          doc=fitz.open(pdf)
          for i,page in enumerate(doc):
              pix=page.get_pixmap(matrix=fitz.Matrix(1.25,1.25),alpha=False)
              pix.save(out/f"PAGE_{i+1:03d}.png")
          if len(list(out.glob("PAGE_*.png"))) != doc.page_count:
              raise SystemExit("STOP rendered-page count mismatch")
          print(f"PASS rendered all {doc.page_count} pages")
          PY
      - name: Check PDF metadata and extracted text
        run: |
          python - <<'PY'
          import fitz, re
          from pathlib import Path
          pdf=Path("submission/public_causal/SUPPLEMENTARY_MATERIAL_V1.pdf")
          doc=fitz.open(pdf)
          text="\n".join(p.get_text() for p in doc)
          required=[
              "Supplementary Table S1",
              "Supplementary Table S2",
              "Supplementary Material Figure S1",
              "Supplementary Material Figure S2",
              "Supplementary Material Figure S3",
              "primary formation FAIL",
              "2/4",
              "exploratory only",
          ]
          for token in required:
              if token.lower() not in text.lower():
                  raise SystemExit(f"STOP missing PDF token: {token}")
          print(f"PASS PDF text audit; pages={doc.page_count}; chars={len(text)}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: behavioral-ecology-supplementary-pdf-v1
          path: |
            submission/public_causal/SUPPLEMENTARY_MATERIAL_V1.pdf
            submission/public_causal/SUPPLEMENTARY_MATERIAL_V1_RECEIPT.json
            submission/public_causal/supplement_preview/
            submission/public_causal/supplement_render_all/
          if-no-files-found: error
