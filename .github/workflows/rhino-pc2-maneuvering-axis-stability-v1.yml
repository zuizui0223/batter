name: rhino-pc2-maneuvering-axis-stability-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/pc2_maneuvering_axis_stability_v1.py
      - prospective/task_reset_lockin/PC2_MANEUVERING_AXIS_STABILITY_CONTRACT_V1.md
      - .github/workflows/rhino-pc2-maneuvering-axis-stability-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run PC2 stability diagnostic
        run: |
          python prospective/task_reset_lockin/pc2_maneuvering_axis_stability_v1.py | tee prospective/task_reset_lockin/PC2_MANEUVERING_AXIS_STABILITY_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-pc2-maneuvering-axis-stability-v1
          path: prospective/task_reset_lockin/PC2_MANEUVERING_AXIS_STABILITY_RESULT_V1.json
          if-no-files-found: error
