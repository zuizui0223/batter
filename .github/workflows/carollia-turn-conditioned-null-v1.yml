name: carollia-turn-conditioned-null-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/carollia_turn_conditioned_null_v1.py
      - prospective/task_reset_lockin/CAROLLIA_TURN_CONDITIONED_NULL_CONTRACT_V1.md
      - .github/workflows/carollia-turn-conditioned-null-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conditioned-null:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet numpy h5py
      - name: Run frozen turn-conditioned null audit
        run: |
          python prospective/task_reset_lockin/carollia_turn_conditioned_null_v1.py | tee prospective/task_reset_lockin/CAROLLIA_TURN_CONDITIONED_NULL_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: carollia-turn-conditioned-null-v1
          path: prospective/task_reset_lockin/CAROLLIA_TURN_CONDITIONED_NULL_RESULT_V1.json
          if-no-files-found: error
