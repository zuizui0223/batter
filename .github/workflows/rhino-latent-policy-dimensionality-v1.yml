name: rhino-latent-policy-dimensionality-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/latent_policy_dimensionality_v1.py
      - prospective/task_reset_lockin/LATENT_POLICY_DIMENSIONALITY_CONTRACT_V1.md
      - .github/workflows/rhino-latent-policy-dimensionality-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run frozen latent dimensionality diagnostic
        run: |
          python prospective/task_reset_lockin/latent_policy_dimensionality_v1.py | tee prospective/task_reset_lockin/LATENT_POLICY_DIMENSIONALITY_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-latent-policy-dimensionality-v1
          path: prospective/task_reset_lockin/LATENT_POLICY_DIMENSIONALITY_RESULT_V1.json
          if-no-files-found: error
