name: Hurme acoustic source recovery V39
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/hurme_acoustic_source_v39.py
      - .github/workflows/hurme-acoustic-source-v39.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy
      - run: python scripts/hurme_acoustic_source_v39.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hurme-acoustic-source-v39
          path: results/hurme_acoustic_source_v39.json
          if-no-files-found: error
          retention-days: 60
