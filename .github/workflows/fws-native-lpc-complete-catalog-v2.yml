name: FWS bounded complete native LPC catalog V2
on:
  workflow_dispatch:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/fws-native-lpc-complete-catalog-v2.yml
permissions:
  contents: read
jobs:
  catalog_only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51b30f8fd78fb2adf4dfda321eda3dcb07bec006
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mdbtools
      - run: python -m pip install numpy pandas scipy requests rasterio pyproj 'shapely>=2' pyogrio
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/fws_native_lpc_complete_catalog_v2.py
      - run: python prospective/gedi_trait_macro_sdm/fws_native_lpc_complete_catalog_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fws-native-lpc-complete-catalog-v2
          path: fws_native_lpc_complete_catalog/report.json
          if-no-files-found: error
          retention-days: 90
