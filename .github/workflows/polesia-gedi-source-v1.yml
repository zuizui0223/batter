name: Polesia repeated survey measured GEDI source V1
on:
  workflow_dispatch:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/polesia-gedi-source-v1.yml
permissions:
  contents: read
jobs:
  measured:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'earthaccess>=0.14' 'rasterio>=1.4' requests numpy pandas
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/polesia_gedi_source_v1.py
      - run: python prospective/gedi_trait_macro_sdm/polesia_gedi_source_v1.py
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        timeout-minutes: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polesia-gedi-source-v1
          path: polesia_gedi/
          if-no-files-found: error
          retention-days: 90
