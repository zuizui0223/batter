name: BDFFP independent multidomain trait source gate
on:
  workflow_dispatch:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/bdffp-multidomain-trait-source-v1.yml
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 28e4b7e8fb6b9d47293cb7e89daa5a8f45f1ed5a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python prospective/gedi_trait_macro_sdm/bdffp_multidomain_trait_source_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdffp-multidomain-trait-source-v1
          path: bdffp_multidomain_source/
          if-no-files-found: error
          retention-days: 90
