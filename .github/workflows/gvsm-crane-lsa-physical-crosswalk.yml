name: Crane physical LSA wing crosswalk
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/crane_lsa_physical_crosswalk_v1.py
      - .github/workflows/gvsm-crane-lsa-physical-crosswalk.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: crane-global-wing-source-v1
          run-id: 45715573899
          github-token: ${{ github.token }}
          path: crane
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-independent-continental-census
          run-id: 45657223272
          github-token: ${{ github.token }}
          path: continental
      - uses: actions/download-artifact@v4
        with:
          name: gedi-macro-iberia-join
          run-id: 45575962660
          github-token: ${{ github.token }}
          path: traits
      - run: python -m pip install numpy pandas
      - run: python prospective/gedi_trait_macro_sdm/crane_lsa_physical_crosswalk_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crane-physical-lsa-crosswalk-v1
          path: crane_lsa_crosswalk/
          if-no-files-found: warn
