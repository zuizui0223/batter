name: theta-route-centroid-linkage-v1
on:
  push:
    branches: [post-freeze/theta-route-centroid-linkage-v1]
    paths:
      - "prospective/task_reset_lockin/THETA_ROUTE_CENTROID_LINKAGE_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/theta_route_centroid_linkage_v1.py"
      - ".github/workflows/theta-route-centroid-linkage-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python prospective/task_reset_lockin/theta_route_centroid_linkage_v1.py > theta_route_centroid_linkage_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: theta-route-centroid-linkage-v1
          path: theta_route_centroid_linkage_result_v1.json
          if-no-files-found: error
