name: GVSM continental cell environment support
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/europe_cell_environment_gate.py
      - .github/workflows/gvsm-europe-cell-environment.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: europe-own-database-support-v1
          run-id: 45579163494
          github-token: ${{ github.token }}
          path: europe
      - run: python -m pip install numpy rasterio pyproj requests
      - run: python prospective/gedi_trait_macro_sdm/europe_cell_environment_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gvsm-europe-cell-environment-support
          path: europe_cell_environment/
          if-no-files-found: error
