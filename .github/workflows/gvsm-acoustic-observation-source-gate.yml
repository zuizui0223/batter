name: Acoustic classifier and global trait source audit
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/acoustic_observation_source_gate_v1.py
      - .github/workflows/gvsm-acoustic-observation-source-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests openpyxl
      - run: python prospective/gedi_trait_macro_sdm/acoustic_observation_source_gate_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bat-acoustic-classifier-trait-sources
          path: acoustic_source/
          if-no-files-found: warn
