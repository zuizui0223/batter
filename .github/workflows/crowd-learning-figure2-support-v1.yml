name: crowd-learning-figure2-support-v1

on:
  push:
    paths:
      - "prospective/crowd_learning_personal_offset/FIGURE2_SUPPORT_AUDIT_CONTRACT_V1.md"
      - "prospective/crowd_learning_personal_offset/audit_figure2_support_v1.py"
      - ".github/workflows/crowd-learning-figure2-support-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crowd-learning-figure2-support-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/crowd-learning-personal-offset-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl
      - name: Run Figure-2 paired-call support audit
        run: python prospective/crowd_learning_personal_offset/audit_figure2_support_v1.py
      - name: Commit support receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/crowd_learning_personal_offset/FIGURE2_SUPPORT_RESULT_V1.json
          git add prospective/crowd_learning_personal_offset/FIGURE2_SUPPORT_RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No support changes"
          else
            git commit -m "Record crowd-learning Figure-2 support audit"
            git fetch origin prospective/crowd-learning-personal-offset-v1
            git rebase origin/prospective/crowd-learning-personal-offset-v1
            git push origin HEAD:prospective/crowd-learning-personal-offset-v1
          fi
