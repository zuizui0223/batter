name: Carollia ART conditional geometry V13
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/carollia_art_geometry_v13.py
      - .github/workflows/carollia-art-geometry-v13.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6 pandas scipy
      - run: python scripts/carollia_art_geometry_v13.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carollia-art-geometry-v13
          path: results/carollia_art_v13.json
          retention-days: 60
          if-no-files-found: warn
