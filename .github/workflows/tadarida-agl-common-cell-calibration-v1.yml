name: tadarida-agl-common-cell-calibration-v1

on:
  push:
    branches:
      - diagnostic/tadarida-residual-confounds-v1
    paths:
      - "contract/tadarida_residual_confounds_v1.json"
      - "TADARIDA_RESIDUAL_CONFOUNDS_CONTRACT.md"
      - "scripts/run_tadarida_agl_common_cell_calibration.py"
      - "src/batter/analysis.py"
      - ".github/workflows/tadarida-agl-common-cell-calibration-v1.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run frozen AGL common-cell calibration
        run: python scripts/run_tadarida_agl_common_cell_calibration.py
      - uses: actions/upload-artifact@v4
        with:
          name: tadarida-agl-common-cell-calibration-v1
          path: results/tadarida_agl_common_cell_calibration_v1.json
          if-no-files-found: error
