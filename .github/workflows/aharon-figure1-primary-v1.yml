name: aharon-figure1-primary-v1

on:
  push:
    paths:
      - "prospective/public_perturbation_audit/AHARON_FIGURE1_ZERO_GATE_V1.md"
      - "prospective/public_perturbation_audit/aharon_figure1_zero_gate_v1.py"
      - "prospective/public_perturbation_audit/AHARON_FIGURE1_PRIMARY_V1.md"
      - "prospective/public_perturbation_audit/run_aharon_figure1_primary_v1.py"
      - ".github/workflows/aharon-figure1-primary-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aharon-figure1-primary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  primary:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/public-perturbation-audit-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy
      - name: Run zero-sentinel gate
        run: python prospective/public_perturbation_audit/aharon_figure1_zero_gate_v1.py
      - name: Run frozen Figure-1 primary if gate passes
        run: python prospective/public_perturbation_audit/run_aharon_figure1_primary_v1.py
      - name: Commit receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/public_perturbation_audit/AHARON_FIGURE1_ZERO_GATE_V1.*
          git add prospective/public_perturbation_audit/AHARON_FIGURE1_PRIMARY_RESULT_V1.*
          git commit -m "Record Aharon Figure-1 frozen primary" || exit 0
          git fetch origin prospective/public-perturbation-audit-v1
          git rebase origin/prospective/public-perturbation-audit-v1
          git push origin HEAD:prospective/public-perturbation-audit-v1
