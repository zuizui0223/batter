name: public-causal-supplementary-figures-v1

on:
  push:
    branches:
      - prospective/public-causal-synthesis-v1
    paths:
      - "prospective/public_causal_synthesis/SUPPLEMENTARY_MATERIAL_DRAFT_V1.md"
      - "prospective/public_causal_synthesis/plot_supplementary_figures_v1.py"
      - ".github/workflows/public-causal-supplementary-figures-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-causal-supplementary-figures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/public-causal-synthesis-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install matplotlib numpy
      - name: Generate Supplementary Figures S1-S3
        run: python prospective/public_causal_synthesis/plot_supplementary_figures_v1.py
      - name: Commit supplementary figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/public_causal_supplement/
          if git diff --cached --quiet; then
            echo "No supplementary figure changes"
          else
            git commit -m "Generate public causal supplementary figures v1"
            git fetch origin prospective/public-causal-synthesis-v1
            git rebase origin/prospective/public-causal-synthesis-v1
            git push origin HEAD:prospective/public-causal-synthesis-v1
          fi
