name: phyllostomus-2016-dry-architecture-v1

on:
  push:
    branches:
      - study/individual-vertical-strategies-v1
    paths:
      - "scripts/run_phyllostomus_2016_dry_architecture.py"
      - "contract/phyllostomus_2016_dry_architecture_v1.json"
      - ".github/workflows/phyllostomus-2016-dry-architecture.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/run_phyllostomus_2016_dry_architecture.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-phyllostomus-2016-dry-architecture-v1
          path: results/phyllostomus_2016_dry_architecture_v1.json
