name: mechanism-input-preflight-v1

on:
  push:
    branches:
      - study/individual-vertical-strategies-v1
    paths:
      - "scripts/probe_mechanism_inputs.py"
      - "MECHANISM_PREFLIGHT.md"
      - ".github/workflows/mechanism-preflight.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_mechanism_inputs.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-mechanism-input-preflight-v1
          path: results/mechanism_input_preflight_v1.json
