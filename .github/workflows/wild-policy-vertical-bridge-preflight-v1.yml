name: wild-policy-vertical-bridge-preflight-v1

on:
  push:
    branches:
      - prospective/wild-policy-vertical-bridge-v1
    paths:
      - prospective/wild_policy_vertical_bridge/structural_preflight_v1.py
      - prospective/wild_policy_vertical_bridge/STRUCTURAL_PREFLIGHT_CONTRACT_V1.md
      - prospective/wild_policy_vertical_bridge/COHORT_STRATIFICATION_AMENDMENT_V1.md
      - .github/workflows/wild-policy-vertical-bridge-preflight-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet numpy pyproj
      - name: Guard vertical-outcome closure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("prospective/wild_policy_vertical_bridge/structural_preflight_v1.py").read_text()
          banned=["['h']", '["h"]', "vertical_edges", "Hellinger", "z_bin(", "median([r["h"]"]
          hits=[x for x in banned if x in p]
          if hits:
              raise SystemExit(f"vertical-outcome guard failed: {hits}")
          print("vertical-outcome guard PASS")
          PY
      - name: Run altitude-blind structural preflight
        run: |
          python prospective/wild_policy_vertical_bridge/structural_preflight_v1.py | tee prospective/wild_policy_vertical_bridge/STRUCTURAL_PREFLIGHT_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: wild-policy-vertical-bridge-preflight-v1
          path: prospective/wild_policy_vertical_bridge/STRUCTURAL_PREFLIGHT_RESULT_V1.json
          if-no-files-found: error
