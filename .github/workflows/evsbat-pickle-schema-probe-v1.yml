name: evsbat-pickle-schema-probe-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/evsbat_pickle_schema_probe_v1.py
      - prospective/task_reset_lockin/EVSBAT_PICKLE_SCHEMA_PROBE_AMENDMENT_V1.md
      - .github/workflows/evsbat-pickle-schema-probe-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard pickle execution
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("prospective/task_reset_lockin/evsbat_pickle_schema_probe_v1.py").read_text()
          banned=["pickle.load(","pickle.loads(","read_pickle","joblib.load","numpy.load","np.load"]
          hits=[x for x in banned if x in p]
          if hits:
              raise SystemExit(f"pickle execution guard failed: {hits}")
          print("pickle execution guard PASS")
          PY
      - name: Static schema probe
        run: |
          python prospective/task_reset_lockin/evsbat_pickle_schema_probe_v1.py | tee prospective/task_reset_lockin/EVSBAT_PICKLE_SCHEMA_PROBE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: evsbat-pickle-schema-probe-v1
          path: prospective/task_reset_lockin/EVSBAT_PICKLE_SCHEMA_PROBE_RESULT_V1.json
          if-no-files-found: error
