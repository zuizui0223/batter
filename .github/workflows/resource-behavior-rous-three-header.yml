name: Rousettus original tiny CSV headers and digests (no rows)

on:
  push:
    branches:
      - prospective/resource-behavior-higher-dimensional-sdm-v1-20261120
    paths:
      - 'prospective/resource_behavior_sdm/dryad_rous_original_header_gate.py'
      - 'prospective/resource_behavior_sdm/test_dryad_rous_original_header_gate.py'
      - '.github/workflows/resource-behavior-rous-three-header.yml'

permissions:
  contents: read

jobs:
  source-free-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s prospective/resource_behavior_sdm -p 'test_dryad_rous_original_header_gate.py' -v

  original-header-validation:
    needs: source-free-validation
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original Dryad source hash and header names only
        run: python prospective/resource_behavior_sdm/dryad_rous_original_header_gate.py --out prospective/resource_behavior_sdm/rous_original_header_receipt.json
      - name: Archive only source schema receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rous-original-3csv-header-only
          path: prospective/resource_behavior_sdm/rous_original_header_receipt.json
          if-no-files-found: error
          retention-days: 30
