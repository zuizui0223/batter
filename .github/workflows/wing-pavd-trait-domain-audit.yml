name: Wing PAVD frozen trait-domain audit
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/wing_pavd_trait_domain_audit_v1.py
      - .github/workflows/wing-pavd-trait-domain-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d5f1f612c6c084d4378f873ce7a2d0cc1badd6a
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: crane-physical-lsa-crosswalk-v1
          run-id: 45717291943
          github-token: ${{ github.token }}
          path: wing
      - uses: actions/download-artifact@v4
        with:
          name: wing-pavd-frozen-europe-transfer-model
          run-id: 45718786057
          github-token: ${{ github.token }}
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: physical-wing-matched-support-v1
          run-id: 45718398734
          github-token: ${{ github.token }}
          path: support
      - run: python -m pip install numpy pandas scipy
      - run: python prospective/gedi_trait_macro_sdm/wing_pavd_trait_domain_audit_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wing-pavd-frozen-trait-domain-v1
          path: wing_trait_domain/
          if-no-files-found: warn
          retention-days: 90
