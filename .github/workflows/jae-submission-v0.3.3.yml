name: jae-submission-v0.3.3

on:
  push:
    branches:
      - revision/jae-v0.3.3-full-draft
      - main
    paths:
      - "manuscript/**"
      - "figures/**"
      - "results/architecture_primary_v0_3.csv"
      - "results/architecture_pairwise_v0_3.csv"
      - "results/spatial_grain_v0_3.csv"
      - "results/individual_vertical_strategy_result_v1.json"
      - "results/spatial_interaction_refinement_result_v2.json"
      - "scripts/check_jae_submission.py"
      - "scripts/plot_jae_submission_figures.py"
      - ".github/workflows/jae-submission-v0.3.3.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  submission-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[figure]"
      - name: Check JAE manuscript format gates
        run: python scripts/check_jae_submission.py
      - name: Build reconciled submission figures
        run: python scripts/plot_jae_submission_figures.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-jae-v0-3-3-figures
          path: figures/submission_v0_3_2/
          if-no-files-found: error
