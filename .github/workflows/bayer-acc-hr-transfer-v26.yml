name: Bayer gap-aware activity and HR transfer V26
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/bayer_acc_hr_transfer_v26.py
      - .github/workflows/bayer-acc-hr-transfer-v26.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy==2.4.6
      - name: Verify synthetic boundaries and one real archive
        run: python scripts/bayer_acc_hr_transfer_v26.py --pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayer-acc-hr-v26-pilot
          path: results/bayer_acc_hr_v26_pilot.json
          retention-days: 60
          if-no-files-found: error
  cohort:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy==2.4.6
      - name: Process all 12 verified public source archives on ephemeral runner
        run: python scripts/bayer_acc_hr_transfer_v26.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayer-acc-hr-v26-cohort
          path: results/bayer_acc_hr_v26.json
          retention-days: 60
          if-no-files-found: error
