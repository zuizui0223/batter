name: kinematic-state-preflight-v1

on:
  push:
    branches:
      - exploratory/kinematic-state-conditioning-v1
    paths:
      - "post_freeze_extensions/kinematic_state_conditioning/**"
      - ".github/workflows/kinematic-state-preflight-v1.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run x-y-time kinematic-state feasibility preflight
        run: python post_freeze_extensions/kinematic_state_conditioning/preflight_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-kinematic-state-preflight-v1
          path: |
            post_freeze_extensions/kinematic_state_conditioning/preflight_result_v1.json
            post_freeze_extensions/kinematic_state_conditioning/PREFLIGHT_RESULT_V1.md
          if-no-files-found: error
