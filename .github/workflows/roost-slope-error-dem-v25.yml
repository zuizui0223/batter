name: Roost slope error DEM V25
on:
  push:
    branches: [prospective/roost-3d-connectivity-fd-20261124]
    paths:
      - scripts/roost_slope_error_dem_v25.py
      - .github/workflows/roost-slope-error-dem-v25.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==1.26.4 requests==2.32.3 openpyxl==3.1.5 pyproj==3.7.0 rasterio==1.4.3 && pip install -e .
      - run: python scripts/roost_slope_error_dem_v25.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roost-slope-error-dem-v25
          path: roost_fd_audit/audit_v25_slope.json
          if-no-files-found: error
