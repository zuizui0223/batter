name: learning-state-maintenance-primary-v1

on:
  push:
    branches:
      - prospective/learning-policy-state-v1
    paths:
      - prospective/learning_policy_state/learning_state_maintenance_primary_v1.py
      - prospective/learning_policy_state/LEARNING_STATE_MAINTENANCE_PRIMARY_CONTRACT_V1.md
      - .github/workflows/learning-state-maintenance-primary-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run frozen learning-state primary
        run: |
          python prospective/learning_policy_state/learning_state_maintenance_primary_v1.py | tee prospective/learning_policy_state/LEARNING_STATE_MAINTENANCE_PRIMARY_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: learning-state-maintenance-primary-v1
          path: prospective/learning_policy_state/LEARNING_STATE_MAINTENANCE_PRIMARY_RESULT_V1.json
          if-no-files-found: error
