name: GVSM independent continental source census
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/in_domain_continental_census_v1.py
      - .github/workflows/gvsm-in-domain-continental-census.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-gbif-fixed-snapshot
          run-id: 45591123869
          github-token: ${{ github.token }}
          path: fixed
      - run: python -m pip install duckdb requests pyproj openpyxl python-docx pymupdf
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/in_domain_continental_census_v1.py
      - run: python prospective/gedi_trait_macro_sdm/in_domain_continental_census_v1.py
        timeout-minutes: 16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gvsm-independent-continental-census
          path: |
            continental_extension/*.json
            continental_extension/*.csv.gz
            continental_extension/publisher_supplement_*
          if-no-files-found: warn
