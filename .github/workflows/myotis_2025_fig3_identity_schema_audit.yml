name: Myotis 2025 original Figure 3 identity metadata gate
on:
  push:
    branches:
      - prospective/myotis-prey-escape-2025-source-gate-v1
    paths:
      - "prospective/reaction_norm_gate/audit_myotis_fig3_identifiers_v1.py"
      - ".github/workflows/myotis_2025_fig3_identity_schema_audit.yml"
  pull_request:
    paths:
      - "prospective/reaction_norm_gate/audit_myotis_fig3_identifiers_v1.py"
      - ".github/workflows/myotis_2025_fig3_identity_schema_audit.yml"
permissions:
  contents: read
jobs:
  original-fig3-identity-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HDF5 metadata reader
        run: python -m pip install "h5py>=3.10,<4"
      - name: Inspect pinned original HDF only on verified SHA
        run: python prospective/reaction_norm_gate/audit_myotis_fig3_identifiers_v1.py
      - name: Preserve structural receipt even on source failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myotis-2025-fig3-identity-schema
          path: prospective/reaction_norm_gate/MYOTIS_FIG3_ORIGINAL_ID_SCHEMA_RECEIPT_V1.json
          if-no-files-found: warn
