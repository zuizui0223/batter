name: task-reset-filename-architecture-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/filename_architecture_v1.py
      - .github/workflows/task-reset-filename-architecture-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run filename-only architecture audit
        run: |
          python prospective/task_reset_lockin/filename_architecture_v1.py | tee prospective/task_reset_lockin/FILENAME_ARCHITECTURE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: task-reset-filename-architecture-v1
          path: prospective/task_reset_lockin/FILENAME_ARCHITECTURE_RESULT_V1.json
          if-no-files-found: error
