name: jae-submission-v0.3.4

on:
  push:
    branches:
      - revision/jae-v0.3.4-horizontal-standardized
      - main
    paths:
      - "manuscript/MANUSCRIPT_DRAFT_V0_3_4.md"
      - "manuscript/**"
      - "results/calibrated_vertical_identity_v0_3_4.csv"
      - "results/tadarida_focal_robustness_v0_3_4.csv"
      - "results/individual_vertical_strategy_result_v1.json"
      - "results/spatial_interaction_refinement_result_v2.json"
      - "scripts/check_jae_submission.py"
      - "scripts/plot_jae_v0_3_4_figures.py"
      - ".github/workflows/jae-submission-v0.3.4.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  submission-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[figure]"
      - name: Check JAE manuscript format gates
        run: python scripts/check_jae_submission.py
      - name: Build calibrated submission figures
        run: python scripts/plot_jae_v0_3_4_figures.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-jae-v0-3-4-figures
          path: figures/submission_v0_3_4/
          if-no-files-found: error
