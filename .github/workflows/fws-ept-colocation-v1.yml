name: FWS landscape point cloud colocation gate V1
on:
  workflow_dispatch:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/fws-ept-colocation-v1.yml
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mdbtools
      - run: python -m pip install numpy pandas scipy requests rasterio pyproj 'shapely>=2'
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/fws_ept_colocation_v1.py
      - run: python prospective/gedi_trait_macro_sdm/fws_ept_colocation_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fws-ept-colocation-v1
          path: fws_ept_colocation/
          if-no-files-found: error
          retention-days: 90
