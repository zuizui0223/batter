name: leptonycteris-workbook-schema-audit-v1
on:
  push:
    branches: [prospective/leptonycteris-structural-gate-v1]
    paths:
      - "post_freeze_extensions/leptonycteris_external_validation/workbook_schema_audit_v1.py"
      - ".github/workflows/leptonycteris-workbook-schema-audit-v1.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    env:
      DRYAD_API_TOKEN: ${{ secrets.DRYAD_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install requests openpyxl
      - name: Run string-only workbook schema audit
        run: python post_freeze_extensions/leptonycteris_external_validation/workbook_schema_audit_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-leptonycteris-workbook-schema-audit-v1
          path: |
            post_freeze_extensions/leptonycteris_external_validation/workbook_schema_audit_v1.json
            post_freeze_extensions/leptonycteris_external_validation/WORKBOOK_SCHEMA_AUDIT_V1.md
          if-no-files-found: error
