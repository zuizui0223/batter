name: aharon-figure1-gated-audit-v2

on:
  push:
    paths:
      - "prospective/public_perturbation_audit/AHARON_FIGURE1_STRUCTURAL_AUDIT_V2.md"
      - "prospective/public_perturbation_audit/aharon_figure1_structure_v2.py"
      - "prospective/public_perturbation_audit/AHARON_FIGURE1_FINITE_MASK_CONTRACT_V2.md"
      - "prospective/public_perturbation_audit/aharon_figure1_finite_mask_v2.py"
      - ".github/workflows/aharon-figure1-gated-audit-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aharon-figure1-gated-audit-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/public-perturbation-audit-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy scipy
      - name: Structure only
        run: python prospective/public_perturbation_audit/aharon_figure1_structure_v2.py
      - name: Finite-mask only
        run: python prospective/public_perturbation_audit/aharon_figure1_finite_mask_v2.py
      - name: Commit receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/public_perturbation_audit/AHARON_FIGURE1_STRUCTURE_V2.*
          git add prospective/public_perturbation_audit/AHARON_FIGURE1_FINITE_MASK_V2.*
          git commit -m "Record Aharon Figure-1 gated structural audits" || exit 0
          git pull --rebase origin prospective/public-perturbation-audit-v1
          git push origin HEAD:prospective/public-perturbation-audit-v1
