name: nyctalus-independent-validation-v1
on:
  push:
    branches: [prospective/nyctalus-independent-validation-v1]
    paths:
      - "post_freeze_extensions/nyctalus_external_validation/validation_contract_v1.json"
      - "post_freeze_extensions/nyctalus_external_validation/run_validation_v1.py"
      - ".github/workflows/nyctalus-independent-validation-v1.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix:
        test: [primary, state]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e . pandas requests
      - name: Run frozen prospective Nyctalus validation
        run: python post_freeze_extensions/nyctalus_external_validation/run_validation_v1.py --test "${{ matrix.test }}"
      - uses: actions/upload-artifact@v4
        with:
          name: nyctalus-validation-${{ matrix.test }}-v1
          path: post_freeze_extensions/nyctalus_external_validation/test_results/${{ matrix.test }}_v1.json
          if-no-files-found: error
  aggregate:
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e . pandas requests
      - uses: actions/download-artifact@v4
        with:
          pattern: nyctalus-validation-*-v1
          path: post_freeze_extensions/nyctalus_external_validation/test_results
          merge-multiple: true
      - name: Aggregate prospective external validation
        run: python post_freeze_extensions/nyctalus_external_validation/run_validation_v1.py --aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: batter-nyctalus-independent-validation-v1
          path: |
            post_freeze_extensions/nyctalus_external_validation/result_v1.json
            post_freeze_extensions/nyctalus_external_validation/RESULT_V1.md
          if-no-files-found: error
