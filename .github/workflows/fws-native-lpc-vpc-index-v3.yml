name: FWS official VPC tile index coverage V3
on:
  workflow_dispatch:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/fws-native-lpc-vpc-index-v3.yml
permissions:
  contents: read
jobs:
  public_index:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 81280ce91004b81f61622e586e3d9e5e39007176
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mdbtools
      - run: python -m pip install numpy pandas scipy requests rasterio pyproj 'shapely>=2' pyogrio
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/fws_native_lpc_vpc_index_v3.py
      - run: python prospective/gedi_trait_macro_sdm/fws_native_lpc_vpc_index_v3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fws-native-lpc-vpc-index-v3
          path: fws_native_lpc_vpc_index/
          if-no-files-found: error
          retention-days: 90
