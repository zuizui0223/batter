name: public-perturbation-source-audit-v1

on:
  push:
    paths:
      - "prospective/public_perturbation_audit/AHARON_2017_STRUCTURE_AUDIT_CONTRACT_V1.md"
      - "prospective/public_perturbation_audit/MA_2025_STRUCTURE_AUDIT_CONTRACT_V1.md"
      - "prospective/public_perturbation_audit/public_perturbation_source_audit_v1.py"
      - ".github/workflows/public-perturbation-source-audit-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/public-perturbation-audit-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run metadata/file inventory
        run: python prospective/public_perturbation_audit/public_perturbation_source_audit_v1.py
      - name: Commit audit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/public_perturbation_audit/PUBLIC_SOURCE_AUDIT_RESULT_V1.json
          git add prospective/public_perturbation_audit/PUBLIC_SOURCE_AUDIT_RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "Record public perturbation source audit"
            git push
          fi
