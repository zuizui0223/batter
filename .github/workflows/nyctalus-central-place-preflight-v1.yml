name: nyctalus-central-place-preflight-v1
on:
  push:
    branches: [post-freeze/nyctalus-central-place-preflight-v1]
    paths:
      - "post_freeze_extensions/nyctalus_central_place/structural_contract_v1.json"
      - "post_freeze_extensions/nyctalus_central_place/structural_preflight_v1.py"
      - ".github/workflows/nyctalus-central-place-preflight-v1.yml"
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pandas requests
      - name: Run central-place support preflight without Height
        run: python post_freeze_extensions/nyctalus_central_place/structural_preflight_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-nyctalus-central-place-preflight-v1
          path: |
            post_freeze_extensions/nyctalus_central_place/structural_result_v1.json
            post_freeze_extensions/nyctalus_central_place/STRUCTURAL_RESULT_V1.md
          if-no-files-found: error
