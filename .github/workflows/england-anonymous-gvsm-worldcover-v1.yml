name: England anonymous GVSM WorldCover grid support V1
on:
  workflow_dispatch:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/england-anonymous-gvsm-worldcover-v1.yml
permissions:
  contents: read
  actions: read
jobs:
  public_structure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e26fa3c77de735339c009731523d508e979a5321
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: independent-community-england-v1
          run-id: 45867952345
          github-token: ${{ github.token }}
          path: nwbs
      - run: python -m pip install numpy pandas requests rasterio pyproj shapely
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/england_anonymous_gvsm_worldcover_v1.py
      - run: python prospective/gedi_trait_macro_sdm/england_anonymous_gvsm_worldcover_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: england-anonymous-structure-v1
          path: england_anonymous_structure/
          if-no-files-found: error
          retention-days: 90
