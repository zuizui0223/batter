name: learning-condition-exact-maintenance-v1

on:
  push:
    branches:
      - prospective/learning-policy-state-v1
    paths:
      - prospective/learning_policy_state/condition_specific_exact_maintenance_v1.py
      - prospective/learning_policy_state/CONDITION_SPECIFIC_EXACT_MAINTENANCE_CONTRACT_V1.md
      - .github/workflows/learning-condition-exact-maintenance-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run exact condition robustness
        run: |
          python prospective/learning_policy_state/condition_specific_exact_maintenance_v1.py | tee prospective/learning_policy_state/CONDITION_SPECIFIC_EXACT_MAINTENANCE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: learning-condition-exact-maintenance-v1
          path: prospective/learning_policy_state/CONDITION_SPECIFIC_EXACT_MAINTENANCE_RESULT_V1.json
          if-no-files-found: error
