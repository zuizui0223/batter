name: source-b-all-individual-daycount-v1

on:
  push:
    branches:
      - prospective/ontogenetic-path-dependence-v1
    paths:
      - prospective/ontogenetic_path_dependence/source_b_all_individual_daycount_v1.py
      - prospective/ontogenetic_path_dependence/SOURCE_B_ALL_INDIVIDUAL_DAYCOUNT_AMENDMENT_V1.md
      - .github/workflows/source-b-all-individual-daycount-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daycount:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MAT header reader
        run: python -m pip install --disable-pip-version-check scipy
      - name: Guard value opening
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("prospective/ontogenetic_path_dependence/source_b_all_individual_daycount_v1.py").read_text()
          banned=["loadmat(", ".track.", "longitude", "latitude", "route_similarity", "translocation"]
          hits=[x for x in banned if x in p.lower()]
          if hits:
              raise SystemExit(f"value-opening guard failed: {hits}")
          if "whosmat" not in p:
              raise SystemExit("whosmat missing")
          print("top-level metadata-only guard PASS")
          PY
      - name: Run frozen all-individual day-count audit
        run: |
          python prospective/ontogenetic_path_dependence/source_b_all_individual_daycount_v1.py | tee prospective/ontogenetic_path_dependence/SOURCE_B_ALL_INDIVIDUAL_DAYCOUNT_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-b-all-individual-daycount-v1
          path: prospective/ontogenetic_path_dependence/SOURCE_B_ALL_INDIVIDUAL_DAYCOUNT_RESULT_V1.json
          if-no-files-found: error
