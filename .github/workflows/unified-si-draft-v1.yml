name: Unified SI internal draft PDF

on:
  pull_request:
    paths:
      - 'prospective/unified_individuality/SUPPORTING_INFORMATION_DRAFT_V1.md'
      - 'prospective/unified_individuality/build_supporting_pdf_v1.py'
      - '.github/workflows/unified-si-draft-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-internal-si:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF packages
        run: python -m pip install --quiet reportlab==4.4.9 pypdf==6.1.1
      - name: Build single internal SI proof PDF
        run: python prospective/unified_individuality/build_supporting_pdf_v1.py
      - name: Validate internal SI PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          p=Path('prospective/unified_individuality/build/SUPPLEMENTARY_MATERIAL_INTERNAL_DRAFT_V1.pdf')
          pdf=PdfReader(str(p))
          assert 1 <= len(pdf.pages)<100
          text="\n".join(x.extract_text() or "" for x in pdf.pages)
          for marker in ["Supplementary Table U6","Supplementary Methods U2","INTERNAL SUPPORTING INFORMATION DRAFT"]:
              assert marker in text,marker
          print("PASS",len(pdf.pages),"SI pages",p.stat().st_size,"bytes")
          PY
      - name: Upload single PDF internal proof
        uses: actions/upload-artifact@v4
        with:
          name: unified-si-internal-draft-pdf-v1
          path: prospective/unified_individuality/build/SUPPLEMENTARY_MATERIAL_INTERNAL_DRAFT_V1.pdf
          if-no-files-found: error
          retention-days: 30
