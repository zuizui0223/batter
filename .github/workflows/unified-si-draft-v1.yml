name: Unified SI internal draft PDF

on:
  pull_request:
    paths:
      - 'prospective/unified_individuality/SUPPORTING_INFORMATION_DRAFT_V1.md'
      - 'prospective/unified_individuality/build_supporting_pdf_v1.py'
      - 'prospective/unified_individuality/SUPPORTING_INFORMATION_ANONYMOUS_DRAFT_V1.md'
      - 'prospective/unified_individuality/build_anonymous_si_v1.cjs'
      - 'prospective/unified_individuality/figures/FIGURE_S1_WITHIN_COHORT_VERTICAL_SHAPE_OVERLAP_V1.svg'
      - 'prospective/unified_individuality/validate_source_attribution_v2.py'
      - 'prospective/unified_individuality/validate_ecological_identifiability_v1.py'
      - 'prospective/unified_individuality/validate_cohort_weight_sensitivity_v1.py'
      - 'prospective/unified_individuality/figures/COHORT_WEIGHT_SENSITIVITY_V1.json'
      - 'prospective/unified_individuality/figures/FROZEN_MAINTENANCE_BOUNDARY_INPUTS_V1.json'
      - 'prospective/unified_individuality/INTEGRATED_MANUSCRIPT_V1.md'
      - 'prospective/unified_individuality/COMPLETE_ANONYMOUS_TEXT_DRAFT_V1.md'
      - '.github/workflows/unified-si-draft-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-internal-si:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned vector-PDF render dependencies (no optional Cairo raster backend)
        run: |
          python -m pip install --quiet reportlab==4.4.9 pypdf==6.1.1 lxml==6.0.2 cssselect2==0.8.0 tinycss2==1.4.0
          python -m pip install --quiet --no-deps svglib==1.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild anonymized SI source
        run: node prospective/unified_individuality/build_anonymous_si_v1.cjs
      - name: Ensure anonymous SI source matches the recorded source
        run: git diff --exit-code -- prospective/unified_individuality/SUPPORTING_INFORMATION_ANONYMOUS_DRAFT_V1.md
      - name: Validate exact wild study-year DOI mapping and verified 2026 citations
        run: python3 prospective/unified_individuality/validate_source_attribution_v2.py
      - name: Audit source-bounded ecological mechanism and mathematical counterexample
        run: python3 prospective/unified_individuality/validate_ecological_identifiability_v1.py
      - name: Validate cohort-sensitive, dependent-dyad shape overlap from original CSV
        run: python3 prospective/unified_individuality/validate_cohort_weight_sensitivity_v1.py
      - name: Build one internal and one anonymous SI proof PDF
        run: |
          python prospective/unified_individuality/build_supporting_pdf_v1.py
          python prospective/unified_individuality/build_supporting_pdf_v1.py --anonymous
      - name: Validate internal SI PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          d=Path('prospective/unified_individuality/build')
          for name,markers in [
              ('SUPPLEMENTARY_MATERIAL_INTERNAL_DRAFT_V1.pdf',['Supplementary Table U6','Supplementary Table U8','Supplementary Table U9','Supplementary Methods U13','Supplementary Methods U14','Supplementary Figure S1','INTERNAL SUPPORTING INFORMATION DRAFT']),
              ('SUPPLEMENTARY_MATERIAL_ANONYMOUS_DRAFT_V1.pdf',['Supplementary Table S6','Supplementary Table S8','Supplementary Table S9','Supplementary Methods S13','Supplementary Methods S14','Supplementary Figure S1','ANONYMOUS SI DRAFT'])
          ]:
              p=d/name
              pdf=PdfReader(str(p))
              assert 1 <= len(pdf.pages)<100
              text='\n'.join(x.extract_text() or '' for x in pdf.pages)
              for marker in markers: assert marker in text,marker
              if 'ANONYMOUS' in name:
                  for forbidden in ['zuizui0223','release/jae','prospective/public-causal-synthesis']:
                      assert forbidden not in text,forbidden
              print('PASS',name,len(pdf.pages),'pages',p.stat().st_size,'bytes')
          PY
      - name: Upload single PDF internal proof
        uses: actions/upload-artifact@v4
        with:
          name: unified-si-internal-draft-pdf-v1
          path: prospective/unified_individuality/build/SUPPLEMENTARY_MATERIAL_INTERNAL_DRAFT_V1.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Upload separately anonymized SI draft PDF
        uses: actions/upload-artifact@v4
        with:
          name: unified-si-anonymous-draft-pdf-v1
          path: prospective/unified_individuality/build/SUPPLEMENTARY_MATERIAL_ANONYMOUS_DRAFT_V1.pdf
          if-no-files-found: error
          retention-days: 30
