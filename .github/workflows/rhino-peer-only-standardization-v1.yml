name: rhino-peer-only-standardization-v1
on:
  push:
    branches: [diagnostic/rhino-peer-only-standardization-v1]
    paths:
      - "prospective/task_reset_lockin/rhino_peer_only_standardization_v1.py"
      - "prospective/task_reset_lockin/RHINO_PEER_ONLY_STANDARDIZATION_CONTRACT_V1.md"
      - ".github/workflows/rhino-peer-only-standardization-v1.yml"
  workflow_dispatch:
jobs:
  peer-reference-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen project dependencies
        run: python -m pip install -e .
      - name: Run peer-exclusion and source reproduction gates
        run: |
          python prospective/task_reset_lockin/rhino_peer_only_standardization_v1.py --out rhino_peer_only_standardization_result_v1.json
      - name: Upload immutable diagnostic result
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rhino-peer-only-standardization-v1
          path: rhino_peer_only_standardization_result_v1.json
          if-no-files-found: error
