name: yamada-learning-state-schema-v1

on:
  push:
    branches:
      - prospective/learning-state-theta-v1
    paths:
      - prospective/learning_state_theta/schema_open_v1.py
      - prospective/learning_state_theta/SCHEMA_OPENING_CONTRACT_V1.md
      - .github/workflows/yamada-learning-state-schema-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard row-value closure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("prospective/learning_state_theta/schema_open_v1.py").read_text()
          banned=["openpyxl","pandas","read_excel","iter_rows","data_only=True"]
          hits=[x for x in banned if x in p]
          if hits:
              raise SystemExit(f"row-value guard failed: {hits}")
          print("row-value guard PASS")
          PY
      - name: Open workbook headers only
        run: |
          python prospective/learning_state_theta/schema_open_v1.py | tee prospective/learning_state_theta/SCHEMA_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: yamada-learning-state-schema-v1
          path: prospective/learning_state_theta/SCHEMA_RESULT_V1.json
          if-no-files-found: error
