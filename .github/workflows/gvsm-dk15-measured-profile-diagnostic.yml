name: GVSM Danish measured profile diagnosis
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/dk15_measured_profile_diagnostic_v1.py
      - .github/workflows/gvsm-dk15-measured-profile-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-fixed-snapshot-environment
          run-id: 45591426116
          github-token: ${{ github.token }}
          path: fixed_environment
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-fixed-snapshot-observation-audit
          run-id: 45593509220
          github-token: ${{ github.token }}
          path: observation
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-fixed-snapshot-holdout-support
          run-id: 45594276934
          github-token: ${{ github.token }}
          path: holdout
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-ecodes-dk15-structure
          run-id: 45622231502
          github-token: ${{ github.token }}
          path: ecodes
      - run: python -m pip install numpy pandas scipy
      - run: python prospective/gedi_trait_macro_sdm/dk15_measured_profile_diagnostic_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gvsm-dk15-measured-profile-diagnostic
          path: dk15_profile_diagnostic/
          if-no-files-found: warn
