name: Existing forest species label sorting pilot
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/observed_label_sorting_v1.py
      - .github/workflows/gedi-macro-observed-label-sorting.yml
permissions:
  contents: read
  actions: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: europe-common-forest-support-v1
          run-id: 45585033345
          github-token: ${{ github.token }}
          path: common_forest
      - run: python -m pip install numpy pandas scipy
      - run: python prospective/gedi_trait_macro_sdm/observed_label_sorting_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observed-label-sorting-pilot-v1
          path: observed_label_sorting/
          if-no-files-found: error
          retention-days: 90
