name: rhino-combined-policy-dimension-v1
on:
  push:
    branches: [post-freeze/rhino-combined-policy-dimension-v1]
    paths:
      - "prospective/task_reset_lockin/RHINO_COMBINED_POLICY_DIMENSION_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/rhino_combined_policy_dimension_v1.py"
      - ".github/workflows/rhino-combined-policy-dimension-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet numpy
      - run: python prospective/task_reset_lockin/rhino_combined_policy_dimension_v1.py > rhino_combined_policy_dimension_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-combined-policy-dimension-v1
          path: rhino_combined_policy_dimension_result_v1.json
          if-no-files-found: error
