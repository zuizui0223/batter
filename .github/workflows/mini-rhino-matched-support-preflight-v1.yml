name: mini-rhino-matched-support-preflight-v1
on:
  push:
    branches: [post-freeze/mini-rhino-matched-support-preflight-v1]
    paths:
      - "prospective/task_reset_lockin/MINI_RHINO_MATCHED_SUPPORT_PREFLIGHT_V1.md"
      - "prospective/task_reset_lockin/mini_rhino_matched_support_preflight_v1.py"
      - ".github/workflows/mini-rhino-matched-support-preflight-v1.yml"
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python prospective/task_reset_lockin/mini_rhino_matched_support_preflight_v1.py > mini_rhino_matched_support_preflight_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-rhino-matched-support-preflight-v1
          path: mini_rhino_matched_support_preflight_result_v1.json
          if-no-files-found: error
