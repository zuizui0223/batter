name: individual-peer-context-reaction-norm-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/individual_peer_context_reaction_norm_v1.py
      - prospective/field_policy_bridge/INDIVIDUAL_PEER_CONTEXT_REACTION_NORM_CONTRACT_V1.md
      - .github/workflows/individual-peer-context-reaction-norm-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reaction-norm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dependencies
        run: |
          python -m pip install --quiet -e .
          python -m pip install --quiet numpy pandas scipy pyproj
      - name: Run frozen individual peer-context reaction-norm test
        shell: bash
        run: |
          set -euo pipefail
          python prospective/field_policy_bridge/individual_peer_context_reaction_norm_v1.py | tee prospective/field_policy_bridge/INDIVIDUAL_PEER_CONTEXT_REACTION_NORM_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: individual-peer-context-reaction-norm-v1
          path: prospective/field_policy_bridge/INDIVIDUAL_PEER_CONTEXT_REACTION_NORM_RESULT_V1.json
          if-no-files-found: warn
