name: theta-peer-environment-gain-v1
on:
  push:
    branches: [post-freeze/theta-peer-environment-gain-v1]
    paths:
      - "prospective/task_reset_lockin/THETA_PEER_ENVIRONMENT_GAIN_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/theta_peer_environment_gain_v1.py"
      - ".github/workflows/theta-peer-environment-gain-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python prospective/task_reset_lockin/theta_peer_environment_gain_v1.py --out theta_peer_environment_gain_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: theta-peer-environment-gain-v1
          path: theta_peer_environment_gain_result_v1.json
          if-no-files-found: error
