name: Unified anonymous complete text review PDF

on:
  pull_request:
    paths:
      - 'prospective/unified_individuality/INTEGRATED_MANUSCRIPT_V1.md'
      - 'prospective/unified_individuality/COMPLETE_ANONYMOUS_TEXT_DRAFT_V1.md'
      - 'prospective/unified_individuality/build_complete_anonymous_text_v1.cjs'
      - 'prospective/unified_individuality/build_anonymous_main_pdf_v1.py'
      - '.github/workflows/unified-anonymous-main-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-anonymous-text:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate anonymous complete text
        run: |
          node prospective/unified_individuality/build_complete_anonymous_text_v1.cjs
          git diff --exit-code -- prospective/unified_individuality/COMPLETE_ANONYMOUS_TEXT_DRAFT_V1.md
      - name: Install PDF proof dependencies
        run: python -m pip install --quiet reportlab==4.4.9 pypdf==6.1.1
      - name: Build line-numbered double-spaced review proof
        run: python prospective/unified_individuality/build_anonymous_main_pdf_v1.py
      - name: Audit page sequence and anonymous source
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          pdf=Path('prospective/unified_individuality/build/COMPLETE_ANONYMOUS_TEXT_REVIEW_PROOF_V1.pdf')
          pages=PdfReader(str(pdf)).pages
          assert 4<len(pages)<80,len(pages)
          text='\n'.join(x.extract_text() or '' for x in pages)
          for key in ['Lay Summary','Abstract','Introduction','Results','Discussion','Figure legends','Page 1']:
              assert key in text,key
          for bad in ['zuizui0223','release/jae','prospective/public-causal-synthesis']:
              assert bad not in text,bad
          print('PASS',len(pages),'page anonymous review PDF, bytes=',pdf.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: unified-anonymous-main-review-pdf-v1
          path: prospective/unified_individuality/build/COMPLETE_ANONYMOUS_TEXT_REVIEW_PROOF_V1.pdf
          if-no-files-found: error
          retention-days: 30
