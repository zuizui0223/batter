name: Acoustic archived trajectory mark V37
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/acoustic_buzz_mark_v37.py
      - .github/workflows/acoustic-buzz-mark-v37.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy scipy
      - run: python scripts/acoustic_buzz_mark_v37.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acoustic-buzz-mark-v37
          path: results/acoustic_buzz_mark_v37.json
          if-no-files-found: error
          retention-days: 60
