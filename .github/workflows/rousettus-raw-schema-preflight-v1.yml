name: rousettus-raw-schema-preflight-v1
on:
  workflow_dispatch:
  push:
    branches: [prospective/rousettus-social-seeding-route-reuse-v1]
    paths:
      - "prospective/rousettus_social_seeding/raw_schema_preflight_v1.py"
      - ".github/workflows/rousettus-raw-schema-preflight-v1.yml"
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python prospective/rousettus_social_seeding/raw_schema_preflight_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: rousettus-raw-schema-preflight-v1
          path: |
            prospective/rousettus_social_seeding/raw_schema_preflight_v1.json
            prospective/rousettus_social_seeding/RAW_SCHEMA_PREFLIGHT_RESULT_V1.md
          if-no-files-found: error
