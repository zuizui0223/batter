name: pteropus-terrain-3d-geometry-v1

on:
  push:
    branches:
      - post-freeze/3d-niche-partition-v1
    paths:
      - "post_freeze_extensions/3d_niche_partition/run_pteropus_terrain_geometry_v1.py"
      - ".github/workflows/pteropus-terrain-3d-geometry-v1.yml"
  workflow_dispatch:

jobs:
  terrain_geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pandas requests
      - name: Run Pteropus terrain-relative 3D geometry
        run: python post_freeze_extensions/3d_niche_partition/run_pteropus_terrain_geometry_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: pteropus-terrain-3d-geometry-v1
          path: post_freeze_extensions/3d_niche_partition/pteropus_terrain_geometry_result_v1.json
          if-no-files-found: error
