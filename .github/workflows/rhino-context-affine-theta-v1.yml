name: rhino-context-affine-theta-v1
on:
  push:
    branches: [post-freeze/rhino-context-affine-theta-v1]
    paths:
      - "prospective/task_reset_lockin/CONTEXT_AFFINE_THETA_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/context_affine_theta_v1.py"
      - ".github/workflows/rhino-context-affine-theta-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --quiet numpy
      - run: python prospective/task_reset_lockin/context_affine_theta_v1.py > context_affine_theta_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-context-affine-theta-v1
          path: context_affine_theta_result_v1.json
          if-no-files-found: error
