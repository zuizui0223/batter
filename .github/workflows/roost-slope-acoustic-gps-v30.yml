name: Roost slope acoustic GPS source V30
on:
  push:
    branches: [prospective/roost-3d-connectivity-fd-20261124]
    paths:
      - scripts/roost_slope_acoustic_gps_preflight_v30.py
      - .github/workflows/roost-slope-acoustic-gps-v30.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 numpy==1.26.4 requests==2.32.3 openpyxl==3.1.5
      - run: python scripts/roost_slope_acoustic_gps_preflight_v30.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roost-slope-acoustic-gps-source-v30
          path: roost_fd_audit/audit_v30_acoustic_gps_source.json
          if-no-files-found: error
