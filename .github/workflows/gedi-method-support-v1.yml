name: GEDI measured-cell observation method support V1
on:
  workflow_dispatch:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/gedi-method-support-v1.yml
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-gbif-fixed-snapshot
          run-id: 45591123869
          github-token: ${{ github.token }}
          path: fixed
      - uses: actions/download-artifact@v4
        with:
          name: europe-common-forest-support-v1
          run-id: 45585033345
          github-token: ${{ github.token }}
          path: pilot
      - uses: actions/download-artifact@v4
        with:
          name: gedi-measured-grid-validation-v1
          run-id: 45715480130
          github-token: ${{ github.token }}
          path: .
      - run: python -m pip install duckdb numpy pandas pyproj
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/gedi_method_support_v1.py
      - run: python prospective/gedi_trait_macro_sdm/gedi_method_support_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gedi-method-support-v1
          path: gedi_method_support/
          if-no-files-found: error
          retention-days: 90
