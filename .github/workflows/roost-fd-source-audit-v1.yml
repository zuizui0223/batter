name: Roost FD source audit V1
on:
  push:
    branches: [prospective/roost-3d-connectivity-fd-20261124]
    paths:
      - scripts/roost_fd_source_audit_v1.py
      - .github/workflows/roost-fd-source-audit-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas==2.2.3 requests==2.32.3 openpyxl==3.1.5
      - run: python scripts/roost_fd_source_audit_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roost-fd-source-audit-v1
          path: roost_fd_audit/audit.json
          if-no-files-found: error
