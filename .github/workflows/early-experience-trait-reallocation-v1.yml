name: early-experience-trait-reallocation-v1

on:
  push:
    paths:
      - "prospective/early_experience_specialization/TRAIT_REALLOCATION_DECOMPOSITION_V1.md"
      - "prospective/early_experience_specialization/run_trait_reallocation_v1.py"
      - ".github/workflows/early-experience-trait-reallocation-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: early-experience-trait-reallocation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decomposition:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/early-experience-specialization-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install readers
        run: python -m pip install numpy openpyxl
      - name: Run exact descriptive trait decomposition
        run: python prospective/early_experience_specialization/run_trait_reallocation_v1.py
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/early_experience_specialization/TRAIT_REALLOCATION_RESULT_V1.json
          git add prospective/early_experience_specialization/TRAIT_REALLOCATION_RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record early-experience trait reallocation decomposition"
            git fetch origin prospective/early-experience-specialization-v1
            git rebase origin/prospective/early-experience-specialization-v1
            git push origin HEAD:prospective/early-experience-specialization-v1
          fi
