name: field-policy-breadth-persistence-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/field_policy_breadth_persistence_v1.py
      - prospective/field_policy_bridge/FIELD_POLICY_BREADTH_PERSISTENCE_CONTRACT_V1.md
      - .github/workflows/field-policy-breadth-persistence-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  breadth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dependencies
        run: |
          python -m pip install --quiet -e .
          python -m pip install --quiet numpy pandas scipy pyproj
      - name: Run frozen field policy breadth persistence
        shell: bash
        run: |
          set -euo pipefail
          python prospective/field_policy_bridge/field_policy_breadth_persistence_v1.py | tee prospective/field_policy_bridge/FIELD_POLICY_BREADTH_PERSISTENCE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-policy-breadth-persistence-v1
          path: prospective/field_policy_bridge/FIELD_POLICY_BREADTH_PERSISTENCE_RESULT_V1.json
          if-no-files-found: warn
