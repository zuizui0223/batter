name: neural-silencing-metadata-preflight-v1

on:
  push:
    branches:
      - prospective/neural-silencing-policy-v1
    paths:
      - prospective/neural_silencing_policy/metadata_preflight_v1.py
      - prospective/neural_silencing_policy/METADATA_PREFLIGHT_CONTRACT_V1.md
      - .github/workflows/neural-silencing-metadata-preflight-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run metadata-only Zenodo preflight
        shell: bash
        run: |
          set -euo pipefail
          python prospective/neural_silencing_policy/metadata_preflight_v1.py | tee prospective/neural_silencing_policy/METADATA_PREFLIGHT_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neural-silencing-metadata-preflight-v1
          path: prospective/neural_silencing_policy/METADATA_PREFLIGHT_RESULT_V1.json
          if-no-files-found: warn
