name: FWS independent 6-km roadside profile diagnostic
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/fws_coarse_profile_diagnostic_v1.py
      - .github/workflows/gvsm-fws-coarse-profile-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mdbtools
      - run: python -m pip install requests pandas numpy scipy pyproj rasterio
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/fws_coarse_profile_diagnostic_v1.py
      - run: python prospective/gedi_trait_macro_sdm/fws_coarse_profile_diagnostic_v1.py
        timeout-minutes: 45
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fws-coarse-profile-diagnostic-v1
          path: fws_coarse_profile/report.json
          if-no-files-found: warn
