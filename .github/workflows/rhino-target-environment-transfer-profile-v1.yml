name: rhino-target-environment-transfer-profile-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/target_environment_transfer_profile_v1.py
      - prospective/task_reset_lockin/TARGET_ENVIRONMENT_TRANSFER_PROFILE_CONTRACT_V1.md
      - .github/workflows/rhino-target-environment-transfer-profile-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run target-environment transfer profiles
        run: |
          python prospective/task_reset_lockin/target_environment_transfer_profile_v1.py | tee prospective/task_reset_lockin/TARGET_ENVIRONMENT_TRANSFER_PROFILE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-target-environment-transfer-profile-v1
          path: prospective/task_reset_lockin/TARGET_ENVIRONMENT_TRANSFER_PROFILE_RESULT_V1.json
          if-no-files-found: error
