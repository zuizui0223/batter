name: adaptive-learning-3d-header-preflight-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/adaptive_learning_3d_header_preflight_v1.py
      - prospective/task_reset_lockin/ADAPTIVE_LEARNING_3D_HEADER_PREFLIGHT_V1.md
      - .github/workflows/adaptive-learning-3d-header-preflight-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Open headers only
        run: |
          python prospective/task_reset_lockin/adaptive_learning_3d_header_preflight_v1.py | tee prospective/task_reset_lockin/ADAPTIVE_LEARNING_3D_HEADER_PREFLIGHT_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-learning-3d-header-preflight-v1
          path: prospective/task_reset_lockin/ADAPTIVE_LEARNING_3D_HEADER_PREFLIGHT_RESULT_V1.json
          if-no-files-found: error
