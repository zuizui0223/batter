name: Frozen baseline terrain diagnostic replay
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - .github/workflows/gvsm-baseline-terrain-replay.yml
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: europe-common-forest-support-v1
          run-id: 45585033345
          github-token: ${{ github.token }}
          path: pilot
      - uses: actions/download-artifact@v4
        with:
          name: baseline-covariates-terrain
          run-id: 45659440994
          github-token: ${{ github.token }}
          path: baseline_terrain
      - uses: actions/download-artifact@v4
        with:
          name: baseline-covariates-leaf
          run-id: 45659440994
          github-token: ${{ github.token }}
          path: baseline_leaf
      - run: python -m pip install numpy==2.5.5 pandas==3.1.1 scipy==1.18.1
      - run: python prospective/gedi_trait_macro_sdm/baseline_leaf_terrain_challenge_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-terrain-replay-v1
          path: baseline_challenge/
          if-no-files-found: error
          retention-days: 90
