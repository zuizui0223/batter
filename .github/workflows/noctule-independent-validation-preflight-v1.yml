name: noctule-independent-validation-preflight-v1

on:
  push:
    branches: [prospective/noctule-independent-validation-v1]
    paths:
      - "post_freeze_extensions/noctule_independent_validation/contract_v1.json"
      - "post_freeze_extensions/noctule_independent_validation/preflight_v1.py"
      - ".github/workflows/noctule-independent-validation-preflight-v1.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pandas requests
      - name: Run outcome-blind noctule preflight
        run: python post_freeze_extensions/noctule_independent_validation/preflight_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-noctule-independent-validation-preflight-v1
          path: |
            post_freeze_extensions/noctule_independent_validation/preflight_result_v1.json
            post_freeze_extensions/noctule_independent_validation/PREFLIGHT_RESULT_V1.md
          if-no-files-found: error
