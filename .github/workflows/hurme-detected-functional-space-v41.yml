name: Hurme detected functional space V41
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/hurme_detected_functional_space_v41.py
      - .github/workflows/hurme-detected-functional-space-v41.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy pyproj
      - run: python scripts/hurme_detected_functional_space_v41.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hurme-detected-functional-space-v41
          path: results/hurme_detected_functional_space_v41.json
          if-no-files-found: error
          retention-days: 60
