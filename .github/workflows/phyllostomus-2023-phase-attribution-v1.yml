name: phyllostomus-2023-phase-attribution-v1
on:
  push:
    branches: [exploratory/phyllostomus-2023-phase-attribution-v1]
    paths:
      - "post_freeze_extensions/phyllostomus_2023_phase_attribution/**"
      - ".github/workflows/phyllostomus-2023-phase-attribution-v1.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - name: Run frozen support-matched phase attribution
        run: python post_freeze_extensions/phyllostomus_2023_phase_attribution/run_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-phyllostomus-2023-phase-attribution-v1
          path: |
            post_freeze_extensions/phyllostomus_2023_phase_attribution/result_v1.json
            post_freeze_extensions/phyllostomus_2023_phase_attribution/RESULT_V1.md
          if-no-files-found: error
