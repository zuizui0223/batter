name: movebank-raw-panel-screen-v1
on:
  push:
    branches: [prospective/movebank-raw-panel-screen-v1]
    paths:
      - "post_freeze_extensions/comparative_generality/movebank_raw_screen/**"
      - ".github/workflows/movebank-raw-panel-screen-v1.yml"
  workflow_dispatch:
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas requests
      - name: Run outcome-blind raw Movebank screen
        run: python post_freeze_extensions/comparative_generality/movebank_raw_screen/run_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-movebank-raw-panel-screen-v1
          path: |
            post_freeze_extensions/comparative_generality/movebank_raw_screen/result_v1.json
            post_freeze_extensions/comparative_generality/movebank_raw_screen/RESULT_V1.md
          if-no-files-found: error
      - name: Pin raw screen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             post_freeze_extensions/comparative_generality/movebank_raw_screen/result_v1.json             post_freeze_extensions/comparative_generality/movebank_raw_screen/RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No screen changes"
          else
            git commit -m "Record raw Movebank bat candidate screen"
            git push origin HEAD:prospective/movebank-raw-panel-screen-v1
          fi
