name: pregnancy-external-structural-support-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/pregnancy_external_structural_support_v1.py
      - prospective/task_reset_lockin/PREGNANCY_EXTERNAL_STRUCTURAL_SUPPORT_CONTRACT_V1.md
      - .github/workflows/pregnancy-external-structural-support-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pregnancy structural support audit
        run: |
          python prospective/task_reset_lockin/pregnancy_external_structural_support_v1.py | tee prospective/task_reset_lockin/PREGNANCY_EXTERNAL_STRUCTURAL_SUPPORT_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: pregnancy-external-structural-support-v1
          path: prospective/task_reset_lockin/PREGNANCY_EXTERNAL_STRUCTURAL_SUPPORT_RESULT_V1.json
          if-no-files-found: error
