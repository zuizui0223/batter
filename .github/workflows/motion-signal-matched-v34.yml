name: Motion signal matched regularization V34
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/motion_signal_matched_v34.py
      - .github/workflows/motion-signal-matched-v34.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        panel: [tadarida, eidolon, hypsignathus, phyllostomus_2022, phyllostomus_2023, phyllostomus_2016]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m scripts.motion_signal_matched_v34 --panel ${{ matrix.panel }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-signal-matched-v34-${{ matrix.panel }}
          path: results/motion_signal_matched_v34_${{ matrix.panel }}.json
          if-no-files-found: error
          retention-days: 60
