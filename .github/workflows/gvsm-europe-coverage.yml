name: GVSM European spatial coverage
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/europe_spatial_coverage.py
      - .github/workflows/gvsm-europe-coverage.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gedi-macro-iberia-join
          run-id: 45575962660
          github-token: ${{ github.token }}
          path: occ
      - run: python -m pip install requests pyproj
      - run: python prospective/gedi_trait_macro_sdm/europe_spatial_coverage.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gvsm-europe-spatial-coverage
          path: europe_coverage/
          if-no-files-found: error
