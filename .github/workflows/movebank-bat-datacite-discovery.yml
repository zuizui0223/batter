name: movebank-bat-datacite-discovery-v1

on:
  push:
    branches:
      - study/individual-vertical-strategies-v1
    paths:
      - "scripts/discover_movebank_bat_dois.py"
      - ".github/workflows/movebank-bat-datacite-discovery.yml"
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/discover_movebank_bat_dois.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-movebank-bat-datacite-discovery-v1
          path: results/movebank_bat_datacite_discovery_v1.json
