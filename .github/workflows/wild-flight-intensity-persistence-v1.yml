name: wild-flight-intensity-persistence-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/wild_flight_intensity_persistence_v1.py
      - prospective/field_policy_bridge/WILD_FLIGHT_INTENSITY_PERSISTENCE_CONTRACT_V1.md
      - .github/workflows/wild-flight-intensity-persistence-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet numpy pyproj
      - name: Run frozen wild FlightIntensity persistence test
        run: |
          python prospective/field_policy_bridge/wild_flight_intensity_persistence_v1.py | tee prospective/field_policy_bridge/WILD_FLIGHT_INTENSITY_PERSISTENCE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wild-flight-intensity-persistence-v1
          path: prospective/field_policy_bridge/WILD_FLIGHT_INTENSITY_PERSISTENCE_RESULT_V1.json
          if-no-files-found: warn
