name: GEDI macro Iberian land cover
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/prepare_iberia_landcover.py
      - .github/workflows/gedi-macro-iberia-landcover.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  landcover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'rasterio>=1.4' numpy requests pyproj
      - run: python prospective/gedi_trait_macro_sdm/prepare_iberia_landcover.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iberia-worldcover-baseline
          path: iberia_landcover/
          if-no-files-found: error
