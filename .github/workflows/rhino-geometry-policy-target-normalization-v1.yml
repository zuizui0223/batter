name: rhino-geometry-policy-target-normalization-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/GEOMETRY_POLICY_TARGET_NORMALIZATION_CONTRACT_V1.md
      - prospective/task_reset_lockin/geometry_policy_target_normalization_v1.py
      - .github/workflows/rhino-geometry-policy-target-normalization-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  normalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run geometry target-normalization sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python prospective/task_reset_lockin/geometry_policy_target_normalization_v1.py | tee prospective/task_reset_lockin/GEOMETRY_POLICY_TARGET_NORMALIZATION_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhino-geometry-policy-target-normalization-v1
          path: prospective/task_reset_lockin/GEOMETRY_POLICY_TARGET_NORMALIZATION_RESULT_V1.json
          if-no-files-found: warn
