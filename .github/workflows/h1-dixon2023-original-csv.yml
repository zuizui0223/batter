name: H1 Dixon 2023 original cue-choice CSV byte gate

on:
  push:
    branches: [prospective/social-information-macro-h1-v1]
    paths:
      - 'prospective/social_macro_h1/h1_dixon2023_original_csv_gate.py'
      - '.github/workflows/h1-dixon2023-original-csv.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original 2023 choice CSV SHA and columns, not outcomes
        id: source
        continue-on-error: true
        run: python prospective/social_macro_h1/h1_dixon2023_original_csv_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h1-dixon2023-choice-raw-file-gate-receipt
          path: /tmp/h1_dixon2023_original_file_transfer_gate.json
          if-no-files-found: error
      - name: Fail closed on source download issues
        if: steps.source.outcome == 'failure'
        run: |
          echo "::error::Dixon original choice rows inaccessible. Do not infer a novel cognitive association."
          exit 1
