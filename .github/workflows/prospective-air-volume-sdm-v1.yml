name: Prospective true-air-volume SDM v1 mathematical known-truth
on:
  push:
    branches:
      - prospective/air-volume-observation-kernel-20261123
    paths:
      - 'src/batter/air_volume_sdm_v1.py'
      - 'tests/test_air_volume_sdm_v1.py'
      - 'scripts/run_air_volume_synthetic_v1.py'
      - '.github/workflows/prospective-air-volume-sdm-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_free_air_volume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing batter package and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Known truth 3D voxel, q, volume, rank and heldout clutter tests
        run: python -m pytest -q tests/test_air_volume_sdm_v1.py
      - name: Explicitly synthetic 2D vs 3D identifiability and predictive demonstration
        run: python -m scripts.run_air_volume_synthetic_v1
      - name: Archive synthetic-only result and observation boundary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batter-air-volume-synthetic-v1
          path: results/prospective_air_volume_synthetic_v1.json
          retention-days: 60
          if-no-files-found: warn
