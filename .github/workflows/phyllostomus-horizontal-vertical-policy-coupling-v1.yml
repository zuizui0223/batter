name: phyllostomus-horizontal-vertical-policy-coupling-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/horizontal_vertical_policy_coupling_v1.py
      - prospective/field_policy_bridge/HORIZONTAL_VERTICAL_POLICY_COUPLING_CONTRACT_V1.md
      - .github/workflows/phyllostomus-horizontal-vertical-policy-coupling-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coupling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet -e .
      - name: Run frozen H-V coupling diagnostic
        run: |
          python prospective/field_policy_bridge/horizontal_vertical_policy_coupling_v1.py | tee prospective/field_policy_bridge/HORIZONTAL_VERTICAL_POLICY_COUPLING_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: phyllostomus-horizontal-vertical-policy-coupling-v1
          path: prospective/field_policy_bridge/HORIZONTAL_VERTICAL_POLICY_COUPLING_RESULT_V1.json
          if-no-files-found: error
