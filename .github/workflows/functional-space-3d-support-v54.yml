name: Functional space 3D support V54
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/functional_space_3d_support_v54.py
      - .github/workflows/functional-space-3d-support-v54.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy scipy
      - run: python scripts/functional_space_3d_support_v54.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-space-3d-support-v54
          path: results/functional_space_3d_support_v54.json
          if-no-files-found: error
          retention-days: 60
