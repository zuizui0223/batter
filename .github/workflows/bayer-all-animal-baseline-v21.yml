name: Bayer all-animal baseline and wind archive V21
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/bayer_all_animal_baseline_v21.py
      - .github/workflows/bayer-all-animal-baseline-v21.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy==2.4.6 pypdf
      - run: python scripts/bayer_all_animal_baseline_v21.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayer-all-animal-baseline-v21
          path: results/bayer_all_animal_baseline_v21.json
          if-no-files-found: error
          retention-days: 60
