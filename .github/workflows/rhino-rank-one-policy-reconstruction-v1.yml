name: rhino-rank-one-policy-reconstruction-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/rank_one_policy_reconstruction_v1.py
      - prospective/task_reset_lockin/RANK_ONE_POLICY_RECONSTRUCTION_CONTRACT_V1.md
      - .github/workflows/rhino-rank-one-policy-reconstruction-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run frozen rank-one reconstruction
        run: |
          python prospective/task_reset_lockin/rank_one_policy_reconstruction_v1.py | tee prospective/task_reset_lockin/RANK_ONE_POLICY_RECONSTRUCTION_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-rank-one-policy-reconstruction-v1
          path: prospective/task_reset_lockin/RANK_ONE_POLICY_RECONSTRUCTION_RESULT_V1.json
          if-no-files-found: error
