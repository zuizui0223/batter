name: Münster independent original numeric XYZ count replay v3
on:
  push:
    branches:
      - prospective/air-volume-observation-kernel-20261123
    paths:
      - 'scripts/verify_muenster_local_XYZ_v3_independent.py'
      - 'tests/test_muenster_local_xyz_independent_v3.py'
      - '.github/workflows/muenster-real-xyz-independent-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_numeric_independent_reader:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent NumPy and pytest only
        run: python -m pip install 'numpy>=1.26,<3' 'pytest>=8'
      - name: Known-truth independent coordinate count parser tests
        run: python -m pytest -q tests/test_muenster_local_xyz_independent_v3.py
      - name: Re-download original ZIP and independently verify 197 local finite XYZ
        run: python -m scripts.verify_muenster_local_XYZ_v3_independent
      - name: Preserve independent original-source QC or strict failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muenster-197-local-XYZ-independent-v3
          path: results/muenster_real_local_xyz_independent_v3.json
          if-no-files-found: warn
          retention-days: 60
