name: spatial-scale-individualization-v1
on:
  push:
    branches: [post-freeze/spatial-scale-individualization-v1]
    paths:
      - "post_freeze_extensions/spatial_scale_individualization/**"
      - ".github/workflows/spatial-scale-individualization-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python post_freeze_extensions/spatial_scale_individualization/run_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-scale-individualization-v1
          path: |
            post_freeze_extensions/spatial_scale_individualization/result_v1.json
            post_freeze_extensions/spatial_scale_individualization/RESULT_V1.md
          if-no-files-found: error
