name: rhino-coordinate-support-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/rhino_coordinate_support_v1.py
      - prospective/task_reset_lockin/RHINO_COORDINATE_SUPPORT_OPENING_V1.md
      - .github/workflows/rhino-coordinate-support-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coordinate-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numeric dependency
        run: python -m pip install --quiet numpy
      - name: Run frozen coordinate-support gate
        run: |
          python prospective/task_reset_lockin/rhino_coordinate_support_v1.py | tee prospective/task_reset_lockin/RHINO_COORDINATE_SUPPORT_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-coordinate-support-v1
          path: prospective/task_reset_lockin/RHINO_COORDINATE_SUPPORT_RESULT_V1.json
          if-no-files-found: error
