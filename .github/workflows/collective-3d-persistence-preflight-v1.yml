name: collective-3d-persistence-preflight-v1

on:
  push:
    branches: [post-freeze/collective-3d-persistence-preflight-v1]
    paths:
      - "post_freeze_extensions/collective_3d_persistence_preflight/**"
      - ".github/workflows/collective-3d-persistence-preflight-v1.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python post_freeze_extensions/collective_3d_persistence_preflight/run_preflight_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: collective-3d-persistence-preflight-v1
          path: post_freeze_extensions/collective_3d_persistence_preflight/result_v1.json
          if-no-files-found: error
