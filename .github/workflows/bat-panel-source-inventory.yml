name: bat-panel-source-inventory-v1

on:
  push:
    branches:
      - study/individual-vertical-strategies-v1
    paths:
      - "scripts/inventory_bat_panel_sources.py"
      - ".github/workflows/bat-panel-source-inventory.yml"
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/inventory_bat_panel_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-bat-panel-source-inventory-v1
          path: results/bat_panel_source_inventory_v1.json
