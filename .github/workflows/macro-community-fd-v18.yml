name: Macro community FD V18 acoustic trait feasibility
on:
  push:
    branches: [prospective/macro-community-fd-20261127]
    paths: ['.github/workflows/macro-community-fd-v18.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sensory:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical runtime
        run: |
          python -m pip install --only-binary=:all: numpy==2.2.6 pandas==2.2.3 scipy==1.15.3 requests==2.32.5
      - name: Audit published manifest and bounded spectral feasibility
        run: python prospective/macro_community_fd/macro_fd_v18_chiroset_sensory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-community-fd-v18-aggregate
          path: macro_fd_v18_result.json
          retention-days: 30
          if-no-files-found: error
