name: GVSM fixed snapshot environmental support
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/fixed_snapshot_environment.py
      - .github/workflows/gvsm-fixed-snapshot-environment.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-gbif-fixed-snapshot
          run-id: 45591123869
          github-token: ${{ github.token }}
          path: fixed
      - uses: actions/download-artifact@v4
        with:
          name: europe-common-forest-support-v1
          run-id: 45585033345
          github-token: ${{ github.token }}
          path: prior_common
      - uses: actions/download-artifact@v4
        with:
          name: gedi-macro-iberia-join
          run-id: 45575962660
          github-token: ${{ github.token }}
          path: traits
      - run: python -m pip install numpy pandas rasterio pyproj requests
      - run: python -m py_compile prospective/gedi_trait_macro_sdm/fixed_snapshot_environment.py
      - run: python prospective/gedi_trait_macro_sdm/fixed_snapshot_environment.py
        timeout-minutes: 50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gvsm-fixed-snapshot-environment
          path: snapshot_environment/
          if-no-files-found: error
