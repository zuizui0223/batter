name: early-experience-randomization-linkage-v1

on:
  push:
    branches:
      - prospective/early-experience-history-carrier-v1
    paths:
      - prospective/early_experience_history_carrier/randomization_linkage_v1.py
      - prospective/early_experience_history_carrier/RANDOMIZATION_LINKAGE_AMENDMENT_V1.md
      - .github/workflows/early-experience-randomization-linkage-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard behavioural outcome closure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("prospective/early_experience_history_carrier/randomization_linkage_v1.py").read_text()
          banned=["Time Out (Minute)","Max distance (meters)","Explored area","Boldness","time2exit","ActiveTime_Sec"]
          hits=[x for x in banned if x in p]
          if hits:
              raise SystemExit(f"outcome closure guard failed: {hits}")
          print("outcome closure guard PASS")
          PY
      - name: Resolve source-native blocks
        run: |
          python prospective/early_experience_history_carrier/randomization_linkage_v1.py | tee prospective/early_experience_history_carrier/RANDOMIZATION_LINKAGE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: early-experience-randomization-linkage-v1
          path: prospective/early_experience_history_carrier/RANDOMIZATION_LINKAGE_RESULT_V1.json
          if-no-files-found: error
