name: rhino-transparent-two-axis-policy-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/transparent_two_axis_policy_v1.py
      - prospective/task_reset_lockin/TRANSPARENT_TWO_AXIS_POLICY_CONTRACT_V1.md
      - .github/workflows/rhino-transparent-two-axis-policy-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-axis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --quiet numpy
      - name: Run transparent two-axis diagnostic
        run: |
          python prospective/task_reset_lockin/transparent_two_axis_policy_v1.py | tee prospective/task_reset_lockin/TRANSPARENT_TWO_AXIS_POLICY_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-transparent-two-axis-policy-v1
          path: prospective/task_reset_lockin/TRANSPARENT_TWO_AXIS_POLICY_RESULT_V1.json
          if-no-files-found: error
