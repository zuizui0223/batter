name: rhino-rank-two-forward-test-v1
on:
  push:
    branches: [post-freeze/rhino-rank-two-forward-test-v1]
    paths:
      - "prospective/task_reset_lockin/RHINO_RANK_TWO_FORWARD_TEST_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/rhino_rank_two_forward_test_v1.py"
      - ".github/workflows/rhino-rank-two-forward-test-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python prospective/task_reset_lockin/rhino_rank_two_forward_test_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-rank-two-forward-test-v1
          path: prospective/task_reset_lockin/RHINO_RANK_TWO_FORWARD_TEST_RESULT_V1.json
          if-no-files-found: error
