name: nyctalus-schema-audit-v1
on:
  push:
    branches: [prospective/nyctalus-independent-validation-v1]
    paths:
      - "post_freeze_extensions/nyctalus_external_validation/**"
      - ".github/workflows/nyctalus-schema-audit-v1.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pandas requests
      - name: Run outcome-blind Nyctalus schema audit
        run: python post_freeze_extensions/nyctalus_external_validation/schema_audit_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-nyctalus-schema-audit-v1
          path: |
            post_freeze_extensions/nyctalus_external_validation/schema_audit_result_v1.json
            post_freeze_extensions/nyctalus_external_validation/SCHEMA_AUDIT_RESULT_V1.md
          if-no-files-found: error
