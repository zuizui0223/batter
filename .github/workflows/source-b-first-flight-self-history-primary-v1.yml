name: source-b-first-flight-self-history-primary-v1

on:
  push:
    branches:
      - prospective/ontogenetic-path-dependence-v1
    paths:
      - prospective/ontogenetic_path_dependence/SOURCE_B_SELF_HISTORY_ESTIMATOR_CONTRACT_V1.md
      - prospective/ontogenetic_path_dependence/SOURCE_B_PERMUTATION_ELIGIBILITY_CLARIFICATION_V1.md
      - prospective/ontogenetic_path_dependence/SOURCE_B_MATLAB_STANDARDIZED_COORDINATE_BRIDGE_V2.md
      - prospective/ontogenetic_path_dependence/SOURCE_B_MATLAB_COORDINATE_SUPPORT_RESULT_V1.md
      - prospective/ontogenetic_path_dependence/download_source_b_matlab_structural_v1.py
      - prospective/ontogenetic_path_dependence/source_b_matlab_standardized_bridge_v2.m
      - prospective/ontogenetic_path_dependence/source_b_self_history_outcome_from_bridge_v1.py
      - .github/workflows/source-b-first-flight-self-history-primary-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Freeze guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("prospective/ontogenetic_path_dependence/source_b_self_history_outcome_from_bridge_v1.py").read_text()
          required=[
            "N_PERM=9999","SEED=20261004021","TARGET_ORDINALS=range(3,21)",
            "HISTORY_CAP=5","cKDTree","rankdata","0.70"
          ]
          missing=[x for x in required if x not in p]
          if missing:
              raise SystemExit(f"frozen estimator guard failed: {missing}")
          banned=["DTW","Fréchet","Hausdorff","KDE","GPS_2016_2017 only"]
          hits=[x for x in banned if x in p]
          if hits:
              raise SystemExit(f"unauthorized rescue found: {hits}")
          print("frozen primary guard PASS")
          PY
      - name: Download identity-verified ordinary source files
        run: python prospective/ontogenetic_path_dependence/download_source_b_matlab_structural_v1.py
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
      - name: Build standardized coordinate bridge
        uses: matlab-actions/run-command@v2
        with:
          command: addpath("prospective/ontogenetic_path_dependence"), source_b_matlab_standardized_bridge_v2
      - name: Open frozen primary outcome
        run: |
          python prospective/ontogenetic_path_dependence/source_b_self_history_outcome_from_bridge_v1.py | tee prospective/ontogenetic_path_dependence/SOURCE_B_SELF_HISTORY_PRIMARY_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-b-first-flight-self-history-primary-v1
          path: |
            prospective/ontogenetic_path_dependence/SOURCE_B_SELF_HISTORY_PRIMARY_RESULT_V1.json
            prospective/ontogenetic_path_dependence/matlab_bridge_v2/manifest.csv
            prospective/ontogenetic_path_dependence/matlab_bridge_v2/**/*.mat
          if-no-files-found: error
