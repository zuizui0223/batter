name: external-3d-geometry-v1

on:
  push:
    branches:
      - post-freeze/3d-niche-partition-v1
    paths:
      - "post_freeze_extensions/3d_niche_partition/run_external_geometry_v1.py"
      - "post_freeze_extensions/3d_niche_partition/EXTERNAL_GEOMETRY_PREDICTION_CONTRACT_V1.md"
      - "post_freeze_extensions/3d_niche_partition/external_geometry_prediction_contract_v1.json"
      - "post_freeze_extensions/3d_niche_partition/source_receipts/**"
      - ".github/workflows/external-3d-geometry-v1.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      DRYAD_API_TOKEN: ${{ secrets.DRYAD_API_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        source:
          - myotis_vivesi
          - pteropus_poliocephalus
          - nyctalus_noctula
          - hipposideros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pandas requests pyproj
      - name: Run frozen external 3D geometry test
        run: python post_freeze_extensions/3d_niche_partition/run_external_geometry_v1.py --source "${{ matrix.source }}"
      - uses: actions/upload-artifact@v4
        with:
          name: external-3d-geometry-${{ matrix.source }}-v1
          path: post_freeze_extensions/3d_niche_partition/external_results/${{ matrix.source }}_result_v1.json
          if-no-files-found: error
