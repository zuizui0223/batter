name: rhino-one-dimensional-exhaustiveness-v1
on:
  push:
    branches: [post-freeze/rhino-one-dimensional-exhaustiveness-v1]
    paths:
      - "prospective/task_reset_lockin/ONE_DIMENSIONAL_EXHAUSTIVENESS_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/one_dimensional_exhaustiveness_v1.py"
      - ".github/workflows/rhino-one-dimensional-exhaustiveness-v1.yml"
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e .
      - run: python prospective/task_reset_lockin/one_dimensional_exhaustiveness_v1.py > one_dimensional_exhaustiveness_result_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-one-dimensional-exhaustiveness-v1
          path: one_dimensional_exhaustiveness_result_v1.json
          if-no-files-found: error
