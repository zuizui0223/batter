name: task-reset-pickle-obstacle-key-probe-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/pickle_obstacle_geometry_key_probe_v1.py
      - prospective/task_reset_lockin/PICKLE_OBSTACLE_GEOMETRY_KEY_PROBE_V1.md
      - .github/workflows/task-reset-pickle-obstacle-key-probe-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run structure-only obstacle key probe
        shell: bash
        run: |
          set -euo pipefail
          python prospective/task_reset_lockin/pickle_obstacle_geometry_key_probe_v1.py | tee prospective/task_reset_lockin/PICKLE_OBSTACLE_GEOMETRY_KEY_PROBE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-reset-pickle-obstacle-key-probe-v1
          path: prospective/task_reset_lockin/PICKLE_OBSTACLE_GEOMETRY_KEY_PROBE_RESULT_V1.json
          if-no-files-found: warn
