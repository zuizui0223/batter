name: Lunar 3D source exposure gate v1
on:
  push:
    branches:
      - prospective/lunar-3d-response-gate-v1-20261122
    paths:
      - 'prospective/lunar_3d/**'
      - '.github/workflows/lunar-3d-source-exposure-v1.yml'
  workflow_dispatch:
jobs:
  lunar_source_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned astronomy dependency
        run: python -m pip install 'pyswisseph==2.10.3.2'
      - name: Run outcome-blind synthetic tests
        run: python -m unittest -v prospective.lunar_3d.test_lunar_source_gate_v1
      - name: Check six hash-pinned public source exposure windows
        run: python -m prospective.lunar_3d.lunar_source_gate_v1
      - name: Preserve data-support decision only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunar-3d-exposure-source-gate-v1
          path: results/lunar_source_exposure_support_v1.json
          if-no-files-found: warn
          retention-days: 30
