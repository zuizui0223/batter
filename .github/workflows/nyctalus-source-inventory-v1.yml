name: nyctalus-source-inventory-v1
on:
  push:
    branches: [post-freeze/nyctalus-source-inventory-v1]
    paths:
      - "post_freeze_extensions/nyctalus_source_inventory/**"
      - ".github/workflows/nyctalus-source-inventory-v1.yml"
  workflow_dispatch:
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install requests
      - name: Inventory Zenodo record metadata
        run: python post_freeze_extensions/nyctalus_source_inventory/run_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-nyctalus-source-inventory-v1
          path: |
            post_freeze_extensions/nyctalus_source_inventory/result_v1.json
            post_freeze_extensions/nyctalus_source_inventory/RESULT_V1.md
          if-no-files-found: error
