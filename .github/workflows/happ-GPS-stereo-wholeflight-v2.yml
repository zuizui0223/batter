name: Happ independent original drone-flight stereo GPS holdout v2
on:
  push:
    branches:
      - prospective/air-volume-observation-kernel-20261123
    paths:
      - 'scripts/happ_GPS_stereo_wholeflight_transfer_v2.py'
      - 'tests/test_happ_GPS_stereo_wholeflight_v2.py'
      - '.github/workflows/happ-GPS-stereo-wholeflight-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heldout_original_drone_GPS:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless OpenCV and original batter coordinate dependencies
        run: python -m pip install -e '.[test]' 'numpy>=1.26,<2' 'opencv-python-headless==4.9.0.80'
      - name: Synthetic PnP and triangulation tests BEFORE original drone GPS opening
        run: python -m pytest -q tests/test_happ_GPS_stereo_wholeflight_v2.py
      - name: Fetch authenticated original author calibration flight source
        run: |
          mkdir -p external
          git clone --depth 1 --branch v1.0.1 https://github.com/christofhapp/batflight3D_publication.git external/happ
          test "$(git -C external/happ rev-parse HEAD)" = "34d2f56bcee1eab9207890938aedd90a079bfcde"
      - name: Entire original drone flight withheld from camera fit in both directions
        run: python -m scripts.happ_GPS_stereo_wholeflight_transfer_v2
      - name: Preserve first frozen source holdout result or explicit STOP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happ-GPS-stereo-full-flight-heldout-v2
          path: results/happ_GPS_stereo_flight_holdout_v2.json
          if-no-files-found: warn
          retention-days: 60
