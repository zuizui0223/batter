name: nyctalus-eligibility-robustness-v1
on:
  push:
    branches: [post-freeze/nyctalus-eligibility-robustness-v1]
    paths:
      - "post_freeze_extensions/nyctalus_eligibility_robustness/**"
      - ".github/workflows/nyctalus-eligibility-robustness-v1.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pandas requests
      - name: Run post-outcome eligibility robustness diagnostic
        run: python post_freeze_extensions/nyctalus_eligibility_robustness/run_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-nyctalus-eligibility-robustness-v1
          path: |
            post_freeze_extensions/nyctalus_eligibility_robustness/result_v1.json
            post_freeze_extensions/nyctalus_eligibility_robustness/RESULT_V1.md
          if-no-files-found: error
