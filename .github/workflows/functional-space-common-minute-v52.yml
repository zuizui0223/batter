name: Functional space common minute reference V52
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/functional_space_common_minute_v52.py
      - .github/workflows/functional-space-common-minute-v52.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas numpy pyproj
      - run: python scripts/functional_space_common_minute_v52.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-space-common-minute-v52
          path: results/functional_space_common_minute_v52.json
          if-no-files-found: error
          retention-days: 60
