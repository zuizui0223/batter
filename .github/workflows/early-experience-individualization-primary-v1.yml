name: early-experience-individualization-primary-v1

on:
  push:
    paths:
      - "prospective/early_experience_specialization/PRIMARY_CONTRACT_V1.md"
      - "prospective/early_experience_specialization/COHORT_STRUCTURE_RESULT_V1.json"
      - "prospective/early_experience_specialization/run_primary_v1.py"
      - ".github/workflows/early-experience-individualization-primary-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: early-experience-individualization-primary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  primary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/early-experience-specialization-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical readers
        run: python -m pip install numpy openpyxl
      - name: Run frozen primary
        run: python prospective/early_experience_specialization/run_primary_v1.py
      - name: Commit primary receipt
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/early_experience_specialization/PRIMARY_RESULT_V1.json
          git add prospective/early_experience_specialization/PRIMARY_RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No primary changes"
          else
            git commit -m "Record early-experience individualization primary"
            git pull --rebase origin prospective/early-experience-specialization-v1
            git push origin HEAD:prospective/early-experience-specialization-v1
          fi
