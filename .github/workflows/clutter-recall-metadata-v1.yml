name: clutter-recall-metadata-v1

on:
  push:
    branches:
      - prospective/clutter-recall-policy-v1
    paths:
      - prospective/clutter_recall_policy/metadata_inventory_v1.py
      - prospective/clutter_recall_policy/METADATA_PREFLIGHT_CONTRACT_V1.md
      - .github/workflows/clutter-recall-metadata-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard content closure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("prospective/clutter_recall_policy/metadata_inventory_v1.py").read_text()
          banned=["download_url","read_csv","loadmat","openpyxl","pickle.load"]
          hits=[x for x in banned if x in p]
          if hits:
              raise SystemExit(f"content guard failed: {hits}")
          print("content guard PASS")
          PY
      - name: Inventory metadata only
        run: |
          python prospective/clutter_recall_policy/metadata_inventory_v1.py | tee prospective/clutter_recall_policy/METADATA_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: clutter-recall-metadata-v1
          path: prospective/clutter_recall_policy/METADATA_RESULT_V1.json
          if-no-files-found: error
