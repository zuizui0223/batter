name: original-terrain-dem-preflight-v1

on:
  push:
    branches:
      - post-freeze/3d-niche-partition-v1
    paths:
      - "post_freeze_extensions/3d_niche_partition/run_original_terrain_dem_preflight_v1.py"
      - "post_freeze_extensions/3d_niche_partition/ORIGINAL_TERRAIN_GEOMETRY_CONTRACT_V1.md"
      - "post_freeze_extensions/3d_niche_partition/original_terrain_geometry_contract_v1.json"
      - ".github/workflows/original-terrain-dem-preflight-v1.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pandas requests
      - name: Freeze required DEM tile receipts without decoding elevation values
        run: python post_freeze_extensions/3d_niche_partition/run_original_terrain_dem_preflight_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: original-terrain-dem-preflight-v1
          path: post_freeze_extensions/3d_niche_partition/original_terrain_dem_preflight_receipt_v1.json
          if-no-files-found: error
