name: Myotis 2025 v3 real original source structure audit
on:
  push:
    branches:
      - prospective/myotis-prey-escape-2025-source-gate-v1
    paths:
      - "prospective/reaction_norm_gate/audit_myotis_mendeley_v3_source_structure.py"
      - ".github/workflows/myotis_2025_v3_original_source_audit.yml"
  pull_request:
    paths:
      - "prospective/reaction_norm_gate/audit_myotis_mendeley_v3_source_structure.py"
      - ".github/workflows/myotis_2025_v3_original_source_audit.yml"
permissions:
  contents: read
jobs:
  original-source-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MATLAB metadata reader
        run: python -m pip install "scipy>=1.12,<2" "h5py>=3.10,<4"
      - name: Original source structural audit without opening biological magnitudes
        run: python prospective/reaction_norm_gate/audit_myotis_mendeley_v3_source_structure.py
      - name: Upload audit JSON including held status on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myotis-2025-v3-source-structure
          path: prospective/reaction_norm_gate/MYOTIS_2025_V3_CATEGORICAL_SOURCE_RECEIPT.json
          if-no-files-found: warn
