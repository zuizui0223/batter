name: Bayer directional controls and AFPT shape V23
on:
  push:
    branches:
      - prospective/trait-wind-roundtrip-20261124
    paths:
      - scripts/bayer_afpt_curve_v23.R
      - scripts/bayer_wind_shape_v23.py
      - .github/workflows/bayer-wind-shape-v23.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - run: python -m pip install pandas numpy==2.4.6
      - run: Rscript -e 'options(repos=c(CRAN="https://cloud.r-project.org")); install.packages("afpt"); stopifnot(as.character(packageVersion("afpt"))=="1.1.0.4")'
      - run: Rscript scripts/bayer_afpt_curve_v23.R
      - run: python scripts/bayer_wind_shape_v23.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayer-wind-shape-v23
          path: |
            results/bayer_wind_shape_v23.json
            external/bayer_afpt_curve_v23.csv
          retention-days: 60
          if-no-files-found: warn
