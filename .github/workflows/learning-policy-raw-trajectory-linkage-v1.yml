name: learning-policy-raw-trajectory-linkage-v1

on:
  push:
    branches:
      - prospective/learning-policy-state-v1
    paths:
      - prospective/learning_policy_state/raw_trajectory_linkage_v1.py
      - prospective/learning_policy_state/RAW_TRAJECTORY_LINKAGE_CONTRACT_V1.md
      - .github/workflows/learning-policy-raw-trajectory-linkage-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard trajectory-value closure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("prospective/learning_policy_state/raw_trajectory_linkage_v1.py").read_text()
          banned=["bat(X)[mm]","velocity[m/s]","turn rate","read_excel","pandas","numpy","load_workbook"]
          hits=[x for x in banned if x in p]
          if hits:
              raise SystemExit(f"trajectory-value guard failed: {hits}")
          print("trajectory-value guard PASS")
          PY
      - name: Link sheet names to source subjects
        shell: bash
        run: |
          set -o pipefail
          python prospective/learning_policy_state/raw_trajectory_linkage_v1.py | tee prospective/learning_policy_state/RAW_TRAJECTORY_LINKAGE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: learning-policy-raw-trajectory-linkage-v1
          path: prospective/learning_policy_state/RAW_TRAJECTORY_LINKAGE_RESULT_V1.json
          if-no-files-found: error
