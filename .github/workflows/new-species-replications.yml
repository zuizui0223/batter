name: new-species-replications-v1

on:
  push:
    branches:
      - study/individual-vertical-strategies-v1
    paths:
      - "scripts/run_new_species_replications.py"
      - "contract/hypsignathus_replication_v1.json"
      - "contract/phyllostomus_replication_v1.json"
      - "contract/phyllostomus_2023_replication_v1.json"
      - ".github/workflows/new-species-replications.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/run_new_species_replications.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-new-species-replications-v1
          path: results/new_species_replications_v1.json
