name: source-b-coordinate-support-v1

on:
  push:
    branches:
      - prospective/ontogenetic-path-dependence-v1
    paths:
      - prospective/ontogenetic_path_dependence/source_b_coordinate_support_v1.py
      - prospective/ontogenetic_path_dependence/SOURCE_B_COORDINATE_STRUCTURAL_OPENING_V1.md
      - prospective/ontogenetic_path_dependence/SOURCE_B_SELF_HISTORY_ESTIMATOR_CONTRACT_V1.md
      - .github/workflows/source-b-coordinate-support-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coordinate-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Guard primary outcome closure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("prospective/ontogenetic_path_dependence/source_b_coordinate_support_v1.py").read_text()
          banned=["cKDTree","spearmanr","permutation","D_other","D_self","R_it","route_similarity"]
          hits=[x for x in banned if x in p]
          if hits:
              raise SystemExit(f"outcome guard failed: {hits}")
          print("coordinate structural-only guard PASS")
          PY
      - name: Run coordinate structural gate
        run: |
          python prospective/ontogenetic_path_dependence/source_b_coordinate_support_v1.py | tee prospective/ontogenetic_path_dependence/SOURCE_B_COORDINATE_SUPPORT_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-b-coordinate-support-v1
          path: prospective/ontogenetic_path_dependence/SOURCE_B_COORDINATE_SUPPORT_RESULT_V1.json
          if-no-files-found: error
