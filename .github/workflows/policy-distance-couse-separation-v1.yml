name: policy-distance-couse-separation-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/policy_distance_couse_separation_v1.py
      - prospective/field_policy_bridge/POLICY_DISTANCE_COUSE_SEPARATION_CONTRACT_V1.md
      - post_freeze_extensions/3d_niche_partition/run_couse_preflight_v1.py
      - post_freeze_extensions/3d_niche_partition/run_couse_endpoint_audit_v1.py
      - post_freeze_extensions/3d_niche_partition/run_couse_shiftability_v1.py
      - post_freeze_extensions/3d_niche_partition/run_v1.py
      - post_freeze_extensions/3d_niche_partition/contract_v1.json
      - .github/workflows/policy-distance-couse-separation-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dyad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet -e .
      - name: Run frozen dyad policy-distance test
        run: |
          python prospective/field_policy_bridge/policy_distance_couse_separation_v1.py | tee prospective/field_policy_bridge/POLICY_DISTANCE_COUSE_SEPARATION_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-distance-couse-separation-v1
          path: prospective/field_policy_bridge/POLICY_DISTANCE_COUSE_SEPARATION_RESULT_V1.json
          if-no-files-found: warn
