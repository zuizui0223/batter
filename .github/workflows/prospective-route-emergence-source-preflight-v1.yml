name: prospective-route-emergence-source-preflight-v1

on:
  push:
    branches:
      - prospective/route-emergence-preflight-v1
    paths:
      - "prospective/route_emergence/source_preflight_v1.py"
      - "prospective/route_emergence/PREFLIGHT_CONTRACT_V1.md"
      - "prospective/route_emergence/preflight_contract_v1.json"
      - ".github/workflows/prospective-route-emergence-source-preflight-v1.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python prospective/route_emergence/source_preflight_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-route-emergence-source-preflight-v1
          path: |
            prospective/route_emergence/source_preflight_v1.json
            prospective/route_emergence/SOURCE_PREFLIGHT_RESULT_V1.md
          if-no-files-found: error
