name: Münster original bat XYZ lexical source diagnosis v2.1
on:
  push:
    branches:
      - prospective/air-volume-observation-kernel-20261123
    paths:
      - 'scripts/diagnose_muenster_xyz_csv_grammar_v2_1.py'
      - 'tests/test_muenster_xyz_lexical_diag_v2_1.py'
      - '.github/workflows/muenster-xyz-grammar-v2_1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  type_only_original_source_diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository test runner
        run: python -m pip install -e '.[test]'
      - name: Test no numeric bat xyz is disclosed by source grammar scanner
        run: python -m pytest -q tests/test_muenster_xyz_lexical_diag_v2_1.py
      - name: Diagnose all original XYZ CSV members without numerical positions
        run: python -m scripts.diagnose_muenster_xyz_csv_grammar_v2_1
      - name: Archive initial STOP plus symbolic source grammar receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muenster-source-XYZ-grammar-v2_1
          path: results/muenster_original_xyz_lexical_diag_v2_1.json
          if-no-files-found: error
          retention-days: 60
