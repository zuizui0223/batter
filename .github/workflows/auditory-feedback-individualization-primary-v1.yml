name: auditory-feedback-individualization-primary-v1\n\non:\n  push:\n    paths:\n      - "prospective/auditory_feedback_individualization/PRIMARY_INDIVIDUALIZATION_CONTRACT_V1.md"\n      - "prospective/auditory_feedback_individualization/INTERPRETATION_LEDGER_V1.md"\n      - "prospective/auditory_feedback_individualization/run_individualization_primary_v1.m"\n      - "prospective/auditory_feedback_individualization/PAF_SCHEMA_AUDIT_V2.json"\n      - ".github/workflows/auditory-feedback-individualization-primary-v1.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: write\n\nconcurrency:\n  group: auditory-feedback-individualization-primary\n  cancel-in-progress: true\n\njobs:\n  primary:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: prospective/auditory-feedback-individualization-v1\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - name: Verify schema gate\n        run: |\n          python - <<'PY'\n          import json\n          p="prospective/auditory_feedback_individualization/PAF_SCHEMA_AUDIT_V2.json"\n          x=json.load(open(p))\n          assert x["table_height"]==28091\n          assert x["feature_count"]==28\n          assert len(x["bats"])==10\n          print("PASS schema gate")\n          PY\n      - name: Download frozen PAF source\n        run: python prospective/auditory_feedback_individualization/download_paf_for_schema_v2.py\n      - uses: matlab-actions/setup-matlab@v2\n      - name: Run frozen 120-assignment primary\n        uses: matlab-actions/run-command@v2\n        with:\n          command: addpath('prospective/auditory_feedback_individualization'); run_individualization_primary_v1\n      - name: Commit result receipt\n        run: |\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add prospective/auditory_feedback_individualization/PRIMARY_RESULT_V1.json\n          git add prospective/auditory_feedback_individualization/PRIMARY_RESULT_V1.md\n          if git diff --cached --quiet; then\n            echo "No result changes"\n          else\n            git commit -m "Record randomized auditory-feedback individualization result"\n            git fetch origin prospective/auditory-feedback-individualization-v1\n            git rebase origin/prospective/auditory-feedback-individualization-v1\n            git push origin HEAD:prospective/auditory-feedback-individualization-v1\n          fi\n