name: Fixed GBIF snapshot profile validation A B
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/fixed_snapshot_profile_validation_v1.py
      - .github/workflows/gvsm-fixed-snapshot-profile-validation.yml
permissions:
  contents: read
  actions: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: europe-common-forest-support-v1
          run-id: 45585033345
          github-token: ${{ github.token }}
          path: pilot
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-fixed-snapshot-environment
          run-id: 45591426116
          github-token: ${{ github.token }}
          path: environment
      - uses: actions/download-artifact@v4
        with:
          name: gvsm-fixed-snapshot-observation-audit
          run-id: 45593509220
          github-token: ${{ github.token }}
          path: audit
      - uses: actions/download-artifact@v4
        with:
          name: gedi-macro-iberia-join
          run-id: 45575962660
          github-token: ${{ github.token }}
          path: traits
      - run: python -m pip install numpy pandas scipy
      - run: python prospective/gedi_trait_macro_sdm/fixed_snapshot_profile_validation_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-snapshot-profile-validation-v1
          path: fixed_profile_validation/
          if-no-files-found: error
          retention-days: 90
