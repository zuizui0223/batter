name: partitioning-s-calibration-v1

on:
  push:
    branches:
      - post-freeze/partitioning-calibration-v1
    paths:
      - "post_freeze_extensions/3d_niche_partition/run_partitioning_s_calibration_v1.py"
      - "post_freeze_extensions/3d_niche_partition/partitioning_calibration_contract_v1.json"
      - ".github/workflows/partitioning-s-calibration-v1.yml"
  pull_request:
    branches:
      - post-freeze/3d-niche-partition-v1
  workflow_dispatch:

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        panel: [hypsignathus, phyllostomus_2022, phyllostomus_2023, phyllostomus_2016]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pandas requests pyproj
      - name: Run inherited-null S calibration
        run: python post_freeze_extensions/3d_niche_partition/run_partitioning_s_calibration_v1.py --panel "${{ matrix.panel }}"
      - uses: actions/upload-artifact@v4
        with:
          name: partitioning-s-calibration-${{ matrix.panel }}-v1
          path: post_freeze_extensions/3d_niche_partition/original_terrain_results/${{ matrix.panel }}_terrain_geometry_result_v1.json
          if-no-files-found: error
