name: peer-plus-past-forecast-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/peer_plus_past_forecast_v1.py
      - prospective/field_policy_bridge/PEER_PLUS_PAST_FORECAST_V1.md
      - .github/workflows/peer-plus-past-forecast-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dependencies
        run: |
          python -m pip install --quiet -e .
          python -m pip install --quiet numpy pandas scipy pyproj
      - name: Run peer-plus-past field forecast
        shell: bash
        run: |
          set -euo pipefail
          python prospective/field_policy_bridge/peer_plus_past_forecast_v1.py | tee prospective/field_policy_bridge/PEER_PLUS_PAST_FORECAST_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peer-plus-past-forecast-v1
          path: prospective/field_policy_bridge/PEER_PLUS_PAST_FORECAST_RESULT_V1.json
          if-no-files-found: warn
