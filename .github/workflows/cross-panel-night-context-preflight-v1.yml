name: cross-panel-night-context-preflight-v1

on:
  push:
    branches:
      - exploratory/cross-panel-night-context-v1
    paths:
      - "post_freeze_extensions/cross_panel_night_context/**"
      - ".github/workflows/cross-panel-night-context-preflight-v1.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run x-y-time same-night feasibility preflight
        run: python post_freeze_extensions/cross_panel_night_context/preflight_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-cross-panel-night-context-preflight-v1
          path: |
            post_freeze_extensions/cross_panel_night_context/preflight_result_v1.json
            post_freeze_extensions/cross_panel_night_context/PREFLIGHT_RESULT_V1.md
          if-no-files-found: error
