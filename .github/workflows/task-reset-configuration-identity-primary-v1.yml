name: task-reset-configuration-identity-primary-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/configuration_identity_primary_v1.py
      - prospective/task_reset_lockin/CONFIGURATION_CONDITIONED_IDENTITY_CONTRACT_V1.md
      - prospective/task_reset_lockin/PRIMARY_B_NULL_AMENDMENT_V1.md
      - prospective/task_reset_lockin/PRIMARY_B_STANDARDIZATION_AMENDMENT_V1.md
      - prospective/task_reset_lockin/ESTIMATOR_IMPLEMENTATION_APPENDIX_V1.md
      - .github/workflows/task-reset-configuration-identity-primary-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numeric dependency
        run: python -m pip install --quiet numpy
      - name: Contract self-check
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("prospective/task_reset_lockin/configuration_identity_primary_v1.py").read_text()
          required=[
            "202610042201","202610042202","N_PERM=9999",
            "Time (Seconds)","X","Y","Z",
            "STRUCT_A_ENVS","STRUCT_B_BATS",
          ]
          missing=[x for x in required if x not in p]
          if missing:
              raise SystemExit(f"contract self-check failed: {missing}")
          print("contract self-check PASS")
          PY
      - name: Run frozen primaries A and B
        run: |
          python prospective/task_reset_lockin/configuration_identity_primary_v1.py | tee prospective/task_reset_lockin/CONFIGURATION_IDENTITY_PRIMARY_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-reset-configuration-identity-primary-v1
          path: prospective/task_reset_lockin/CONFIGURATION_IDENTITY_PRIMARY_RESULT_V1.json
          if-no-files-found: warn
