name: peer-controlled-early-late-persistence-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/field_policy_bridge/peer_controlled_early_late_persistence_v1.py
      - prospective/field_policy_bridge/PEER_CONTROLLED_EARLY_LATE_PERSISTENCE_CONTRACT_V1.md
      - .github/workflows/peer-controlled-early-late-persistence-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --quiet -e .
      - name: Run peer-controlled early-late persistence test
        run: |
          python prospective/field_policy_bridge/peer_controlled_early_late_persistence_v1.py | tee prospective/field_policy_bridge/PEER_CONTROLLED_EARLY_LATE_PERSISTENCE_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peer-controlled-early-late-persistence-v1
          path: prospective/field_policy_bridge/PEER_CONTROLLED_EARLY_LATE_PERSISTENCE_RESULT_V1.json
          if-no-files-found: warn
