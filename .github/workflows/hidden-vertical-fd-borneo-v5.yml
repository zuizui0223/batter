name: Hidden vertical FD V5 Borneo public source gate
on:
  push:
    branches: [prospective/hidden-vertical-functional-diversity-20261127]
    paths: ['.github/workflows/hidden-vertical-fd-borneo-v5.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Public source hashes and schemas only
        shell: bash
        run: |
          python - <<'PY'
          import json, hashlib, urllib.request, urllib.parse, io, zipfile, csv, xml.etree.ElementTree as ET
          from pathlib import Path
          records = [5018280,7740421,4010757,7789416]
          cap = 20*1024*1024
          def request(url, limit):
              req=urllib.request.Request(url,headers={'User-Agent':'batter-public-source-audit/1.0','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  b=r.read(limit+1)
                  if len(b)>limit: raise ValueError('size limit')
                  return b
          def schema(name,b,depth=0):
              suffix=Path(name).suffix.lower()
              if suffix in ('.csv','.tsv','.txt'):
                  try: st=b.decode('utf-8-sig')
                  except UnicodeError: return {'encoding':'non-utf8'}
                  if suffix=='.txt': return {'text_lines':len(st.splitlines()),'content_not_exported':True}
                  try:
                      d=csv.Sniffer().sniff(st[:8192],delimiters=',;\t')
                      rows=csv.reader(io.StringIO(st),d); h=next(rows); n=0; bad=0
                      for row in rows:
                          n+=1; bad+=len(row)!=len(h)
                      # Header labels only; some count matrices have taxa or sites as columns.
                      # Avoid printing unreviewed labels that could contain IDs or coordinates.
                      return {'rows':n,'columns':len(h),'irregular_rows':bad,'header_sha256':hashlib.sha256(json.dumps(h).encode()).hexdigest()}
                  except Exception as e: return {'parse_error':type(e).__name__}
              if suffix in ('.xlsx','.zip'):
                  try:
                      with zipfile.ZipFile(io.BytesIO(b)) as z:
                          members=z.infolist()
                          if len(members)>1000 or sum(x.file_size for x in members)>100*1024*1024: return {'archive':'expansion limit'}
                          crc=z.testzip()
                          if suffix=='.xlsx':
                              ns={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
                              wb=ET.fromstring(z.read('xl/workbook.xml'))
                              return {'crc_ok':crc is None,'sheets':len(wb.findall('.//m:sheet',ns)),'worksheet_dimensions':[ET.fromstring(z.read(x.filename)).find('m:dimension',ns).get('ref') if ET.fromstring(z.read(x.filename)).find('m:dimension',ns) is not None else None for x in members if x.filename.startswith('xl/worksheets/sheet') and x.filename.endswith('.xml')]}
                          return {'crc_ok':crc is None,'members':len(members),'schemas':[{'suffix':Path(x.filename).suffix.lower(),'size':x.file_size,'sha256':hashlib.sha256(z.read(x)).hexdigest(),'schema':schema(x.filename,z.read(x),1) if depth==0 and Path(x.filename).suffix.lower() in ('.csv','.tsv','.xlsx','.txt') else None} for x in members if not x.is_dir() and x.file_size<=cap]}
                  except Exception as e:return {'archive_error':type(e).__name__}
              return {'format':suffix,'schema_not_parsed':True}
          out=[]
          for rid in records:
              rec={'id':rid,'files':[]}
              try:
                  data=json.loads(request(f'https://zenodo.org/api/records/{rid}',2*1024*1024))
                  if int(data['id'])!=rid: raise ValueError('record mismatch')
                  rec.update(title=data.get('metadata',{}).get('title'),doi=data.get('doi'),access=data.get('metadata',{}).get('access_right'))
                  used=0
                  for f in data.get('files',[]):
                      name=f['key']; size=int(f['size']); checksum=f.get('checksum',''); info={'name':name,'size':size,'published_checksum':checksum}
                      rec['files'].append(info)
                      if size>cap or used+size>50*1024*1024 or Path(name).suffix.lower() not in ('.csv','.tsv','.txt','.xlsx','.zip','.rds','.rdata','.xls'):
                          info['status']='skipped_format_or_size';continue
                      used+=size
                      try:
                          url=f['links']['self']; u=urllib.parse.urlparse(url)
                          if u.scheme!='https' or u.hostname not in ('zenodo.org','www.zenodo.org'): raise ValueError('nonofficial url')
                          if ':' not in checksum: raise ValueError('missing checksum')
                          alg,expected=checksum.split(':',1)
                          if alg not in ('md5','sha256'): raise ValueError('unsupported checksum')
                          b=request(url,cap)
                          if len(b)!=size or hashlib.new(alg,b).hexdigest()!=expected: raise ValueError('checksum or length mismatch')
                          info.update(status='checksum_verified',sha256=hashlib.sha256(b).hexdigest(),schema=schema(name,b))
                      except Exception as e:info.update(status='not_acquired',error=str(e)[:180])
              except Exception as e:rec.update(status='metadata_not_acquired',error=str(e)[:180])
              out.append(rec)
          Path('borneo_v5_source_gate.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: borneo-v5-public-source-gate
          path: borneo_v5_source_gate.json
          retention-days: 14
