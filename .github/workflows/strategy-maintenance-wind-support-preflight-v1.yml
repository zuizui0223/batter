name: strategy-maintenance-wind-support-preflight-v1
on:
  push:
    branches: [post-freeze/strategy-maintenance-preflight-v1]
    paths:
      - "post_freeze_extensions/strategy_maintenance/wind_support_preflight_v1.py"
      - "post_freeze_extensions/strategy_maintenance/CONTRACT_V1.md"
      - ".github/workflows/strategy-maintenance-wind-support-preflight-v1.yml"
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pandas pyproj "xarray[io]" icechunk pcodec
      - name: Run ERA5 wind support preflight
        run: python post_freeze_extensions/strategy_maintenance/wind_support_preflight_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-maintenance-wind-support-preflight-v1
          path: |
            post_freeze_extensions/strategy_maintenance/wind_support_preflight_v1.json
            post_freeze_extensions/strategy_maintenance/WIND_SUPPORT_PREFLIGHT_V1.md
          if-no-files-found: error
