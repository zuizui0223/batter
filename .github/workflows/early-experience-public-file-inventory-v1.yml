name: early-experience-public-file-inventory-v1

on:
  push:
    paths:
      - "prospective/early_experience_specialization/PRIMARY_CONTRACT_V1.md"
      - "prospective/early_experience_specialization/public_file_inventory_v1.py"
      - ".github/workflows/early-experience-public-file-inventory-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/early-experience-specialization-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Inventory public dataset
        run: python prospective/early_experience_specialization/public_file_inventory_v1.py
      - name: Commit inventory receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/early_experience_specialization/PUBLIC_FILE_INVENTORY_V1.json
          git add prospective/early_experience_specialization/PUBLIC_FILE_INVENTORY_V1.md
          if git diff --cached --quiet; then
            echo "No inventory changes"
          else
            git commit -m "Record early-experience public file inventory"
            git push
          fi
