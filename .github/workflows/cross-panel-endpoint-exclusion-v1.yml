name: cross-panel-endpoint-exclusion-v1

on:
  push:
    branches:
      - diagnostic/cross-panel-confound-audit-v1
    paths:
      - "contract/cross_panel_endpoint_exclusion_v1.json"
      - "CROSS_PANEL_ENDPOINT_EXCLUSION_CONTRACT.md"
      - "CROSS_PANEL_CONFOUND_AUDIT_FREEZE_V1.md"
      - "scripts/run_cross_panel_endpoint_exclusion.py"
      - "scripts/run_cross_panel_estimator_calibration.py"
      - "scripts/run_new_species_replications.py"
      - "scripts/run_eidolon_independent_replication.py"
      - ".github/workflows/cross-panel-endpoint-exclusion-v1.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  endpoint-exclusion:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        panel:
          - eidolon
          - hypsignathus
          - phyllostomus_2022
          - phyllostomus_2023
          - phyllostomus_2016
        radius: [1000, 500, 2000]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run frozen endpoint-exclusion audit
        run: python scripts/run_cross_panel_endpoint_exclusion.py --panel ${{ matrix.panel }} --radius ${{ matrix.radius }}
      - uses: actions/upload-artifact@v4
        with:
          name: endpoint-${{ matrix.panel }}-${{ matrix.radius }}m-v1
          path: results/cross_panel_endpoint_exclusion_${{ matrix.panel }}_${{ matrix.radius }}m_v1.json
          if-no-files-found: error
