name: four-route-skill-feedback-v1
on:
  push:
    branches:
      - prospective/four-route-skill-feedback-v1
    paths:
      - "prospective/solution_repertoire_experiment/four_route_skill_feedback_v1.py"
      - ".github/workflows/four-route-skill-feedback-v1.yml"
  workflow_dispatch:
jobs:
  analytic-and-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Match inspected scientific runtime
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0'
      - name: Verify immutable simulation implementation
        run: |
          printf '%s\n' 'd2013afc5407597c288a6eb035cfcfab83628f5dae4b8de4e4c985c51a5928ae  prospective/solution_repertoire_experiment/four_route_skill_feedback_v1.py' | sha256sum -c -
      - name: Verify theorem and route-transfer synthetic invariants
        run: python prospective/solution_repertoire_experiment/four_route_skill_feedback_v1.py --self-test
      - name: Recalculate all locked phase branches and 3 synthetic transfer models
        run: |
          python prospective/solution_repertoire_experiment/four_route_skill_feedback_v1.py --out FOUR_ROUTE_SKILL_FEEDBACK_RESULT_V1.json
          printf '%s\n' 'e52bd060332018c471cccec38b668204027f0158956c3f58b438baf28ad73657  FOUR_ROUTE_SKILL_FEEDBACK_RESULT_V1.json' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: four-route-skill-feedback-v1
          path: FOUR_ROUTE_SKILL_FEEDBACK_RESULT_V1.json
          if-no-files-found: error
