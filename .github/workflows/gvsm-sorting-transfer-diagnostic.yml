name: GVSM pilot sorting transfer diagnosis
on:
  push:
    branches: [prospective/gedi-trait-macro-sdm-20261125]
    paths:
      - prospective/gedi_trait_macro_sdm/sorting_transfer_diagnostic_v1.py
      - .github/workflows/gvsm-sorting-transfer-diagnostic.yml
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: europe-common-forest-support-v1
          run-id: 45585033345
          github-token: ${{ github.token }}
          path: common_forest
      - run: python -m pip install numpy pandas scipy
      - run: python prospective/gedi_trait_macro_sdm/sorting_transfer_diagnostic_v1.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gvsm-sorting-transfer-diagnostic
          path: sorting_transfer_diagnostic/
          if-no-files-found: error
