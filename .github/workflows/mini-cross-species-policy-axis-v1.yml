name: mini-cross-species-policy-axis-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/cross_species_policy_axis_v1.py
      - prospective/task_reset_lockin/CROSS_SPECIES_POLICY_AXIS_CONTRACT_V1.md
      - prospective/task_reset_lockin/CROSS_SPECIES_STANDARDIZATION_AMENDMENT_V1.md
      - .github/workflows/mini-cross-species-policy-axis-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-species:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy
      - name: Apply Rhino policy axes to Miniopterus
        run: |
          python prospective/task_reset_lockin/cross_species_policy_axis_v1.py | tee prospective/task_reset_lockin/CROSS_SPECIES_POLICY_AXIS_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: mini-cross-species-policy-axis-v1
          path: prospective/task_reset_lockin/CROSS_SPECIES_POLICY_AXIS_RESULT_V1.json
          if-no-files-found: error
