name: independent-replication-repository-inventory-v1
on:
  push:
    branches: [study/individual-vertical-strategies-v1]
    paths:
      - "scripts/inventory_replication_candidates.py"
      - ".github/workflows/independent-replication-inventory.yml"
  workflow_dispatch:
jobs:
  inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/inventory_replication_candidates.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-independent-replication-repository-inventory-v1
          path: results/independent_replication_repository_inventory_v1.json
