name: jae-submission-v0.3.5

on:
  push:
    branches:
      - diagnostic/cross-panel-confound-audit-v1
    paths:
      - "manuscript/MANUSCRIPT_DRAFT_V0_3_5.md"
      - "manuscript/TITLE_PAGE_TEMPLATE_V0_3_5.md"
      - "results/calibrated_vertical_identity_v0_3_5.csv"
      - "results/endpoint_exclusion_v0_3_5.csv"
      - "results/individual_vertical_strategy_result_v1.json"
      - "results/spatial_interaction_refinement_result_v2.json"
      - "scripts/check_jae_submission_v0_3_5.py"
      - "scripts/plot_jae_v0_3_5_figures.py"
      - ".github/workflows/jae-submission-v0.3.5.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  submission-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[figure]"
      - name: Check JAE v0.3.5 manuscript gates
        run: python scripts/check_jae_submission_v0_3_5.py
      - name: Build JAE v0.3.5 figures
        run: python scripts/plot_jae_v0_3_5_figures.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-jae-v0-3-5-figures
          path: figures/submission_v0_3_5/
          if-no-files-found: error
