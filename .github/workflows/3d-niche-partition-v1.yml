name: 3d-niche-partition-v1

on:
  push:
    branches:
      - post-freeze/3d-niche-partition-v1
    paths:
      - "post_freeze_extensions/3d_niche_partition/CONTRACT_V1.md"
      - "post_freeze_extensions/3d_niche_partition/contract_v1.json"
      - "post_freeze_extensions/3d_niche_partition/run_v1.py"
      - ".github/workflows/3d-niche-partition-v1.yml"
      - "scripts/run_tag_altitude_bias_shape.py"
      - "scripts/run_cross_panel_estimator_calibration.py"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        panel:
          - tadarida
          - eidolon
          - hypsignathus
          - phyllostomus_2022
          - phyllostomus_2023
          - phyllostomus_2016
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run pre-specified 3D overlap decomposition
        run: python post_freeze_extensions/3d_niche_partition/run_v1.py --panel "${{ matrix.panel }}"
      - uses: actions/upload-artifact@v4
        with:
          name: 3d-niche-partition-${{ matrix.panel }}-v1
          path: post_freeze_extensions/3d_niche_partition/results/${{ matrix.panel }}_result_v1.json
          if-no-files-found: error
