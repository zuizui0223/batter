name: source-b-matlab-coordinate-support-v1

on:
  push:
    branches:
      - prospective/ontogenetic-path-dependence-v1
    paths:
      - prospective/ontogenetic_path_dependence/SOURCE_B_MATLAB_NATIVE_READER_AMENDMENT_V1.md
      - prospective/ontogenetic_path_dependence/download_source_b_matlab_structural_v1.py
      - prospective/ontogenetic_path_dependence/source_b_matlab_coordinate_support_v1.m
      - .github/workflows/source-b-matlab-coordinate-support-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matlab-coordinate-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download identity-verified ordinary cohort files
        run: python prospective/ontogenetic_path_dependence/download_source_b_matlab_structural_v1.py
      - name: Guard structural-only MATLAB code
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("prospective/ontogenetic_path_dependence/source_b_matlab_coordinate_support_v1.m").read_text()
          banned=["pdist","knnsearch","corr(","corrcoef","spearman","plot(","scatter(","histogram(","fitlm","fitlme"]
          hits=[x for x in banned if x in p]
          if hits:
              raise SystemExit(f"primary-outcome guard failed: {hits}")
          for need in ["tr.x","tr.y","tr.time","n_valid_movement_days"]:
              if need not in p:
                  raise SystemExit(f"required frozen semantic missing: {need}")
          print("structural-only MATLAB guard PASS")
          PY
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
      - name: Run MATLAB-native coordinate structural gate
        uses: matlab-actions/run-command@v2
        with:
          command: addpath("prospective/ontogenetic_path_dependence"), source_b_matlab_coordinate_support_v1
      - uses: actions/upload-artifact@v4
        with:
          name: source-b-matlab-coordinate-support-v1
          path: prospective/ontogenetic_path_dependence/matlab_structural/SOURCE_B_MATLAB_COORDINATE_SUPPORT_RESULT_V1.csv
          if-no-files-found: error
