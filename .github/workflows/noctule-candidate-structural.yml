name: noctule-candidate-structural-v1

on:
  push:
    branches:
      - study/individual-vertical-strategies-v1
    paths:
      - "scripts/preflight_noctule_candidates.py"
      - ".github/workflows/noctule-candidate-structural.yml"
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/preflight_noctule_candidates.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-noctule-candidate-structural-v1
          path: results/noctule_candidate_structural_v1.json
