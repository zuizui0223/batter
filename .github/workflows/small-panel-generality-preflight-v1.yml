name: small-panel-generality-preflight-v1
on:
  push:
    branches: [prospective/small-panel-generality-v1]
    paths:
      - "post_freeze_extensions/small_panel_generality/**"
      - ".github/workflows/small-panel-generality-preflight-v1.yml"
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas numpy requests pyproj
      - name: Compile frozen small-panel preflight
        run: python -m py_compile post_freeze_extensions/small_panel_generality/run_preflight_v1.py
      - name: Run nonvertical small-panel preflight
        run: python post_freeze_extensions/small_panel_generality/run_preflight_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: batter-small-panel-generality-preflight-v1
          path: |
            post_freeze_extensions/small_panel_generality/preflight_result_v1.json
            post_freeze_extensions/small_panel_generality/PREFLIGHT_RESULT_V1.md
            post_freeze_extensions/small_panel_generality/height_opening_receipt_v1.json
          if-no-files-found: error
      - name: Pin nonvertical small-panel receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             post_freeze_extensions/small_panel_generality/preflight_result_v1.json             post_freeze_extensions/small_panel_generality/PREFLIGHT_RESULT_V1.md             post_freeze_extensions/small_panel_generality/height_opening_receipt_v1.json
          if git diff --cached --quiet; then
            echo "No preflight changes"
          else
            git commit -m "Record small-panel outcome-blind preflight receipt"
            git push origin HEAD:prospective/small-panel-generality-v1
          fi
