name: rhino-latent-policy-identity1-fast-v1

on:
  push:
    branches:
      - prospective/task-reset-lockin-v1
    paths:
      - prospective/task_reset_lockin/latent_policy_identity1_calibration_fast_v1.py
      - .github/workflows/rhino-latent-policy-identity1-fast-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy
      - name: Calibrate one-dimensional training-only identity axis
        run: |
          python prospective/task_reset_lockin/latent_policy_identity1_calibration_fast_v1.py | tee prospective/task_reset_lockin/LATENT_POLICY_IDENTITY1_FAST_RESULT_V1.json
      - uses: actions/upload-artifact@v4
        with:
          name: rhino-latent-policy-identity1-fast-v1
          path: prospective/task_reset_lockin/LATENT_POLICY_IDENTITY1_FAST_RESULT_V1.json
          if-no-files-found: error
