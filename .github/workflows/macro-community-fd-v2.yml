name: Macro community FD V2 geographic traits
on:
  push:
    branches: [prospective/macro-community-fd-20261127]
    paths: ['.github/workflows/macro-community-fd-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical runtime
        run: |
          python -m pip install --only-binary=:all: numpy==2.2.6 pandas==2.2.3 requests==2.32.5
      - name: Run frozen geographic trait null
        env:
          GH_TOKEN: ${{ github.token }}
        run: python prospective/macro_community_fd/macro_fd_v2_geography.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-community-fd-v2-aggregate
          path: macro_fd_v2_result.json
          retention-days: 30
          if-no-files-found: error
