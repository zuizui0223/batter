name: auditory-perturbation-frozen-primary-v1

on:
  push:
    paths:
      - "prospective/auditory_perturbation_policy/ACOUSTIC_POLICY_PRIMARY_V1.md"
      - "prospective/auditory_perturbation_policy/acoustic_policy_primary_v1.py"
      - "prospective/auditory_perturbation_policy/acoustic_policy_primary_self_test_v1.py"
      - ".github/workflows/auditory-perturbation-frozen-primary-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frozen-primary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prospective/auditory-perturbation-policy-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical readers
        run: python -m pip install numpy scipy
      - name: Verify frozen identity statistic
        run: python prospective/auditory_perturbation_policy/acoustic_policy_primary_self_test_v1.py
      - name: Re-run structural gate
        run: python prospective/auditory_perturbation_policy/structural_audit_v1.py
      - name: Enforce structural PASS
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path("prospective/auditory_perturbation_policy/STRUCTURAL_RESULT_V1.json")
          x=json.loads(p.read_text())
          print("structural verdict:",x.get("verdict"))
          if x.get("verdict")!="PASS_OPEN_NUMERIC_PRIMARY":
              sys.exit("STOP: structural gate did not pass")
          PY
      - name: Run frozen numeric primary once
        run: python prospective/auditory_perturbation_policy/acoustic_policy_primary_v1.py
      - name: Commit frozen receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prospective/auditory_perturbation_policy/STRUCTURAL_RESULT_V1.json
          git add prospective/auditory_perturbation_policy/STRUCTURAL_RESULT_V1.md
          git add prospective/auditory_perturbation_policy/ACOUSTIC_POLICY_RESULT_V1.json
          git add prospective/auditory_perturbation_policy/ACOUSTIC_POLICY_RESULT_V1.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Record frozen auditory perturbation primary"
            git push
          fi
