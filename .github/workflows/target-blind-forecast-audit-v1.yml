name: target-blind-forecast-audit-v1
on:
  push:
    branches: [post-freeze/target-blind-forecast-audit-v1]
    paths:
      - "prospective/task_reset_lockin/TARGET_BLIND_FORECAST_AUDIT_CONTRACT_V1.md"
      - "prospective/task_reset_lockin/target_blind_forecast_audit_v1.py"
      - ".github/workflows/target-blind-forecast-audit-v1.yml"
  workflow_dispatch:
jobs:
  target-blind-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Check target and peer reference invariance using synthetic data
        run: python prospective/task_reset_lockin/target_blind_forecast_audit_v1.py --self-test
      - name: Evaluate both frozen predictive endpoints
        run: python prospective/task_reset_lockin/target_blind_forecast_audit_v1.py --out target_blind_forecast_audit_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: target-blind-forecast-audit-v1
          path: target_blind_forecast_audit_v1.json
          if-no-files-found: error
