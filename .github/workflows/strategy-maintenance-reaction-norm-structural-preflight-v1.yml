name: strategy-maintenance-reaction-norm-structural-preflight-v1
on:
  push:
    branches: [post-freeze/strategy-maintenance-preflight-v1]
    paths:
      - "post_freeze_extensions/strategy_maintenance/reaction_norm_structural_preflight_v1.py"
      - "post_freeze_extensions/strategy_maintenance/reaction_norm_contract_v1.json"
      - ".github/workflows/strategy-maintenance-reaction-norm-structural-preflight-v1.yml"
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e . pandas pyproj "xarray[io]" icechunk pcodec
      - run: python post_freeze_extensions/strategy_maintenance/reaction_norm_structural_preflight_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-maintenance-reaction-norm-structural-preflight-v1
          path: |
            post_freeze_extensions/strategy_maintenance/reaction_norm_structural_preflight_v1.json
            post_freeze_extensions/strategy_maintenance/REACTION_NORM_STRUCTURAL_PREFLIGHT_V1.md
          if-no-files-found: error
