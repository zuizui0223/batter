<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490" role="img" aria-labelledby="title desc">
<title id="title">From vertical environmental descriptors to conditional recorded-label prediction</title>
<desc id="desc">A conceptual diagram, not measurements: forests with equal scalar height and cover can have different relative return-height profiles. Two recorded species labels and two recorded cells are conditioned on in a paired allocation model. The score does not identify absolute occupancy or actual flight altitude.</desc>
<rect width="1080" height="490" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#162938">
<text x="24" y="34" font-size="23" font-weight="700">Vertical environment, recorded labels, and inference</text>
<text x="24" y="58" font-size="13" fill="#526475">Conceptual illustration of the fitted prediction target; no empirical height profiles are depicted.</text>
<g transform="translate(24 84)">
<rect width="320" height="340" rx="9" fill="#f6f8fa" stroke="#d3dce4"/>
<text x="16" y="27" font-size="16" font-weight="700">A  Environmental descriptors</text>
<text x="16" y="49" font-size="12" fill="#526475">Same scalar height and tree cover</text>
<path d="M35 203V75 M35 203H147 M173 203V75 M173 203H285" stroke="#5b6c77" stroke-width="1.4" fill="none"/>
<path d="M35 83H285" stroke="#97a5ad" stroke-dasharray="4 4"/>
<path d="M38 202C47 185 44 161 75 145C113 124 128 111 109 95C91 79 62 86 38 89Z" fill="#8bb6ad" opacity=".8"/>
<path d="M176 202C222 197 258 181 250 158C244 135 196 125 201 109C206 95 233 84 176 89Z" fill="#8bb6ad" opacity=".8"/>
<path d="M35 124H124 M173 164H253" stroke="#185965" stroke-dasharray="4 3" stroke-width="2"/>
<text x="41" y="77" font-size="10" fill="#526475">RH98</text><text x="182" y="77" font-size="10" fill="#526475">RH98</text>
<text x="41" y="119" font-size="10" fill="#185965">RH50</text><text x="181" y="159" font-size="10" fill="#185965">RH50</text>
<text x="91" y="222" text-anchor="middle" font-size="12">Cell x</text><text x="229" y="222" text-anchor="middle" font-size="12">Cell y</text>
<text x="16" y="250" font-size="13" font-weight="700">R50 = mean RH50 / mean RH98</text>
<text x="16" y="273" font-size="12">Relative predicted return-height proxy</text>
<text x="16" y="296" font-size="12" fill="#526475">Not vegetation density, air volume,</text><text x="16" y="313" font-size="12" fill="#526475">or observed bat flight height.</text>
</g>
<g transform="translate(380 84)">
<rect width="320" height="340" rx="9" fill="#f6f8fa" stroke="#d3dce4"/>
<text x="16" y="27" font-size="16" font-weight="700">B  Conditional comparison</text>
<text x="16" y="49" font-size="12" fill="#526475">Same provider, year and spatial block</text>
<g font-size="13" text-anchor="middle">
<rect x="31" y="73" width="112" height="62" rx="6" fill="#fff" stroke="#becbd5"/><rect x="177" y="73" width="112" height="62" rx="6" fill="#fff" stroke="#becbd5"/>
<text x="87" y="92">Cell x</text><text x="233" y="92">Cell y</text>
<circle cx="87" cy="115" r="13" fill="#185965"/><text x="87" y="119" fill="#fff" font-weight="700">s</text>
<circle cx="233" cy="115" r="13" fill="#9b5a39"/><text x="233" y="119" fill="#fff" font-weight="700">t</text>
<text x="160" y="153" fill="#526475" font-size="11">versus swapped orientation</text>
<rect x="31" y="165" width="112" height="62" rx="6" fill="#fff" stroke="#becbd5"/><rect x="177" y="165" width="112" height="62" rx="6" fill="#fff" stroke="#becbd5"/>
<text x="87" y="184">Cell x</text><text x="233" y="184">Cell y</text>
<circle cx="87" cy="207" r="13" fill="#9b5a39"/><text x="87" y="211" fill="#fff" font-weight="700">t</text>
<circle cx="233" cy="207" r="13" fill="#185965"/><text x="233" y="211" fill="#fff" font-weight="700">s</text>
</g>
<text x="16" y="253" font-size="12" font-weight="700">Δ = fₛ(x) − fₜ(x) − fₛ(y) + fₜ(y)</text>
<text x="16" y="275" font-size="12">Compare held-out log sigmoid(Δ)</text>
<text x="16" y="296" font-size="12" fill="#526475">Condition on cells and labels;</text><text x="16" y="313" font-size="12" fill="#526475">unreported taxa are not absences.</text>
</g>
<g transform="translate(736 84)">
<rect width="320" height="340" rx="9" fill="#f6f8fa" stroke="#d3dce4"/>
<text x="16" y="27" font-size="16" font-weight="700">C  Scope of inference</text>
<rect x="16" y="53" width="288" height="63" rx="6" fill="#e5efee"/>
<text x="29" y="74" font-size="13" font-weight="700">Identified prediction target</text><text x="29" y="93" font-size="12">Relative allocation of recorded labels</text><text x="29" y="107" font-size="12">on common observed support</text>
<path d="M160 121v18m-5-5 5 5 5-5" stroke="#7b8c98" stroke-width="1.7" fill="none"/>
<rect x="16" y="145" width="288" height="79" rx="6" fill="#fff" stroke="#becbd5"/>
<text x="29" y="167" font-size="13" font-weight="700">Observation process</text><text x="29" y="186" font-size="12">Species-specific detection may vary</text><text x="29" y="202" font-size="12">with location and vertical structure.</text>
<path d="M160 230v18m-5-5 5 5 5-5" stroke="#7b8c98" stroke-width="1.7" fill="none" stroke-dasharray="3 3"/>
<rect x="16" y="254" width="288" height="67" rx="6" fill="#fff" stroke="#b88270"/>
<text x="29" y="275" font-size="13" font-weight="700" fill="#82442e">Not identified</text><text x="29" y="294" font-size="12">Absolute occupancy, causal filtering,</text><text x="29" y="310" font-size="12">or altitude-specific utilization.</text>
</g>
<path d="M350 252h24m-7-6 7 6-7 6M706 252h24m-7-6 7 6-7 6" fill="none" stroke="#637786" stroke-width="2"/>
<text x="24" y="453" font-size="12" fill="#526475">The score cancels additive species intercepts and common cell terms, but unknown species-by-cell observation effects need not cancel.</text>
<text x="24" y="471" font-size="12" fill="#526475">Vertical structure is an environmental predictor, not a measured distribution of animals in three dimensions.</text>
</g></svg>