<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img"><title>Incremental profile prediction by evaluation design</title><desc>Dots show supported validation fold gains, diamonds show equal-block mean, and the northern interval is a conditional block bootstrap range. The first three designs overlap in observations.</desc><rect width="1080" height="430" fill="#fff"/><g font-family="Arial, sans-serif" fill="#172534"><text x="26" y="33" font-size="22" font-weight="bold">Incremental predictive information in vertical forest profiles</text><text x="26" y="59" font-size="13" fill="#526475">B2 minus B1 for known-species label allocation; positive values favor adding R50.</text><line x1="407" y1="84" x2="407" y2="332" stroke="#dbe4ec" stroke-width="1"/><text x="407" y="354" text-anchor="middle" font-size="12">-0.01</text><line x1="481" y1="84" x2="481" y2="332" stroke="#24364b" stroke-width="1.8"/><text x="481" y="354" text-anchor="middle" font-size="12">0</text><line x1="555" y1="84" x2="555" y2="332" stroke="#dbe4ec" stroke-width="1"/><text x="555" y="354" text-anchor="middle" font-size="12">0.01</text><line x1="629" y1="84" x2="629" y2="332" stroke="#dbe4ec" stroke-width="1"/><text x="629" y="354" text-anchor="middle" font-size="12">0.02</text><line x1="704" y1="84" x2="704" y2="332" stroke="#dbe4ec" stroke-width="1"/><text x="704" y="354" text-anchor="middle" font-size="12">0.03</text><line x1="778" y1="84" x2="778" y2="332" stroke="#dbe4ec" stroke-width="1"/><text x="778" y="354" text-anchor="middle" font-size="12">0.04</text><line x1="852" y1="84" x2="852" y2="332" stroke="#dbe4ec" stroke-width="1"/><text x="852" y="354" text-anchor="middle" font-size="12">0.05</text><line x1="926" y1="84" x2="926" y2="332" stroke="#dbe4ec" stroke-width="1"/><text x="926" y="354" text-anchor="middle" font-size="12">0.06</text><text x="26" y="103" font-size="14" font-weight="bold">Pilot: withheld blocks</text><text x="26" y="123" font-size="11" fill="#526475">14 taxa; 51 blocks</text><circle cx="570" cy="103" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="609" cy="110" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="569" cy="117" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="545" cy="103" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="649" cy="110" r="3.6" fill="#558e9a" opacity=".72"/><path d="M588 102l8 8 -8 8 -8 -8Z" fill="#185965" stroke="#fff" stroke-width="1"/><text x="1000" y="115" font-size="13" text-anchor="middle" font-weight="bold">+0.01440</text><text x="26" y="168" font-size="14" font-weight="bold">Pilot: withheld providers and blocks</text><text x="26" y="188" font-size="11" fill="#526475">48 blocks; 92.6% pair coverage</text><circle cx="527" cy="168" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="571" cy="175" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="524" cy="182" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="794" cy="168" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="592" cy="175" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="632" cy="182" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="502" cy="168" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="503" cy="175" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="488" cy="182" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="901" cy="168" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="576" cy="175" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="611" cy="182" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="499" cy="168" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="653" cy="175" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="664" cy="182" r="3.6" fill="#558e9a" opacity=".72"/><path d="M577 167l8 8 -8 8 -8 -8Z" fill="#185965" stroke="#fff" stroke-width="1"/><text x="1000" y="180" font-size="13" text-anchor="middle" font-weight="bold">+0.01297</text><text x="26" y="233" font-size="14" font-weight="bold">Fixed snapshot: withheld blocks</text><text x="26" y="253" font-size="11" fill="#526475">14 taxa; 50 blocks; overlapping archive</text><circle cx="538" cy="233" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="566" cy="240" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="530" cy="247" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="556" cy="233" r="3.6" fill="#558e9a" opacity=".72"/><circle cx="580" cy="240" r="3.6" fill="#558e9a" opacity=".72"/><path d="M554 232l8 8 -8 8 -8 -8Z" fill="#185965" stroke="#fff" stroke-width="1"/><text x="1000" y="245" font-size="13" text-anchor="middle" font-weight="bold">+0.00984</text><text x="26" y="298" font-size="14" font-weight="bold">Disjoint northern transfer</text><text x="26" y="318" font-size="11" fill="#526475">10 known taxa; 28 blocks; extrapolative RH</text><line x1="403" x2="520" y1="305" y2="305" stroke="#964d39" stroke-width="2.2"/><line x1="403" x2="403" y1="299" y2="311" stroke="#964d39"/><line x1="520" x2="520" y1="299" y2="311" stroke="#964d39"/><path d="M462 297l8 8 -8 8 -8 -8Z" fill="#964d39" stroke="#fff" stroke-width="1"/><text x="1000" y="310" font-size="13" text-anchor="middle" font-weight="bold">-0.00259</text><text x="648" y="376" font-size="13" text-anchor="middle">Held-out log-score increment (nats per composite comparison)</text><text x="26" y="404" font-size="12" fill="#526475">Dots: fold estimates, not confidence intervals. Diamonds: block-weighted mean. Northern bar: conditional 95% bootstrap range.</text><text x="26" y="420" font-size="12" fill="#526475">The pilot and fixed snapshot overlap substantially; northern evaluation is provider- and block-disjoint, but RH is extrapolative.</text></g></svg>