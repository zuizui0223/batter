[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batter"
version = "0.1.0"
description = "Repeatability tests for individual vertical flight-use strategies in bats"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyproj>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
