<text x="500" y="415" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">A thick population niche can contain repeatable, non-exchangeable individual signatures</text>
<text x="500" y="454" text-anchor="middle" font-family="Arial" font-size="14">No single altitude, horizontal, or individual×location component fully explains the signature</text>
