<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111} .axis{stroke:#111;stroke-width:1.2} .box{fill:#fff;stroke:#111;stroke-width:1.4} .muted{fill:#555} .thin{stroke:#777;stroke-width:1} .pt{fill:#fff;stroke:#111;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="600" y="32" font-size="21" text-anchor="middle" class="">Post-hoc hypothesis generation: resource anchoring × vertical opportunity</text><rect x="60" y="75" width="230" height="85" rx="4" class="box"/><text x="175" y="105" font-size="14" text-anchor="middle" class=""><tspan x="175" dy="0">Persistent spatial</tspan><tspan x="175" dy="20">resource anchoring</tspan></text><rect x="60" y="205" width="230" height="85" rx="4" class="box"/><text x="175" y="235" font-size="14" text-anchor="middle" class=""><tspan x="175" dy="0">Repeated vertical</tspan><tspan x="175" dy="20">opportunity</tspan></text><rect x="365" y="140" width="255" height="95" rx="4" class="box"/><text x="492.5" y="170" font-size="14" text-anchor="middle" class=""><tspan x="492.5" dy="0">Stable alternative spatial</tspan><tspan x="492.5" dy="20">solutions repeatedly available</tspan></text><rect x="720" y="140" width="300" height="95" rx="4" class="box"/><text x="870" y="170" font-size="14" text-anchor="middle" class=""><tspan x="870" dy="0">Stronger expected expression</tspan><tspan x="870" dy="20">of centered vertical individuality</tspan></text><rect x="60" y="350" width="250" height="90" rx="4" class="box"/><text x="185" y="380" font-size="14" text-anchor="middle" class=""><tspan x="185" dy="0">Mobile / ephemeral prey</tspan><tspan x="185" dy="20">or surface-constrained feeding</tspan></text><rect x="385" y="350" width="230" height="90" rx="4" class="box"/><text x="500" y="380" font-size="14" text-anchor="middle" class=""><tspan x="500" dy="0">Fewer repeatable</tspan><tspan x="500" dy="20">vertical choices</tspan></text><rect x="720" y="350" width="300" height="90" rx="4" class="box"/><text x="870" y="380" font-size="14" text-anchor="middle" class=""><tspan x="870" dy="0">Weaker expected expression</tspan><tspan x="870" dy="20">of centered vertical individuality</tspan></text><line x1="290" y1="118" x2="357" y2="155" class="axis"/><polygon points="365,155 355,150 355,160" fill="#111"/><line x1="290" y1="248" x2="357" y2="180" class="axis"/><polygon points="365,180 355,175 355,185" fill="#111"/><line x1="620" y1="187" x2="712" y2="187" class="axis"/><polygon points="720,187 710,182 710,192" fill="#111"/><line x1="310" y1="395" x2="377" y2="395" class="axis"/><polygon points="385,395 375,390 375,400" fill="#111"/><line x1="615" y1="395" x2="712" y2="395" class="axis"/><polygon points="720,395 710,390 710,400" fill="#111"/><text x="1060" y="165" font-size="12" text-anchor="middle" class=""><tspan x="1060" dy="0">Competing predictors:</tspan><tspan x="1060" dy="18">wing morphology</tspan><tspan x="1060" dy="18">phylogeny / sensory ecology</tspan><tspan x="1060" dy="18">habitat structure</tspan><tspan x="1060" dy="18">atmospheric forcing</tspan><tspan x="1060" dy="18">tracking technology</tspan></text><text x="600" y="500" font-size="12" text-anchor="middle" class=""><tspan x="600" dy="0">Current systems generated this hypothesis; they are not fitted or scored as predictor observations.</tspan><tspan x="600" dy="18">Future confirmation uses only new sources coded before vertical outcomes are examined.</tspan></text></svg>