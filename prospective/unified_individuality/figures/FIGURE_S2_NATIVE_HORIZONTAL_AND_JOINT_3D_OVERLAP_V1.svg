<text x="62" y="117" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#657785">Original 500-m cells; native centered heights; 10 bins smoothed (alpha=0.5); NOT terrain corrected</text>
