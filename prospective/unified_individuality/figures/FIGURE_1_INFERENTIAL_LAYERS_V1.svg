<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="660" viewBox="0 0 1560 660" role="img" aria-label="One individuality, several empirical questions">
<title>One individuality, several empirical questions</title><desc>Conceptual diagram with separate empirical results and failed transfer from laboratory to wild settings.</desc>
<rect width="1560" height="660" fill="#FFFFFF"/>
<text x="46" y="61" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#1F2D3B" text-anchor="start" >One individuality, several empirical questions</text>
<text x="47" y="93" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#526679" text-anchor="start" >Parallel inferential layers across different bat systems (not a single demonstrated causal chain)</text>
<line x1="46" y1="110" x2="1514" y2="110" stroke="#D9E2E8" stroke-width="2" />
<rect x="47" y="155" width="350" height="265" rx="11" fill="#F4F7F9" stroke="#D9E2E8" stroke-width="1.5"/>
<rect x="47" y="155" width="350" height="7" rx="0" fill="#B17D35" stroke="none" stroke-width="0"/>
<text x="64" y="202" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1F2D3B" text-anchor="start" >01  FORMATION / HISTORY</text>
<text x="64" y="249" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#1F2D3B" text-anchor="start" >Late personal history informative</text>
<text x="64" y="280" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#1F2D3B" text-anchor="start" >Monotonic formation gate: FAIL</text>
<text x="64" y="311" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#1F2D3B" text-anchor="start" >Developmental total-dispersion rule:</text>
<text x="64" y="342" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#1F2D3B" text-anchor="start" >not supported</text>
<text x="64" y="395" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#526679" text-anchor="start" >BE juvenile and randomized experiments</text>
<rect x="430" y="155" width="350" height="265" rx="11" fill="#F4F7F9" stroke="#D9E2E8" stroke-width="1.5"/>
<rect x="430" y="155" width="350" height="7" rx="0" fill="#287E86" stroke="none" stroke-width="0"/>
<text x="447" y="202" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1F2D3B" text-anchor="start" >02  MAINTENANCE</text>
<text x="447" y="249" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#1F2D3B" text-anchor="start" >Identity correspondence retained</text>
<text x="447" y="280" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#1F2D3B" text-anchor="start" >across four controlled sensory</text>
<text x="447" y="311" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#1F2D3B" text-anchor="start" >and navigation programmes</text>
<text x="447" y="395" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#526679" text-anchor="start" >BE, biological n = 3–6 per programme</text>
<rect x="813" y="155" width="350" height="265" rx="11" fill="#F4F7F9" stroke="#D9E2E8" stroke-width="1.5"/>
<rect x="813" y="155" width="350" height="7" rx="0" fill="#245473" stroke="none" stroke-width="0"/>
<text x="830" y="202" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1F2D3B" text-anchor="start" >03  EXPRESSION / TRANSFER</text>
<text x="830" y="249" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#1F2D3B" text-anchor="start" >Coarse movement representation:</text>
<text x="830" y="280" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#1F2D3B" text-anchor="start" >transfers across tasks/systems</text>
<text x="830" y="311" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#1F2D3B" text-anchor="start" >Fixed detailed geometry: unsupported</text>
<text x="830" y="395" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#526679" text-anchor="start" >Rhinolophus and Carollia</text>
<rect x="1196" y="155" width="350" height="265" rx="11" fill="#F4F7F9" stroke="#D9E2E8" stroke-width="1.5"/>
<rect x="1196" y="155" width="350" height="7" rx="0" fill="#287E86" stroke="none" stroke-width="0"/>
<text x="1213" y="202" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1F2D3B" text-anchor="start" >04  FIELD CONSEQUENCE</text>
<text x="1213" y="249" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#1F2D3B" text-anchor="start" >Terrain-relative fidelity: 4/4</text>
<text x="1213" y="280" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#1F2D3B" text-anchor="start" >Positive added segregation: 0/4</text>
<text x="1213" y="311" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#1F2D3B" text-anchor="start" >Extra co-use separation: 1/4</text>
<text x="1213" y="395" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#526679" text-anchor="start" >JAE, 2 species / 4 field panels</text>
<line x1="397" y1="283" x2="430" y2="283" stroke="#A0B3BE" stroke-width="3" stroke-dasharray="5,7"/>
<line x1="780" y1="283" x2="813" y2="283" stroke="#A0B3BE" stroke-width="3" stroke-dasharray="5,7"/>
<line x1="1163" y1="283" x2="1196" y2="283" stroke="#A0B3BE" stroke-width="3" stroke-dasharray="5,7"/>
<rect x="52" y="464" width="1454" height="104" rx="10" fill="#FBFBFC" stroke="#D9E2E8" stroke-width="1.5"/>
<text x="76" y="506" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#1F2D3B" text-anchor="start" >DIRECT LAB → FIELD CARRIER TEST</text>
<text x="575" y="506" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#9A6252" text-anchor="start" >PASS  /  PASS  /  FAIL  /  STRUCTURAL STOP</text>
<text x="76" y="542" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#526679" text-anchor="start" >Frozen criterion: ≥3/4 panels; observed 2/4 → overall FAIL. Laboratory identity cannot be assumed to explain wild vertical niches.</text>
<text x="55" y="617" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#526679" text-anchor="start" >Source: BE public-causal-synthesis v1 and JAE v0.4.0 rc2. Cross-layer links are conceptual; no shared universal bat policy identified.</text>
</svg>
